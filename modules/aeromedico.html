<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-Aeromédico - Gestão de Insumos</title>
    
    <!-- 1. ESCUDO DE PROTEÇÃO PARA GOOGLE SITES (Evita crash fatal de LocalStorage em iframes restritos) -->
    <script>
        try { window.localStorage.getItem(''); } catch (e) {
            Object.defineProperty(window, 'localStorage', { value: { getItem: function() { return null; }, setItem: function() {}, removeItem: function() {} } });
        }
        try { window.sessionStorage.getItem(''); } catch (e) {
            Object.defineProperty(window, 'sessionStorage', { value: { getItem: function() { return null; }, setItem: function() {}, removeItem: function() {} } });
        }
        
        // Detetor visual de erros críticos para não deixar o utilizador num carregamento infinito
        window.addEventListener('error', function(event) {
            const root = document.getElementById('root');
            if(root && root.innerHTML.includes('A estabelecer ligação')) {
                root.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#f8fafc;padding:2rem;"><div style="background:#fee2e2;color:#991b1b;padding:2rem;border-radius:1rem;text-align:center;font-family:sans-serif;max-width:400px;"><b>Erro Crítico no Carregamento:</b><br/><br/>' + event.message + '<br/><br/><span style="font-size:11px;color:#ef4444;">Por favor, verifique a sua ligação à internet ou limpe a cache do navegador.</span></div></div>';
            }
        });
    </script>

    <!-- 2. BIBLIOTECAS ATUALIZADAS PARA SERVIDORES DE ALTA ESTABILIDADE (CDNJS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        @media (max-width: 768px) {
            .modal-content { border-radius: 1.5rem 1.5rem 0 0 !important; }
        }
        input, select, textarea { font-size: 16px !important; }
        .pointer-events-none { pointer-events: none; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex h-screen items-center justify-center bg-slate-50">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-blue-900 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-blue-900 font-bold animate-pulse uppercase tracking-tighter">A estabelecer ligação...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // O SEU URL DE IMPLANTAÇÃO DO GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsRBEHsZ6ngBlmLpB6_52Ho1iJwvcM1tL14O0RHuFfs2PEk4mr-mkZGSJqB57QEMp7/exec";

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const paths = {
                dashboard: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
                package: "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z M12 22V12",
                history: "M12 8v4l3 3 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                plus: "M12 5v14 M5 12h14",
                search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
                alert: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z",
                shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
                x: "M18 6L6 18 M6 6l12 12",
                sync: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15",
                clock: "M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
                wrench: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
                menu: "M4 6h16M4 12h16M4 18h16",
                download: "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            };
            return (
                <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d={paths[name] || ""}></path>
                </svg>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [authMode, setAuthMode] = useState('login'); 
            const [authLoading, setAuthLoading] = useState(false);

            const [activeTab, setActiveTab] = useState('dashboard');
            const [items, setItems] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            const [isSubmitting, setIsSubmitting] = useState(false);
            const isSubmittingRef = useRef(false);

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('item');
            const [selectedItem, setSelectedItem] = useState(null);
            const [movementType, setMovementType] = useState('saída');
            const [searchTerm, setSearchTerm] = useState('');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

            const formatBRDate = (dateString) => {
                if (!dateString) return '---';
                const [year, month, day] = dateString.split('T')[0].split('-');
                if (!year || !month || !day) return dateString;
                return `${day}/${month}/${year}`;
            };

            const stats = useMemo(() => {
                const currentYear = new Date().getFullYear();
                const criticalItems = items.filter(i => Number(i.currentStock) < Number(i.minStock));
                const expiredItems = items.filter(i => {
                    if (!i.expirationDate) return false;
                    const [year, month, day] = i.expirationDate.split('-');
                    if (!year || !month || !day) return false;
                    const expDate = new Date(year, month - 1, day);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0); 
                    return expDate < today;
                });
                const damageReports = transactions.filter(t => t.type === 'AVARIA' || t.type === 'ALTERAÇÃO' || t.type === 'MANUTENÇÃO');
                return { totalItems: items.length, criticalItems, expiredItems, totalMovements: transactions.length, damageReports };
            }, [items, transactions]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                const f = e.target;
                const payload = authMode === 'login' ? 
                    { rg: f.rg.value, password: f.password.value } : 
                    { rg: f.rg.value, warName: f.warName.value, graduation: f.graduation.value, password: f.password.value };
                
                try {
                    const action = authMode === 'login' ? 'loginUser' : 'registerUser';
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, [authMode === 'login' ? 'credentials' : 'user']: payload }) });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        if (authMode === 'login') {
                            setCurrentUser(data.user);
                        } else {
                            alert('Cadastro realizado com sucesso! Faça o login.');
                            setAuthMode('login');
                        }
                    } else {
                        alert(data.message || 'Erro de autenticação');
                    }
                } catch (err) {
                    alert("Erro de conexão ao servidor.");
                } finally {
                    setAuthLoading(false);
                }
            };

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                
                try {
                    const response = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
                    const data = await response.json();
                    
                    if (data.items) {
                        setItems(data.items.map(row => ({
                            id: row[0], name: String(row[1]), manufacturer: row[2], 
                            expirationDate: row[3] ? String(row[3]).split('T')[0] : '', 
                            lifespan: row[4], serialLot: row[5], 
                            currentStock: Number(row[6]) || 0, minStock: Number(row[7]) || 0
                        })));
                    }
                    if (data.transactions) {
                        setTransactions(data.transactions.map(row => ({
                            movementDate: row[0], itemName: row[1], type: row[2], quantity: Number(row[3]),
                            bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                            recorder: { warName: row[7], rg: row[9] || "Não Inf." },
                            reason: row[8]
                        })).reverse());
                    }
                } catch (e) { setError("Erro de ligação à base de dados. Tente novamente."); } 
                finally { setLoading(false); }
            };

            useEffect(() => { 
                if (currentUser) { fetchData(); }
            }, [currentUser]);

            const handleAction = async (action, payload) => {
                if (isSubmittingRef.current) return;
                isSubmittingRef.current = true;
                setIsSubmitting(true);
                
                try {
                    if (action === 'registerMovement') {
                        setItems(prev => prev.map(i => i.id === payload.trans.itemId ? { ...i, currentStock: payload.newStock } : i));
                        setTransactions(prev => [{
                            ...payload.trans,
                            recorder: { ...payload.trans.recorder, rg: payload.trans.recorder.rg || "Não Inf." }
                        }, ...prev]);
                    } else if (action === 'saveItem') {
                        setItems(prev => {
                            const exists = prev.find(i => i.id === payload.item.id);
                            if (exists) return prev.map(i => i.id === payload.item.id ? payload.item : i);
                            return [...prev, payload.item];
                        });
                    }

                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
                    setIsModalOpen(false);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    await fetchData();
                } catch (err) { 
                    alert("Falha na operação. Verifique a sua conexão."); 
                    await fetchData(); 
                } finally {
                    isSubmittingRef.current = false;
                    setIsSubmitting(false);
                }
            };

            const saveItem = (e) => {
                e.preventDefault();
                if (isSubmittingRef.current) return;
                const f = e.target;
                const item = {
                    id: selectedItem?.id || "ID-" + Date.now(),
                    name: f.name.value, manufacturer: f.manufacturer.value,
                    expirationDate: f.expirationDate.value, lifespan: 0,
                    serialLot: f.serialLot.value, currentStock: Number(f.currentStock.value), minStock: Number(f.minStock.value)
                };
                handleAction("saveItem", { item });
            };

            const registerMovement = (e) => {
                e.preventDefault();
                if (isSubmittingRef.current) return;
                
                const f = e.target;
                const item = items.find(i => i.id === f.itemId.value);
                const qty = Number(f.quantity.value);
                const finalType = modalType === 'damage' ? f.type_alt.value : movementType;
                
                const newStock = (finalType === 'AVARIA' || finalType === 'ALTERAÇÃO' || finalType === 'MANUTENÇÃO') 
                    ? item.currentStock : (finalType === 'entrada' ? item.currentStock + qty : item.currentStock - qty);
                
                if (newStock < 0) {
                    alert("Erro: Carga insuficiente para efetuar saída.");
                    return;
                }

                const trans = {
                    itemId: item.id, itemName: item.name, type: finalType,
                    quantity: qty, reason: f.reason.value, movementDate: f.movementDate.value,
                    bearer: { graduation: f.b_grad?.value || "---", warName: f.b_name?.value || "N/A", rg: f.b_rg?.value || "---" },
                    recorder: { warName: currentUser.warName, rg: currentUser.rg }
                };
                
                handleAction("registerMovement", { trans, newStock });
            };

            const filteredItems = useMemo(() => {
                const term = String(searchTerm || '').toLowerCase();
                return items.filter(i => 
                    String(i.name || '').toLowerCase().includes(term) || 
                    String(i.manufacturer || '').toLowerCase().includes(term) ||
                    String(i.serialLot || '').toLowerCase().includes(term)
                );
            }, [items, searchTerm]);

            const navigateToInventoryAndSearch = (term) => {
                setSearchTerm(String(term || ''));
                setActiveTab('inventory');
            };

            const generatePDF = () => {
                setIsGeneratingPDF(true);
                
                setTimeout(async () => {
                    const reportElement = document.getElementById('pdf-formal-report');
                    
                    const opt = {
                        margin:       10, 
                        filename:     `Relatorio_Necessidades_SIG-Aeromedico_${new Date().toISOString().split('T')[0]}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    
                    try {
                        await window.html2pdf().set(opt).from(reportElement).save();
                    } catch (error) {
                        alert('Erro ao gerar o relatório PDF. Verifique a ligação à internet.');
                    } finally {
                        setIsGeneratingPDF(false); 
                    }
                }, 500);
            };

            const NavItems = () => (
                <div className="space-y-2">
                    {[{id:'dashboard', l:'Início', i:'dashboard'}, {id:'inventory', l:'Prontuário', i:'package'}, {id:'movements', l:'Registros', i:'history'}].map(t => (
                        <button key={t.id} onClick={() => { setActiveTab(t.id); setIsMobileMenuOpen(false); }} className={`flex items-center gap-3 w-full p-4 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === t.id ? 'bg-blue-800 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                            <Icon name={t.i} /> {t.l}
                        </button>
                    ))}
                </div>
            );

            if (!currentUser) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 px-4">
                        <div className="bg-white w-full max-w-md rounded-[2rem] p-8 shadow-2xl animate-in fade-in zoom-in duration-500">
                            <div className="flex justify-center mb-6">
                                <div className="bg-blue-900 p-4 rounded-2xl shadow-lg"><Icon name="shield" className="text-white w-8 h-8" /></div>
                            </div>
                            <h2 className="text-2xl font-black text-center text-slate-800 uppercase tracking-tighter mb-2">SIG-Aeromédico</h2>
                            <p className="text-center text-xs font-bold text-slate-400 uppercase mb-8">{authMode === 'login' ? 'Acesso Restrito' : 'Registo de Militar'}</p>
                            
                            <form onSubmit={handleAuth} className="space-y-4">
                                {authMode === 'register' && (
                                    <div className="grid grid-cols-2 gap-3">
                                        <input name="graduation" required disabled={authLoading} placeholder="Graduação (Ex: Sgt)" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-[10px] font-bold uppercase outline-none focus:ring-4 focus:ring-blue-50" />
                                        <input name="warName" required disabled={authLoading} placeholder="Nome de Guerra" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-[10px] font-bold uppercase outline-none focus:ring-4 focus:ring-blue-50" />
                                    </div>
                                )}
                                <input name="rg" required disabled={authLoading} type="text" inputMode="numeric" pattern="[0-9]*" onInput={(e) => e.target.value = e.target.value.replace(/[^0-9]/g, '')} placeholder="RG do Militar (Apenas Números)" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold outline-none focus:ring-4 focus:ring-blue-50" />
                                <input name="password" required disabled={authLoading} type="password" placeholder="Senha" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold outline-none focus:ring-4 focus:ring-blue-50" />
                                
                                <button type="submit" disabled={authLoading} className="w-full py-4 bg-blue-900 text-white rounded-2xl font-black uppercase text-xs shadow-xl flex items-center justify-center gap-2 mt-2 hover:bg-blue-800 transition-colors disabled:opacity-50">
                                    {authLoading ? <Icon name="sync" className="animate-spin w-4 h-4" /> : null}
                                    {authLoading ? 'Aguarde...' : (authMode === 'login' ? 'Entrar no Sistema' : 'Criar Cadastro')}
                                </button>
                            </form>
                            
                            <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} disabled={authLoading} className="w-full mt-6 text-[10px] font-bold text-blue-600 uppercase tracking-widest hover:underline disabled:opacity-50">
                                {authMode === 'login' ? 'Não tem acesso? Cadastre-se' : 'Voltar para o Login'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden text-slate-800 bg-slate-50 flex-col lg:flex-row relative">
                    
                    {/* Header Mobile */}
                    <header className="lg:hidden bg-slate-900 text-white p-4 flex items-center justify-between z-50">
                        <div className="flex items-center gap-2"><Icon name="shield" className="text-blue-500" /><h1 className="font-black text-sm uppercase">SIG-Aeromédico</h1></div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2"><Icon name={isMobileMenuOpen ? "x" : "menu"} /></button>
                    </header>

                    {isMobileMenuOpen && (
                        <div className="lg:hidden fixed inset-0 z-40 bg-slate-900/95 pt-20 px-6 animate-in slide-in-from-top duration-300">
                            <div className="mb-6 bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Logado como</p>
                                <p className="font-black text-sm text-white uppercase">{currentUser.graduation} {currentUser.warName}</p>
                                <p className="text-[10px] font-bold text-slate-500 tracking-tighter mt-1">RG: {currentUser.rg}</p>
                                <button onClick={() => setCurrentUser(null)} className="mt-4 w-full py-3 bg-red-900/40 text-red-400 hover:text-white hover:bg-red-600 rounded-xl text-[10px] font-black uppercase transition-colors">Encerrar Sessão</button>
                            </div>
                            <NavItems />
                            <button onClick={fetchData} disabled={loading} className="w-full flex items-center justify-center gap-2 p-4 bg-slate-800 text-white rounded-xl text-[9px] font-bold uppercase border border-slate-700 mt-6 disabled:opacity-50">
                                <Icon name="sync" className={loading ? "animate-spin" : ""} /> Sincronizar Banco
                            </button>
                        </div>
                    )}

                    {/* Sidebar Desktop */}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 hidden lg:flex shadow-2xl">
                        <div className="flex items-center gap-3 mb-10"><div className="bg-blue-600 p-2 rounded-xl shadow-lg"><Icon name="shield" /></div><h1 className="font-black text-xl tracking-tighter uppercase">SIG-Aeromédico</h1></div>
                        <NavItems />
                        
                        <div className="mt-auto">
                            <div className="mb-4 bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                                <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Militar Autenticado</p>
                                <p className="font-black text-[11px] uppercase text-blue-400">{currentUser.graduation} {currentUser.warName}</p>
                                <p className="text-[9px] font-bold text-slate-500 tracking-tighter mt-1">RG: {currentUser.rg}</p>
                                <button onClick={() => setCurrentUser(null)} className="mt-3 w-full py-2 bg-slate-900 text-slate-400 hover:text-white hover:bg-red-900/80 rounded-lg text-[9px] font-black uppercase transition-colors">Sair / Logout</button>
                            </div>
                            <button onClick={fetchData} disabled={loading} className="w-full flex items-center justify-center gap-2 p-4 bg-slate-800 rounded-xl text-[9px] font-bold uppercase border border-slate-700 hover:bg-slate-700 transition-all disabled:opacity-50">
                                <Icon name="sync" className={loading ? "animate-spin" : ""} /> Sincronizar Banco
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
                            {error && <div className="bg-red-600 text-white p-4 text-center text-[10px] font-black uppercase rounded-2xl animate-pulse">{error}</div>}

                            {activeTab === 'dashboard' && (
                                <div className="max-w-6xl mx-auto space-y-6 animate-in fade-in duration-500">
                                    <div className="flex justify-between items-center bg-white p-4 md:p-6 rounded-[2rem] border shadow-sm">
                                        <div>
                                            <h2 className="text-sm md:text-lg font-black text-slate-800 uppercase tracking-tighter">Painel Operacional</h2>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase">Resumo da situação de carga</p>
                                        </div>
                                        <button 
                                            onClick={generatePDF} 
                                            disabled={isGeneratingPDF}
                                            className="bg-blue-900 text-white px-4 py-3 rounded-xl text-[10px] font-black uppercase flex items-center gap-2 shadow-lg hover:bg-blue-800 transition-colors disabled:opacity-50"
                                        >
                                            {isGeneratingPDF ? <Icon name="sync" className="animate-spin w-4 h-4" /> : <Icon name="download" className="w-4 h-4" />}
                                            <span className="hidden md:inline">{isGeneratingPDF ? 'A Gerar PDF...' : 'Emitir Relatório PDF'}</span>
                                            <span className="md:hidden">PDF</span>
                                        </button>
                                    </div>

                                    <div id="dashboard-content" className="space-y-6 pb-4 pt-2 px-2 md:px-0 rounded-2xl">
                                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-6">
                                            {[
                                                {l:'Carga', v:stats.totalItems, c:'blue-900'},
                                                {l:'Crítico', v:stats.criticalItems.length, c:'red-600', a:stats.criticalItems.length > 0},
                                                {l:'Vencidos', v:stats.expiredItems.length, c:'amber-700', a:stats.expiredItems.length > 0},
                                                {l:'Avarias', v:stats.damageReports.length, c:'orange-600', a:stats.damageReports.length > 0},
                                                {l:'Livro', v:stats.totalMovements, c:'slate-800'}
                                            ].map((s,i)=>(
                                                <div key={i} className={`bg-white p-5 rounded-[1.5rem] border shadow-sm text-center ${s.a?'bg-red-50/20 border-red-100 animate-pulse':''}`}>
                                                    <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">{s.l}</p>

                                            <input name="movementDate" required disabled={isSubmitting} type="date" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold h-14 disabled:opacity-50 outline-none" defaultValue={new Date().toISOString().split('T')[0]} />
                                            
                                            {modalType === 'movement' && (
                                                <div className={`p-5 bg-slate-50 rounded-[2rem] border space-y-3 shadow-inner ${isSubmitting ? 'opacity-50' : ''}`}>
                                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest text-center border-b pb-2 mb-2 leading-none">Militar Portador (Retirada)</p>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <input name="b_grad" required disabled={isSubmitting} placeholder="Graduação" className="p-3.5 bg-white border border-slate-200 rounded-xl text-[10px] font-bold uppercase h-12 outline-none" />
                                                        <input name="b_rg" required disabled={isSubmitting} type="text" inputMode="numeric" pattern="[0-9]*" onInput={(e) => e.target.value = e.target.value.replace(/[^0-9]/g, '')} placeholder="RG Militar" className="p-3.5 bg-white border border-slate-200 rounded-xl text-[10px] font-bold h-12 outline-none" />
                                                    </div>
                                                    <input name="b_name" required disabled={isSubmitting} placeholder="Nome Guerra do Portador" className="w-full p-3.5 bg-white border border-slate-200 rounded-xl text-[10px] font-bold h-12 uppercase outline-none" />
                                                </div>
                                            )}

                                            <div className={`p-5 bg-blue-50/50 rounded-[2rem] border border-blue-100 space-y-3 shadow-sm ${isSubmitting ? 'opacity-50' : ''}`}>
                                                <p className="text-[9px] font-black text-blue-900 uppercase tracking-widest text-center border-b border-blue-100 pb-2 mb-2 leading-none">Militar Registrador (Fiel)</p>
                                                <div className="text-center bg-white p-3 rounded-xl border border-blue-100">
                                                    <p className="font-black text-blue-900 uppercase text-xs">{currentUser.graduation} {currentUser.warName}</p>
                                                    <p className="text-[10px] font-bold text-slate-500 mt-0.5 tracking-tighter">RG: {currentUser.rg}</p>
                                                </div>
                                            </div>

                                            <div className="flex gap-3">
                                                <div className="w-24">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase mb-1 block">Qtd</label>
                                                    <input name="quantity" required disabled={isSubmitting} type="number" min="1" className="w-full p-4 bg-white border border-slate-200 rounded-2xl text-center font-black text-lg h-14 outline-none disabled:opacity-50" defaultValue={1} />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase mb-1 block">Finalidade / Detalhes</label>
                                                    <input name="reason" required disabled={isSubmitting} placeholder="Ex: Patrulhamento / Missão..." className="w-full p-4 bg-white border border-slate-200 rounded-2xl text-[10px] font-medium h-14 outline-none disabled:opacity-50" />
                                                </div>
                                            </div>
                                        </div>

                                        <button type="submit" disabled={isSubmitting} className={`w-full py-5 text-white rounded-3xl font-black uppercase text-[11px] shadow-xl h-16 flex items-center justify-center gap-2 ${modalType==='damage'?'bg-orange-600 shadow-orange-200':'bg-blue-900 shadow-blue-200'} ${isSubmitting ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                            {isSubmitting && <Icon name="sync" className="animate-spin w-4 h-4" />}
                                            {isSubmitting ? 'A PROCESSAR...' : 'Confirmar Lançamento'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

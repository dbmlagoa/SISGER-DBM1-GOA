                                            required
                                        />
                                        <div className="absolute right-1 inset-y-1 flex flex-col justify-center">
                                            <button type="button" onClick={() => setQuantidade(prev => prev + 1)} className="px-1 text-slate-600 hover:text-slate-950 leading-none text-[9px] font-black">▲</button>
                                            <button type="button" onClick={() => setQuantidade(prev => Math.max(1, prev - 1))} className="px-1 text-slate-600 hover:text-slate-950 leading-none text-[9px] font-black">▼</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="sm:col-span-3 relative">
                                    <label className="block font-bold text-slate-800 mb-1">Item:</label>
                                    <input
                                        type="text"
                                        value={itemSearchQuery}
                                        onChange={(e) => {
                                            setItemSearchQuery(e.target.value);
                                            setSelectedItem(null);
                                            setIsDropdownOpen(true);
                                        }}
                                        onFocus={() => setIsDropdownOpen(true)}
                                        className="w-full bg-white border-2 border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:border-blue-600 focus:outline-none"
                                        required
                                    />
                                    {isDropdownOpen && filteredItems.length > 0 && (
                                        <div className="absolute left-0 right-0 top-full mt-1 bg-white border-2 border-slate-300 rounded-xl shadow-xl z-50 max-h-44 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
                                            {filteredItems.map((it, idx) => (
                                                <div
                                                    key={it.id || idx}
                                                    onClick={() => {
                                                        setSelectedItem(it);
                                                        setItemSearchQuery(it.name);
                                                        setIsDropdownOpen(false);
                                                    }}
                                                    className="p-2 hover:bg-sand-100 cursor-pointer flex items-center justify-between text-xs"
                                                >
                                                    <span className="font-bold text-slate-900">{it.name}</span>
                                                    <span className="text-[10px] text-slate-500">{it.category}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Ocorrência / RAPH / TIH */}
                            <div className="p-3 rounded-xl bg-sand-50 border border-sand-300 space-y-2">
                                <label className="font-bold text-slate-800">Ocorrência do socorro (RAPH/TIH):</label>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    <div className="flex bg-slate-200 p-0.5 rounded-xl border border-slate-300 gap-1">
                                        {['RAPH', 'TIH', 'Outro'].map(opc => (
                                            <button
                                                key={opc}
                                                type="button"
                                                onClick={() => setTipoOcorrencia(opc)}
                                                className={`flex-1 py-1 rounded-lg text-xs font-bold transition-all ${
                                                    tipoOcorrencia === opc ? 'bg-white text-blue-700 font-black shadow-xs' : 'text-slate-700'
                                                }`}
                                            >
                                                {opc}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="sm:col-span-2">
                                        <input
                                            type="text"
                                            value={numDocumento}
                                            onChange={(e) => setNumDocumento(e.target.value)}
                                            placeholder="Nº do documento"
                                            className="w-full bg-white border-2 border-slate-300 rounded-xl px-3 py-1.5 text-xs font-mono font-bold text-slate-900 focus:outline-none"
                                            required={isPsicotropico}
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Reposição */}
                            <div className="p-3.5 rounded-xl bg-white border-2 border-slate-200 space-y-2">
                                <label className="block font-bold text-slate-900">Já retirou do depósito para repor a mochila?</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setJaRetirouDeposito(false)}
                                        className={`py-2 px-3 rounded-xl text-xs font-bold border-2 ${!jaRetirouDeposito ? 'bg-amber-50 border-amber-500 text-amber-950 font-black' : 'bg-white border-slate-300'}`}
                                    >
                                        Não — repor depois
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setJaRetirouDeposito(true)}
                                        className={`py-2 px-3 rounded-xl text-xs font-bold border-2 ${jaRetirouDeposito ? 'bg-emerald-50 border-emerald-500 text-emerald-950 font-black' : 'bg-white border-slate-300'}`}
                                    >
                                        Sim, já retirei
                                    </button>
                                </div>

                                {jaRetirouDeposito && (
                                    <div className="p-2 rounded-xl bg-emerald-50 border border-emerald-300 flex items-center justify-between gap-3 mt-2">
                                        <label className="font-bold text-emerald-950 text-xs">Qtd retirada do depósito:</label>
                                        <input
                                            type="number"
                                            min="1"
                                            value={qtdRetirada}
                                            onChange={(e) => setQtdRetirada(Math.max(1, parseInt(e.target.value) || 1))}
                                            className="w-24 bg-white border-2 border-emerald-400 rounded-xl px-2.5 py-1 text-xs font-black text-slate-900"
                                        />
                                    </div>
                                )}
                            </div>

                            {/* Observação */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1">Observação:</label>
                                <textarea
                                    rows="2"
                                    value={observacao}
                                    onChange={(e) => setObservacao(e.target.value)}
                                    className="w-full bg-white border-2 border-slate-300 rounded-xl p-2.5 text-xs text-slate-900 font-medium focus:outline-none"
                                ></textarea>
                            </div>

                            {/* Foto */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1">Foto:</label>
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handlePhotoUpload} className="hidden" />
                                <div className="flex items-center gap-2">
                                    <button
                                        type="button"
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="px-3 py-1.5 rounded-xl bg-white border-2 border-slate-300 hover:bg-slate-100 text-xs font-bold"
                                    >
                                        📷 {foto ? 'Alterar Foto' : 'Anexar Foto'}
                                    </button>
                                    {foto && (
                                        <button type="button" onClick={() => setFoto(null)} className="text-rose-600 hover:underline text-xs font-bold">
                                            Remover foto
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Botões */}
                            <div className="flex items-center gap-2 pt-3 border-t-2 border-slate-200">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold">
                                    Cancelar
                                </button>
                                <button type="submit" className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black shadow-md">
                                    Salvar Alterações
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // 5.2 Modal de Confirmação de Exclusão de Lançamento
        const ModalConfirmarExclusao = ({ isOpen, onClose, socorro, onConfirm }) => {
            if (!isOpen || !socorro) return null;

            const isRepor = socorro.reposto || socorro.jaRetirouDeposito || socorro.tipo === 'Reposição do depósito' || socorro.tipo === 'Reposição';
            const qtdEstorno = isRepor ? (Number(socorro.qtdRetirada || socorro.quantidade) || 1) : 0;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white border-2 border-rose-300 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        {/* Cabeçalho */}
                        <div className="flex items-center justify-between pb-2 border-b border-slate-200">
                            <h3 className="text-base font-black text-rose-800 flex items-center gap-2">
                                <span>⚠️</span>
                                <span>Confirmar Exclusão</span>
                            </h3>
                            <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-800 text-xl font-bold">×</button>
                        </div>

                        {/* Mensagem Padrão Obrigatória */}
                        <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-950 font-bold leading-relaxed">
                            Apagar este lançamento? (a exclusão fica na auditoria; se for reposição, o item volta ao saldo do depósito)
                        </div>

                        {/* Resumo do Lançamento a Apagar */}
                        <div className="p-3 rounded-xl bg-sand-50 border border-sand-300 text-xs space-y-1.5">
                            <div className="flex justify-between text-slate-700">
                                <span className="font-semibold">Item:</span>
                                <strong className="text-slate-900">{socorro.item || socorro.itemName} ×{socorro.quantidade}</strong>
                            </div>
                            <div className="flex justify-between text-slate-700">
                                <span className="font-semibold">Tipo:</span>
                                <span className="font-bold text-slate-900">{socorro.tipo || socorro.type}</span>
                            </div>
                            {socorro.raphTih && (
                                <div className="flex justify-between text-slate-700">
                                    <span className="font-semibold">Ocorrência:</span>
                                    <span className="font-bold text-amber-800">{socorro.raphTih}</span>
                                </div>
                            )}
                            <div className="flex justify-between text-slate-700">
                                <span className="font-semibold">Data / Hora:</span>
                                <span className="font-medium text-slate-800">
                                    {socorro.dataHora ? `${new Date(socorro.dataHora).toLocaleDateString('pt-BR')} ${new Date(socorro.dataHora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : 'Hoje'}
                                </span>
                            </div>
                        </div>

                        {/* Aviso sobre reversão de estoque */}
                        {qtdEstorno > 0 ? (
                            <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-xs text-emerald-950 font-bold flex items-start gap-2">
                                <span className="text-base">📦</span>
                                <div>
                                    <p className="font-black">Reversão Automática de Estoque:</p>
                                    <p className="font-medium text-emerald-900 mt-0.5">
                                        <strong>+{qtdEstorno} un</strong> de <em>"{socorro.item || socorro.itemName}"</em> retornarão ao saldo do Almoxarifado Central imediatamente.
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-[11px] text-slate-600 font-medium">
                                ℹ️ Este item estava marcado como "a repor" ou não deu saída do depósito; o estoque do Almoxarifado não será alterado.
                            </div>
                        )}

                        {/* Botões de Ação */}
                        <div className="flex items-center gap-2 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="flex-1 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold text-xs transition-all"
                            >
                                Cancelar
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    onConfirm(socorro);
                                    onClose();
                                }}
                                className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-black text-xs shadow-md shadow-rose-900/20 transition-all flex items-center justify-center gap-1.5"
                            >
                                <span>🗑️ Sim, apagar</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 5.3 Modal de Histórico de Movimentações da Página Socorros
        const ModalHistoricoSocorros = ({ 
            isOpen, 
            onClose, 
            socorrosList, 
            onEditLancamento, 
            onRequestDelete, 
            onReporLancamento 
        }) => {
            if (!isOpen) return null;

            const todayStr = new Date().toISOString().split('T')[0];
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const thirtyDaysAgoStr = thirtyDaysAgo.toISOString().split('T')[0];

            const [startDate, setStartDate] = useState(thirtyDaysAgoStr);
            const [endDate, setEndDate] = useState(todayStr);
            const [typeFilter, setTypeFilter] = useState('TODOS');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedPhoto, setSelectedPhoto] = useState(null);

            const handleQuickDate = (days) => {
                if (days === 'TODOS') {
                    setStartDate('2020-01-01');
                    setEndDate(todayStr);
                } else if (days === 'HOJE') {
                    setStartDate(todayStr);
                    setEndDate(todayStr);
                } else if (days === 'MES') {
                    const firstDay = new Date();
                    firstDay.setDate(1);
                    setStartDate(firstDay.toISOString().split('T')[0]);
                    setEndDate(todayStr);
                } else {
                    const d = new Date();
                    d.setDate(d.getDate() - days);
                    setStartDate(d.toISOString().split('T')[0]);
                    setEndDate(todayStr);
                }
            };

            const filteredHistory = useMemo(() => {
                return (socorrosList || []).filter(s => {
                    if (s.dataHora) {
                        const itemDateStr = String(s.dataHora).split('T')[0];
                        if (startDate && itemDateStr < startDate) return false;
                        if (endDate && itemDateStr > endDate) return false;
                    }

                    if (typeFilter !== 'TODOS') {
                        const t = s.tipo || s.type || 'Uso';
                        if (typeFilter === 'Uso' && (t !== 'Uso' && t !== 'USO')) return false;
                        if (typeFilter !== 'Uso' && t !== typeFilter) return false;
                    }

                    if (searchTerm.trim()) {
                        const q = searchTerm.toLowerCase();
                        const match = 
                            (s.item && s.item.toLowerCase().includes(q)) ||
                            (s.raphTih && s.raphTih.toLowerCase().includes(q)) ||
                            (s.numDocumento && s.numDocumento.toLowerCase().includes(q)) ||
                            (s.militar && s.militar.toLowerCase().includes(q)) ||
                            (s.obs && s.obs.toLowerCase().includes(q)) ||
                            (s.observacao && s.observacao.toLowerCase().includes(q));
                        if (!match) return false;
                    }

                    return true;
                });
            }, [socorrosList, startDate, endDate, typeFilter, searchTerm]);

            const stats = useMemo(() => {
                let utilizados = 0;
                let repostos = 0;
                let aRepor = 0;
                filteredHistory.forEach(s => {
                    const t = (s.tipo || s.type || 'Uso').toLowerCase();
                    const qtd = Number(s.quantidade) || 1;
                    const qtdRep = Number(s.qtdRetirada) || qtd;
                    if (t.includes('uso')) {
                        utilizados += qtd;
                        if (s.reposto || s.jaRetirouDeposito) repostos += qtdRep;
                        else aRepor += qtd;
                    } else if (t.includes('reposi')) {
                        repostos += qtd;
                    }
                });
                return { total: filteredHistory.length, utilizados, repostos, aRepor };
            }, [filteredHistory]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white border-2 border-slate-200 rounded-2xl max-w-4xl w-full p-4 sm:p-6 shadow-2xl max-h-[92vh] flex flex-col">
                        <div className="flex items-center justify-between pb-3 border-b-2 border-slate-200 shrink-0">
                            <div>
                                <h3 className="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
                                    <span>📜</span>
                                    <span>Histórico de Movimentações de Socorros</span>
                                </h3>
                                <p className="text-xs text-slate-500 font-medium mt-0.5">
                                    Consulta completa de lançamentos com filtros avançados por período, tipo e status.
                                </p>
                            </div>
                            <button type="button" onClick={onClose} className="p-1.5 rounded-lg text-slate-400 hover:text-slate-800 text-2xl font-black leading-none">×</button>
                        </div>

                        <div className="py-3.5 space-y-3 shrink-0 border-b border-slate-100">
                            <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                                <div className="sm:col-span-3">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">De (Data Inicial):</label>
                                    <input
                                        type="date"
                                        value={startDate}
                                        onChange={(e) => setStartDate(e.target.value)}
                                        className="w-full bg-white border-2 border-slate-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-900 focus:border-rose-600 focus:outline-none"
                                    />
                                </div>

                                <div className="sm:col-span-3">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Até (Data Final):</label>
                                    <input
                                        type="date"
                                        value={endDate}
                                        onChange={(e) => setEndDate(e.target.value)}
                                        className="w-full bg-white border-2 border-slate-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-900 focus:border-rose-600 focus:outline-none"
                                    />
                                </div>

                                <div className="sm:col-span-4">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Buscar por termo:</label>
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Item, RAPH, militar..."
                                        className="w-full bg-white border-2 border-slate-300 rounded-xl px-3 py-1.5 text-xs font-medium text-slate-900 focus:border-rose-600 focus:outline-none"
                                    />
                                </div>

                                <div className="sm:col-span-2">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Tipo:</label>
                                    <select
                                        value={typeFilter}
                                        onChange={(e) => setTypeFilter(e.target.value)}
                                        className="w-full bg-white border-2 border-slate-300 rounded-xl px-2 py-1.5 text-xs font-bold text-slate-900 focus:outline-none"
                                    >
                                        <option value="TODOS">Todos</option>
                                        <option value="Uso">Uso</option>
                                        <option value="Reposição do depósito">Reposição</option>
                                        <option value="Falta detectada">Falta</option>
                                        <option value="Avaria detectada">Avaria</option>
                                    </select>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 flex-wrap text-xs">
                                <span className="font-bold text-slate-500 text-[11px] mr-1">Atalhos:</span>
                                {[
                                    { label: 'Hoje', action: () => handleQuickDate('HOJE') },
                                    { label: 'Últimos 7 dias', action: () => handleQuickDate(7) },
                                    { label: 'Últimos 15 dias', action: () => handleQuickDate(15) },
                                    { label: 'Últimos 30 dias', action: () => handleQuickDate(30) },
                                    { label: 'Mês Atual', action: () => handleQuickDate('MES') },
                                    { label: 'Todos', action: () => handleQuickDate('TODOS') }
                                ].map(chip => (
                                    <button
                                        key={chip.label}
                                        type="button"
                                        onClick={chip.action}
                                        className="px-2.5 py-1 rounded-lg bg-sand-100 hover:bg-sand-200 text-slate-800 text-[11px] font-bold border border-sand-300 transition-colors"
                                    >
                                        {chip.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="py-2.5 shrink-0 flex items-center justify-between text-xs text-slate-700 font-bold bg-sand-50/70 px-3 rounded-xl border border-sand-200 flex-wrap gap-2">
                            <div className="flex items-center gap-3">
                                <span>Total: <strong className="text-slate-950">{stats.total}</strong> lançamentos</span>
                                <span>·</span>
                                <span>Utilizados: <strong className="text-blue-900">{stats.utilizados}</strong></span>
                                <span>·</span>
                                <span>Repostos: <strong className="text-emerald-900">{stats.repostos}</strong></span>
                                {stats.aRepor > 0 && (
                                    <>
                                        <span>·</span>
                                        <span className="text-amber-800">A repor: <strong>{stats.aRepor}</strong></span>
                                    </>
                                )}
                            </div>
                            <span className="text-[11px] text-slate-500 font-medium">
                                Período: {new Date(startDate + 'T00:00:00').toLocaleDateString('pt-BR')} até {new Date(endDate + 'T23:59:59').toLocaleDateString('pt-BR')}
                            </span>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar my-2 divide-y divide-slate-100 pr-1">
                            {filteredHistory.length === 0 ? (
                                <div className="py-12 text-center text-slate-500 text-xs">

                                if (res.voos && res.voos.length > 0) {
                                    const mappedVoos = res.voos.map((row, idx) => ({
                                        id: row[0] || `VOO-${idx + 1}`,
                                        data: row[1] ? String(row[1]).split('T')[0] : '',
                                        aeronave: row[2] || '',
                                        numEvento: row[3] || '',
                                        raph: row[4] || '',
                                        solicitante: row[5] || '',
                                        local: row[6] || '',
                                        tipo: row[7] || '',
                                        subtipo: row[8] || '',
                                        paciente: row[10] || '',
                                        idade: row[11] || '',
                                        sexo: row[12] || '',
                                        gravidade: row[13] || '',
                                        diagnostico: row[14] || '',
                                        hospital: row[16] || '',
                                        pilotos: row[17] || '',
                                        medicos: row[18] || '',
                                        enfermeiros: row[19] || '',
                                        partida: row[21] || '',
                                        regresso: row[22] || '',
                                        minutosVoo: Number(row[23]) || 0,
                                        obs: row[24] || ''
                                    }));
                                    setVoosList(mappedVoos);
                                }
                                if (res.checklistResumo && res.checklistResumo.length > 0) {
                                    setChecklistHistory(prev => {
                                        const existingIds = new Set(prev.map(p => p.id));
                                        const newItems = res.checklistResumo.filter(r => !existingIds.has(r.id));
                                        const combined = [...prev, ...newItems];
                                        try { safeLocalSet('sigaero_checklist_history', JSON.stringify(combined)); } catch(e){}
                                        return combined;
                                    });
                                }
                                if (res.passagens && res.passagens.length > 0) {
                                    const mappedPas = res.passagens.map((row, idx) => ({
                                        id: row[0] || `PAS-${idx + 1}`,
                                        data: row[1] ? String(row[1]).split('T')[0] : '',
                                        aeronave: row[2] || '',
                                        ocorrencias: row[3] || '',
                                        eletronicos: row[4] || '',
                                        psicotropicos: row[5] || '',
                                        base: row[6] || '',
                                        pendencias: row[7] || '',
                                        equipeTransmite: row[9] || '',
                                        rgTransmite: row[10] || '',
                                        equipeAssume: row[11] || '',
                                        rgAssume: row[12] || '',
                                        dataHora: row[13] || ''
                                    }));
                                    setPassagensList(mappedPas);
                                }
                            } else {
                                setSyncStatus('local');
                            }
                        }
                    } else {
                        setSyncStatus('local');
                    }
                };

                loadRemoteData();
                return () => { isMounted = false; };
            }, [scriptUrl]);

            // Handlers de Autenticação
            const handleLogin = (user) => {
                setOperator(user);
                safeSessionSet('sigaero_operator', JSON.stringify(user));
                showToast(`Bem-vindo, ${user.grad} ${user.warName}!`);
            };

            const handleRegister = async (newUser) => {
                setUsers(prev => [newUser, ...prev]);
                saveLocalRegisteredUser(newUser);
                setOperator(newUser);
                safeSessionSet('sigaero_operator', JSON.stringify(newUser));
                showToast(`Militar cadastrado com sucesso: ${newUser.grad} ${newUser.warName}!`);
                
                // Envio ao GAS com email e confirmação
                try {
                    const res = await callGAS(scriptUrl, 'registerOperator', newUser);
                    if (res && res.success) {
                        showToast(`Cadastro gravado na planilha: ${res.message || 'OK'}`);
                    }
                } catch(e) {
                    console.warn("Envio ao GAS em background:", e);
                }
            };

            const handleLogout = () => {
                safeSessionRemove('sigaero_operator');
                setOperator(null);
                showToast('Sessão encerrada com segurança.', 'info');
            };

            const handleSaveScriptUrl = (newUrl) => {
                setScriptUrl(newUrl);
                safeLocalSet('sigaero_script_url', newUrl);
                showToast('URL da planilha salva com sucesso!');
            };

            // Handlers de Negócio
            const handleSaveChecklist = async (record) => {
                setChecklistHistory(prev => {
                    const next = [record, ...prev];
                    try { safeLocalSet('sigaero_checklist_history', JSON.stringify(next)); } catch(e){}
                    return next;
                });
                
                // Interação direta com o Almoxarifado:
                // Baixa de Psicotrópicos repostos na aeronave
                if (record.psicotropicos && record.psicotropicos.length > 0) {
                    record.psicotropicos.forEach(med => {
                        const rep = Number(med.reposto) || 0;
                        if (rep > 0) {
                            setAlmoxItems(prev => {
                                return prev.map(item => {
                                    if (item.name.toLowerCase().includes(med.name.toLowerCase())) {
                                        const curStock = Number(item.currentStock) || 0;
                                        return { ...item, currentStock: Math.max(0, curStock - rep) };
                                    }
                                    return item;
                                });
                            });
                        }
                    });
                }

                // Alertas de Não Conformidade no Almoxarifado
                if (record.ncs && record.ncs.length > 0) {
                    setAlmoxItems(prev => {
                        return prev.map(item => {
                            const matchNC = record.ncs.find(nc => 
                                nc.itemName.toLowerCase().includes(item.name.toLowerCase()) || 
                                item.name.toLowerCase().includes(nc.itemName.toLowerCase())
                            );
                            if (matchNC) {
                                return {
                                    ...item,
                                    obs: (item.obs ? item.obs + " • " : "") + `[ALERTA CHECKLIST: ${matchNC.ncType}]`
                                };
                            }
                            return item;
                        });
                    });
                }

                showToast(`Checklist salvo! ${record.totalNCs} NC(s) registradas.`);

                // Gravação com rastreabilidade completa no Google Apps Script
                try {
                    // Grava na planilha indicando apenas as alterações relatadas
                    const alterations = (record.ncs || []).map(nc => ({
                        aba: nc.aba || "MATERIAIS",
                        nome: nc.itemName || nc.nome || "Item",
                        status: "NC",
                        tipoNc: nc.ncType || "NÃO CONFORME",
                        obs: nc.notes || "",
                        foto: nc.photo || ""
                    }));
                    const res = await callGAS(scriptUrl, 'saveChecklist', {
                        checklist: record,
                        alterations: alterations,
                        ncs: record.ncs,
                        totalConferidos: record.totalConferidos,
                        totalNCs: record.totalNCs,
                        psicotropicos: record.psicotropicos,
                        observacoes: record.observacoesGerais,
                        operator: {
                            grad: operator.grad,
                            warName: operator.warName,
                            rg: operator.rg,
                            email: operator.email,
                            role: operator.role
                        },
                        aeronave: record.aeronave,
                        data: record.data
                    });
                    if (res && res.success) {
                        showToast(`Checklist gravado com sucesso no banco de dados!`);
                    }
                } catch(e) {
                    console.warn("Erro ao salvar checklist no GAS:", e);
                }
            };

            const handleSaveSocorro = async (socorro) => {
                setSocorrosList(prev => [socorro, ...prev]);
                
                // Se já retirou do depósito para repor a mochila, dá baixa automática no Almoxarifado
                if (socorro.jaRetirouDeposito || socorro.reposto || socorro.reporAlmox) {
                    const qtdBaixar = Number(socorro.qtdRetirada || socorro.quantidade || 1);
                    setAlmoxItems(prev => {
                        return prev.map(item => {
                            if (item.name.toLowerCase() === socorro.item.toLowerCase() || (item.name && socorro.item.toLowerCase().includes(item.name.toLowerCase()))) {
                                const cur = Number(item.currentStock) || 0;
                                return { ...item, currentStock: Math.max(0, cur - qtdBaixar) };
                            }
                            return item;
                        });
                    });
                }

                showToast(`Lançamento de ${socorro.tipo || 'Socorro'} registrado com sucesso!`);
                try {
                    await callGAS(scriptUrl, 'registerSocorro', {
                        socorro: {
                            ...socorro,
                            itemName: socorro.item,
                            type: socorro.tipo,
                            quantity: socorro.quantidade,
                            reporAlmox: socorro.jaRetirouDeposito || socorro.reposto,
                            reporQtd: socorro.qtdRetirada || socorro.quantidade,
                            numEvento: socorro.numDocumento || socorro.numEvento || '---',
                            raphTih: socorro.raphTih || '---',
                            ocorrTipo: socorro.tipoOcorrencia || 'Atendimento Aeromédico',
                            obs: socorro.observacao || socorro.obs || ''
                        },
                        operator: operator
                    });
                } catch(e) {
                    console.warn("Erro ao salvar lançamento no GAS:", e);
                }
            };

            const handleReporLancamento = async (soc) => {
                const qtdSugerida = soc.quantidade || 1;
                const qtdInput = prompt(`📦 Confirmar reposição do depósito para a mochila:\n\nItem: ${soc.item}\nQuantidade a retirar do almoxarifado:`, qtdSugerida);
                if (qtdInput === null) return;
                const qtdReposta = Number(qtdInput) || Number(qtdSugerida) || 1;

                // 1. Atualiza registro na lista de lançamentos de socorros
                setSocorrosList(prev => prev.map(s => {
                    if (s.id === soc.id) {
                        return {
                            ...s,
                            jaRetirouDeposito: true,
                            reposto: true,
                            statusRepor: 'REPOSTO',
                            qtdRetirada: qtdReposta,
                            dataHoraReposto: new Date().toISOString()
                        };
                    }
                    return s;
                }));

                // 2. Dá baixa automática imediata no saldo do Almoxarifado
                setAlmoxItems(prev => prev.map(item => {
                    if (item.name.toLowerCase() === soc.item.toLowerCase() || (item.name && soc.item.toLowerCase().includes(item.name.toLowerCase()))) {
                        const cur = Number(item.currentStock) || 0;
                        return { ...item, currentStock: Math.max(0, cur - qtdReposta) };
                    }
                    return item;
                }));

                showToast(`Insumo reposto do depósito (${soc.item})! Baixa de ${qtdReposta} un no Almoxarifado.`);

                // 3. Sincroniza com Google Apps Script
                try {
                    await callGAS(scriptUrl, 'registerSocorro', {
                        socorro: {
                            ...soc,
                            type: 'Reposição do depósito',
                            reporAlmox: true,
                            reporQtd: qtdReposta,
                            obs: `[REPOSIÇÃO REALIZADA EM ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')}] ${soc.observacao || soc.obs || ''}`
                        },
                        operator: operator
                    });
                } catch(e) {
                    console.warn("Erro ao sincronizar reposição no GAS:", e);
                }
            };

            const handleDeleteSocorro = async (soc) => {
                if (!soc) return;
                const isRepor = soc.reposto || soc.jaRetirouDeposito || soc.tipo === 'Reposição do depósito' || soc.tipo === 'Reposição';
                const qtdEstorno = isRepor ? (Number(soc.qtdRetirada || soc.quantidade) || 1) : 0;

                // 1. Se for reposição ou tiver retirado do depósito, o item volta ao saldo do Almoxarifado
                if (qtdEstorno > 0) {
                    setAlmoxItems(prev => {
                        return prev.map(item => {
                            if (item.name.toLowerCase() === soc.item.toLowerCase() || (item.name && soc.item.toLowerCase().includes(item.name.toLowerCase()))) {
                                const cur = Number(item.currentStock) || 0;
                                return { ...item, currentStock: cur + qtdEstorno };
                            }
                            return item;
                        });
                    });
                }

                // 2. Remove da lista de socorros
                setSocorrosList(prev => prev.filter(s => s.id !== soc.id));

                showToast(`Lançamento excluído com sucesso! ${qtdEstorno > 0 ? `Estornadas +${qtdEstorno} un no Almoxarifado.` : ''}`);

                // 3. Sincroniza com Google Apps Script e registra auditoria
                try {
                    await callGAS(scriptUrl, 'deleteSocorro', {
                        socorro: soc,
                        operator: operator,
                        qtdEstorno: qtdEstorno
                    });
                } catch(e) {
                    console.warn("Erro ao sincronizar exclusão no GAS:", e);
                }
            };

            const handleUpdateSocorro = async (updatedSoc, deltaStock) => {
                if (!updatedSoc) return;

                // 1. Ajusta saldo do Almoxarifado conforme a variação delta
                if (deltaStock !== 0) {
                    setAlmoxItems(prev => {
                        return prev.map(item => {
                            if (item.name.toLowerCase() === updatedSoc.item.toLowerCase() || (item.name && updatedSoc.item.toLowerCase().includes(item.name.toLowerCase()))) {
                                const cur = Number(item.currentStock) || 0;
                                return { ...item, currentStock: Math.max(0, cur - deltaStock) };
                            }
                            return item;
                        });
                    });
                }

                // 2. Atualiza item na lista de socorros
                setSocorrosList(prev => prev.map(s => s.id === updatedSoc.id ? updatedSoc : s));

                showToast(`Lançamento atualizado com sucesso! ${deltaStock !== 0 ? `Estoque ajustado (${deltaStock > 0 ? `-${deltaStock}` : `+${Math.abs(deltaStock)}`}).` : ''}`);

                // 3. Sincroniza alteração no GAS
                try {
                    await callGAS(scriptUrl, 'updateSocorro', {
                        socorro: updatedSoc,
                        operator: operator,
                        deltaStock: deltaStock
                    });
                } catch(e) {
                    console.warn("Erro ao atualizar socorro no GAS:", e);
                }
            };

            const handleConfirmMovimento = (mov) => {
                setAlmoxItems(prev => {
                    return prev.map(item => {
                        if (item.id === mov.itemId) {
                            return {
                                ...item,
                                currentStock: mov.newStock,
                                serialLot: mov.lot || item.serialLot,
                                expirationDate: mov.expiry || item.expirationDate
                            };
                        }
                        return item;
                    });
                });

                showToast(`Estoque atualizado: ${mov.itemName} (${mov.curStock} -> ${mov.newStock})!`);
                callGAS(scriptUrl, 'moveAlmox', { mov });
            
                // Registra movimentação no histórico de conferência
                const newMovRec = {
                    id: `MOV-${Date.now()}`,
                    dataHora: new Date().toISOString(),
                    itemId: mov.itemId,
                    itemName: mov.itemName,
                    tipo: mov.type || 'SAIDA',
                    quantidade: Number(mov.quantity) || 1,
                    saldoAnterior: mov.curStock,
                    saldoNovo: mov.newStock,
                    motivo: mov.reason || 'Movimentação Almoxarifado',
                    responsavel: operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico'
                };
                setAlmoxMovements(prev => {
                    const next = [newMovRec, ...prev];
                    try { localStorage.setItem('sigaero_almox_movements', JSON.stringify(next.slice(0, 500))); } catch(e) {}
                    return next;
                });
            };

            const handleSavePedidoMensal = async (pedidoData) => {
                if (!pedidoData) return;
                setPedidosEmitidos(prev => {
                    const next = {
                        ...prev,
                        [pedidoData.competencia]: {
                            data: new Date().toLocaleDateString('pt-BR'),
                            militar: operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico'
                        }
                    };
                    try { localStorage.setItem('sigaero_pedidos_emitidos', JSON.stringify(next)); } catch(e) {}
                    return next;
                });
                showToast(`Pedido mensal da competência ${pedidoData.competencia} gerado com sucesso!`);
                try {
                    await callGAS(scriptUrl, 'savePedidoMensal', {
                        pedido: pedidoData,
                        operator: operator
                    });
                } catch(e) {
                    console.warn("Erro ao salvar pedido mensal no GAS:", e);
                }
            };

            const handleSaveNovoItem = (newItem) => {
                setAlmoxItems(prev => [newItem, ...prev]);
                showToast(`Novo item adicionado: ${newItem.name}!`);
                callGAS(scriptUrl, 'saveAlmoxItem', { item: newItem });
            };

            const handleSaveNovoVoo = (voo) => {
                setVoosList(prev => [voo, ...prev]);
                showToast(`Missão aérea salva (${voo.minutosVoo} min voados)!`);
                callGAS(scriptUrl, 'saveVoo', { voo });
            };

            const handleSaveNovaPassagem = (pas) => {
                setPassagensList(prev => [pas, ...prev]);
                showToast('Plantão transmitido e registrado no sistema!');
                callGAS(scriptUrl, 'savePassagem', { passagem: pas });
            };

            // Contagens para Badges do Menu
            const criticalStockCount = useMemo(() => {
                return almoxItems.filter(i => Number(i.currentStock) <= Number(i.minStock)).length;
            }, [almoxItems]);

            const expiryAlertCount = useMemo(() => {
                return almoxItems.filter(i => {
                    const days = getDaysUntilExpiry(i.expirationDate);
                    return days !== null && days <= 60;
                }).length;
            }, [almoxItems]);

            // Se não autenticado, renderiza tela de login
            if (!operator) {
                return (
                    <>
                        <LoginScreen 
                            onLogin={handleLogin} 
                            onRegister={handleRegister} 
                            users={users} 
                            scriptUrl={scriptUrl}
                        />
                        {toast && (
                            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 border animate-in slide-in-from-bottom duration-200 ${
                                toast.type === 'error' ? 'bg-red-950 text-red-200 border-red-800' :
                                toast.type === 'info' ? 'bg-sky-950 text-sky-200 border-sky-800' :
                                'bg-emerald-950 text-emerald-200 border-emerald-800'
                            }`}>
                                <Icon name={toast.type === 'error' ? 'alert' : 'check'} className="w-4 h-4" />
                                <span>{toast.message}</span>
                            </div>
                        )}
                    </>
                );
            }

            return (
                <div className="min-h-screen bg-sand-100 text-slate-900 flex flex-col">
                    {/* Cabeçalho Superior */}
                    <Header
                        operator={operator}
                        onLogout={handleLogout}
                        onOpenSettings={() => setIsSettingsOpen(true)}
                        syncStatus={syncStatus}
                        onToggleMobileMenu={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    />

                    {/* Layout Principal: Sidebar + Conteúdo */}
                    <div className="flex-1 flex overflow-hidden">
                        <Sidebar
                            activeTab={activeTab}
                            onSelectTab={setActiveTab}
                            isMobileOpen={isMobileMenuOpen}
                            onCloseMobile={() => setIsMobileMenuOpen(false)}
                            criticalStockCount={criticalStockCount}
                            expiryAlertCount={expiryAlertCount}
                            pendingChecklists={0}
                        />

                        {/* Conteúdo Central */}
                        <main className="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto custom-scrollbar pb-24 lg:pb-8">
                            {activeTab === 'dashboard' && (
                                <TabDashboard
                                    operator={operator}
                                    almoxItems={almoxItems}
                                    checklistHistory={checklistHistory}
                                    socorrosList={socorrosList}
                                    voosList={voosList}
                                    onNavigate={setActiveTab}
                                    onOpenNewSocorro={() => setIsNovoSocorroOpen(true)}
                                    onOpenMovimento={(item) => setMovModalData({ isOpen: true, item })}
                                />
                            )}

                            {activeTab === 'checklist' && (
                                <TabChecklist
                                    checklistCatalog={checklistCatalog}
                                    onSaveChecklist={handleSaveChecklist}
                                    operator={operator}
                                    checklistHistory={checklistHistory}
                                    onOpenNCModal={(item, currentNC, onSave) => {
                                        setNcModalData({ isOpen: true, item, currentNC, onSave });
                                    }}
                                    scriptUrl={scriptUrl}
                                    showToast={showToast}
                                />
                            )}

                            {activeTab === 'socorros' && (
                                <TabSocorros
                                    socorrosList={socorrosList}
                                    onOpenNewSocorro={() => setIsNovoSocorroOpen(true)}
                                    onOpenHistorico={() => setIsHistoricoOpen(true)}
                                    operator={operator}
                                    onReporLancamento={handleReporLancamento}
                                    onEditLancamento={(soc) => setEditSocorroData({ isOpen: true, socorro: soc })}
                                    onRequestDelete={(soc) => setDeleteModalData({ isOpen: true, socorro: soc })}
                                />
                            )}

                            {activeTab === 'almoxarifado' && (
                                <TabAlmoxarifado
                                    almoxItems={almoxItems}
                                    onOpenMovimento={(item) => setMovModalData({ isOpen: true, item })}
                                    onOpenNovoItem={() => setIsNovoItemOpen(true)}
                                    onOpenPedidoMensal={() => setIsPedidoMensalOpen(true)}
                                    onOpenConferencia={() => setIsConferenciaOpen(true)}
                                    operator={operator}
                                />
                            )}

                            {activeTab === 'voos' && (
                                <TabVoos
                                    voosList={voosList}
                                    onOpenNovoVoo={() => setIsNovoVooOpen(true)}
                                />
                            )}

                            {activeTab === 'estatisticas' && (
                                <TabEstatisticas
                                    voosList={voosList}
                                    operator={operator}
                                />
                            )}

                            {activeTab === 'passagem' && (
                                <TabPassagem
                                    passagensList={passagensList}
                                    onSavePassagem={handleSavePassagem}
                                    operator={operator}
                                />
                            )}
                        </main>
                    </div>

                    {/* Barra de Navegação Rápida Inferior para Smartphones */}
                    <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-800 px-2 py-1.5 flex items-center justify-around z-40">
                        {[
                            { id: 'dashboard', label: 'Resumo', icon: 'dashboard' },
                            { id: 'checklist', label: 'Checklist', icon: 'checklist' },
                            { id: 'socorros', label: 'Socorros', icon: 'socorros' },
                            { id: 'almoxarifado', label: 'Almox', icon: 'almoxarifado' },
                            { id: 'voos', label: 'Voos', icon: 'voos' }
                        ].map(t => {
                            const active = activeTab === t.id;
                            return (
                                <button
                                    key={t.id}
                                    type="button"
                                    onClick={() => setActiveTab(t.id)}
                                    className={`flex flex-col items-center py-1 px-2 rounded-xl transition-all ${
                                        active ? 'text-rose-400 font-extrabold' : 'text-slate-400 font-medium'
                                    }`}
                                >
                                    <Icon name={t.icon} className="w-5 h-5" />
                                    <span className="text-[10px] mt-0.5">{t.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* Modais do Sistema */}
                    <ModalSettings
                        isOpen={isSettingsOpen}
                        onClose={() => setIsSettingsOpen(false)}
                        scriptUrl={scriptUrl}
                        onSaveScriptUrl={handleSaveScriptUrl}
                    />

                    <ModalNC
                        isOpen={ncModalData.isOpen}
                        onClose={() => setNcModalData({ isOpen: false, item: null, currentNC: null, onSave: null })}
                        item={ncModalData.item}
                        currentNC={ncModalData.currentNC}
                        onSave={(updated) => {
                            if (ncModalData.onSave) ncModalData.onSave(updated);
                        }}
                    />

                    <ModalMovimento
                        isOpen={movModalData.isOpen}
                        onClose={() => setMovModalData({ isOpen: false, item: null })}
                        item={movModalData.item}
                        onConfirm={handleConfirmMovimento}
                        operator={operator}
                    />

                    <ModalNovoItem
                        isOpen={isNovoItemOpen}
                        onClose={() => setIsNovoItemOpen(false)}
                        onSave={handleSaveNovoItem}
                    />

                    <ModalPedidoMensal
                        isOpen={isPedidoMensalOpen}
                        onClose={() => setIsPedidoMensalOpen(false)}
                        almoxItems={almoxItems}
                        operator={operator}
                        pedidosEmitidos={pedidosEmitidos}
                        onSavePedido={handleSavePedidoMensal}
                    />

                    <ModalConferenciaAlmox
                        isOpen={isConferenciaOpen}
                        onClose={() => setIsConferenciaOpen(false)}
                        almoxItems={almoxItems}
                        almoxMovements={almoxMovements}
                        socorrosList={socorrosList}
                        operator={operator}
                    />

                    <ModalNovoSocorro
                        isOpen={isNovoSocorroOpen}
                        onClose={() => setIsNovoSocorroOpen(false)}
                        almoxItems={almoxItems}
                        checklistCatalog={checklistCatalog}
                        onSave={handleSaveSocorro}
                        operator={operator}
                    />

                    <ModalHistoricoSocorros
                        isOpen={isHistoricoOpen}
                        onClose={() => setIsHistoricoOpen(false)}
                        socorrosList={socorrosList}
                        onEditLancamento={(soc) => setEditSocorroData({ isOpen: true, socorro: soc })}
                        onRequestDelete={(soc) => setDeleteModalData({ isOpen: true, socorro: soc })}
                        onReporLancamento={handleReporLancamento}
                    />

                    <ModalConfirmarExclusao
                        isOpen={deleteModalData.isOpen}
                        onClose={() => setDeleteModalData({ isOpen: false, socorro: null })}
                        socorro={deleteModalData.socorro}
                        onConfirm={handleDeleteSocorro}
                    />

                    <ModalEditarSocorro
                        isOpen={editSocorroData.isOpen}
                        onClose={() => setEditSocorroData({ isOpen: false, socorro: null })}
                        socorro={editSocorroData.socorro}
                        almoxItems={almoxItems}
                        checklistCatalog={checklistCatalog}
                        onSave={handleUpdateSocorro}
                        operator={operator}
                    />

                    <ModalNovoVoo
                        isOpen={isNovoVooOpen}
                        onClose={() => setIsNovoVooOpen(false)}
                        onSave={handleSaveNovoVoo}
                        operator={operator}
                    />



                    {/* Notificação Toast */}
                    {toast && (
                        <div className={`fixed bottom-20 lg:bottom-6 right-6 z-50 px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2.5 border backdrop-blur-md animate-in slide-in-from-bottom duration-200 ${
                            toast.type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' :
                            toast.type === 'info' ? 'bg-sky-950/90 text-sky-200 border-sky-800' :
                            'bg-emerald-950/90 text-emerald-200 border-emerald-800'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert' : 'check'} className="w-4 h-4 shrink-0" />
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        // Renderização no Elemento Raiz
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                    return data;
                }

                const init = {};

                    init[item.id] = {

                        notes: '',

            // Estado da Tabela de Psicotrópicos com conciliação automática por localização
            const [psicoState, setPsicoState] = useState([

                { name: "Flumazenil", controle: 9, sos1: 9, vencidos: 0, reserva: 0, aw169: 0, utilizados: 0, reposto: 0, obs: "" },
                { name: "Midazolam", controle: 25, sos1: 25, vencidos: 0, reserva: 0, aw169: 0, utilizados: 0, reposto: 0, obs: "" },
                { name: "Morfina", controle: 22, sos1: 22, vencidos: 0, reserva: 0, aw169: 0, utilizados: 0, reposto: 0, obs: "" },

            const handlePsicoChange = (index, field, value) => {

                return checklistCatalog.filter(item => item.aba === 'MATERIAIS');

            const filteredItems = useMemo(() => {
                if (activeSubTab === 'MATERIAIS') {
                    if (containerFilter === 'TODOS') return materiaisItems;
                    return materiaisItems.filter(item => item.grupo === containerFilter);

                    if (eletFilter === 'TODOS') return eletronicosItems;
                    return eletronicosItems.filter(item => item.sos === eletFilter);

                return [];
            }, [activeSubTab, containerFilter, eletFilter, materiaisItems, eletronicosItems]);

            // Contadores de itens conferidos
            const countMateriaisChecked = useMemo(() => {
                return materiaisItems.filter(it => checkState[it.id] && checkState[it.id].status !== 'UNCHECKED').length;
            }, [materiaisItems, checkState]);

            const count1SosChecked = useMemo(() => {
                return eletronicosItems
                    .filter(it => it.sos === '1º SOS')

                return eletronicosItems
                    .filter(it => it.sos === '2º SOS')
                    .filter(it => checkState[it.id] && checkState[it.id].status !== 'UNCHECKED').length;

            const totalEletronicosChecked = count1SosChecked + count2SosChecked;

            // Agrupamento de eletrônicos por Categoria
            const eletronicosByGroup = useMemo(() => {
                const map = {};
                filteredItems.forEach(item => {
                    const g = item.grupo || 'OUTROS';

                    map[g].push(item);

            }, [filteredItems]);

            // Construtor do Registro Consolidado do Checklist
            const buildCurrentRecord = () => {
                const ncs = [];

                checklistCatalog.forEach(item => {
                    const st = checkState[item.id] || { status: 'UNCHECKED' };
                    allCheckedList.push({
                        id: item.id,
                        nome: item.name,
                        name: item.name,
                        aba: item.aba,
                        grupo: item.grupo,
                        status: st.status || 'UNCHECKED',
                        ncType: st.ncType || '',
                        obs: st.notes || '',
                        foto: st.photo || null
                    });
                    if (st.status === 'NC') {
                        ncs.push({
                            itemId: item.id,
                            itemName: item.name,
                            aba: item.aba,
                            grupo: item.grupo,
                            ncType: st.ncType || 'NÃO CONFORME',
                            notes: st.notes || '',
                            photo: st.photo || null
                        });
                    }
                });

                return {
                    id: `CHK-${Date.now()}`,
                    data: new Date().toISOString(),
                    aeronave: selectedAircraft,
                    
                    operator: operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico',
                    rg: operator ? operator.rg : '---',
                    email: operator ? operator.email : '',
                    observacoesGerais: observacoesGerais,
                    totalConferidos: allCheckedList.filter(it => it.status !== 'UNCHECKED').length,
                    totalCatalogo: checklistCatalog.length,
                    totalNCs: ncs.length,
                    ncs: ncs,
                    items: allCheckedList,
                    psicotropicos: psicoState
                };
            };

            // Salvar Checklist do Plantão (exige checklist COMPLETO de todos os 210 itens)
            const handleSaveCurrentChecklist = () => {
                const uncheckedMateriais = materiaisItems.filter(it => !checkState[it.id] || checkState[it.id].status === 'UNCHECKED').length;
                const uncheckedElet = eletronicosItems.filter(it => !checkState[it.id] || checkState[it.id].status === 'UNCHECKED').length;
                const totalUnchecked = uncheckedMateriais + uncheckedElet;

                if (totalUnchecked > 0) {
                    alert(
                        `⚠️ CHECKLIST INCOMPLETO!\n\n` +
                        `Ainda restam ${totalUnchecked} item(ns) na posição "NÃO CHECADO" (${uncheckedMateriais} em Materiais e ${uncheckedElet} em Eletrônicos).\n\n` +

                        `Você pode checar item a item com [V] ou [X], ou clicar no botão "✓ Conferir Todos".`

                    return;
                }

                const record = buildCurrentRecord();
                record.isCompleto = true;
                record.totalConferidos = checklistCatalog.length; // 210
                onSaveChecklist(record);
            };

                pdfContainer.style.backgroundColor = '#ffffff';

                    : '<tr><td colspan="3" style="padding:8px;border:1px solid #cbd5e1;text-align:center;color:#16a34a;font-weight:bold;">✓ Nenhuma Não Conformidade apontada. Todos os itens operacionais e conformes.</td></tr>';

                    const total = (Number(p.sos1)||0) + (Number(p.vencidos)||0) + (Number(p.reserva)||0) + (Number(p.aw169)||0);
                    const conf = total === p.controle;
                    return `<tr>
                        <td style="padding:4px 6px;border:1px solid #cbd5e1;font-weight:bold;color:#0f172a;">${p.name}</td>

                    <table style="width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:14px;">

                    const isComplete = rec.isCompleto === true || totalConf >= totalCat;
                    return recDate === todayStr && recAero === selectedAircraft && isComplete && totalConf >= 210;

            // Função para verificar se a data está dentro dos últimos N dias (4 dias por padrão)
            const isWithinLastNDays = (dateString, nDays = 4) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return false;
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - (nDays - 1));
                cutoff.setHours(0, 0, 0, 0);
                return d >= cutoff;
            };

                return listWithin4Days.filter(s => {

                        (s.tipo && s.tipo.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.raphTih && s.raphTih.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.numDocumento && s.numDocumento.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.numEvento && s.numEvento.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.paciente && s.paciente.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.militar && s.militar.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.obs && s.obs.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (s.observacao && s.observacao.toLowerCase().includes(searchTerm.toLowerCase()));

                        matchRepor = s.statusRepor === 'A_REPOR' || (s.reposto === false && s.jaRetirouDeposito === false);

                        matchRepor = s.reposto === true || s.jaRetirouDeposito === true || s.statusRepor === 'REPOSTO';

                    return matchSearch && matchType && matchRepor;

                                    onChange={(e) => setSearchTerm(e.target.value)}

                                    className="w-full bg-white border-2 border-slate-300 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-900 font-semibold placeholder-slate-400 focus:outline-none focus:border-rose-600"
                                />
                                <div className="absolute left-3 top-3 text-slate-500">
                                    <Icon name="search" className="w-4 h-4" />
                                </div>
                            </div>

                            {/* Filtro por Tipo de Lançamento */}
                            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                                {['TODOS', 'Uso', 'Reposição do depósito', 'Falta detectada', 'Avaria detectada'].map(t => (
                                    <button
                                        key={t}
                                        type="button"
                                        onClick={() => setTypeFilter(t)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                                            typeFilter === t
                                                ? 'bg-rose-700 text-white shadow-sm'
                                                : 'bg-white text-slate-800 hover:bg-slate-100 border-2 border-slate-300 font-bold'
                                        }`}
                                    >
                                        {t === 'Reposição do depósito' ? 'Reposição' : t}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center gap-2 shrink-0 flex-wrap">
                            {/* Filtro A Repor */}
                            <button
                                type="button"
                                onClick={() => setReporFilter(prev => prev === 'A_REPOR' ? 'TODOS' : 'A_REPOR')}
                                className={`px-3 py-2 rounded-xl text-xs font-extrabold border-2 transition-all flex items-center gap-1.5 ${
                                    reporFilter === 'A_REPOR'
                                        ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm'
                                        : 'bg-white text-slate-800 hover:bg-amber-50 border-slate-300'
                                }`}
                                title="Filtrar itens pendentes de reposição na mochila"
                            >
                                <span>📦 A Repor</span>
                                {countARepor > 0 && (
                                    <span className="px-1.5 py-0.2 rounded-full bg-slate-900 text-white text-[10px] font-black">
                                        {countARepor}
                                    </span>
                                )}
                            </button>

                            {/* Botão Histórico com filtro por data */}
                            <button
                                type="button"
                                onClick={onOpenHistorico}
                                className="px-3.5 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-extrabold text-xs transition-all flex items-center justify-center gap-1.5 shadow-xs"
                                title="Consultar histórico completo de movimentações com filtro por data"
                            >
                                <span className="text-sm">📜</span>
                                <span>Histórico</span>
                            </button>

                            {/* Botão Registrar Lançamento */}
                            <button
                                type="button"
                                onClick={onOpenNewSocorro}
                                className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black text-xs shadow-md shadow-rose-900/20 transition-all flex items-center justify-center gap-2"
                            >
                                <span className="text-base font-black leading-none">➕</span>
                                <span>Registrar Lançamento</span>
                            </button>
                        </div>
                    </div>

                    {/* Container da Linha do Tempo em Formato de Lista (Últimos 4 dias) */}
                    <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
                        {/* Cabeçalho da Linha do Tempo */}
                        <div className="border-b border-slate-100 pb-3">
                            <div className="flex items-center justify-between gap-3 flex-wrap">
                                <h3 className="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
                                    <span className="text-slate-800 text-base">🕒</span>
                                    <span>Linha do tempo (últimos 4 dias)</span>
                                </h3>
                                <span className="text-xs text-slate-500 font-semibold bg-sand-50 px-2.5 py-1 rounded-lg border border-sand-300">
                                    {visibleList.length} registro(s) exibido(s)
                                </span>
                            </div>
                            <p className="text-xs font-bold text-slate-600 mt-1">
                                Hoje: <strong className="text-slate-900">{todayStats.utilizados}</strong> utilizados · <strong className="text-slate-900">{todayStats.repostos}</strong> repostos{todayStats.aRepor > 0 ? <span> · <strong className="text-amber-800">{todayStats.aRepor}</strong> a repor</span> : ''}
                            </p>
                        </div>

                        {/* Lista de Registros */}
                        {visibleList.length === 0 ? (
                            <div className="p-8 text-center text-slate-500 text-xs space-y-2">
                                <p className="font-bold text-slate-700">Nenhum lançamento registrado nos últimos 4 dias.</p>
                                <p className="text-slate-500">Clique em "Registrar Lançamento" para iniciar ou em "Histórico" para buscar datas anteriores.</p>
                            </div>
                        ) : (
                            <div className="divide-y divide-slate-100">
                                {visibleList.map((soc, idx) => {
                                    const isARepor = soc.statusRepor === 'A_REPOR' || (soc.reposto === false && soc.jaRetirouDeposito === false);
                                    const tipoNome = soc.tipo || soc.type || 'Uso';
                                    const isReporType = tipoNome === 'Reposição do depósito' || tipoNome === 'Reposição';
                                    const horaStr = soc.dataHora ? new Date(soc.dataHora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '--:--';
                                    const dataStr = soc.dataHora ? new Date(soc.dataHora).toLocaleDateString('pt-BR') : '';
                                    const isToday = dataStr === new Date().toLocaleDateString('pt-BR');

                                    return (
                                        <div 
                                            key={soc.id || idx} 
                                            className="py-3 px-1.5 sm:px-2.5 hover:bg-sand-50/70 rounded-xl transition-colors flex items-start justify-between gap-3 group"
                                        >
                                            <div className="flex items-start gap-2.5 sm:gap-3 flex-1 min-w-0">
                                                {/* Hora (e data se não for hoje) */}
                                                <div className="shrink-0 w-11 sm:w-14 text-left pt-0.5">
                                                    <span className="text-xs sm:text-sm font-black text-slate-900 block leading-tight">{horaStr}</span>
                                                    {!isToday && (
                                                        <span className="text-[10px] font-bold text-slate-500 block leading-none mt-0.5">{dataStr.slice(0, 5)}</span>
                                                    )}
                                                </div>

                                                {/* Badge de Tipo */}
                                                <span className={`shrink-0 text-[11px] font-black uppercase px-2.5 py-0.5 rounded-lg text-white ${
                                                    isReporType ? 'bg-[#2e7d32]' :
                                                    tipoNome === 'Falta detectada' ? 'bg-amber-600' :
                                                    tipoNome === 'Avaria detectada' ? 'bg-rose-700' :
                                                    'bg-[#1565c0]'
                                                }`}>
                                                    {isReporType ? 'Reposição' : tipoNome === 'Falta detectada' ? 'Falta' : tipoNome === 'Avaria detectada' ? 'Avaria' : 'Uso'}
                                                </span>

                                                {/* Conteúdo Principal */}
                                                <div className="flex-1 min-w-0">
                                                    {/* Linha 1: Item ×Qtd · Documento e Suffix */}
                                                    <div className="text-xs sm:text-sm leading-snug flex flex-wrap items-center gap-x-1.5 gap-y-0.5">
                                                        <strong className="text-slate-950 font-black">
                                                            {soc.item || soc.itemName || 'Insumo Operacional'} ×{soc.quantidade}
                                                        </strong>

                                                        {soc.raphTih && (
                                                            <span className="text-[#b48033] font-bold">
                                                                · {soc.raphTih}
                                                            </span>
                                                        )}

                                                        {/* Status de Reposição / Retirada */}
                                                        {isReporType ? (
                                                            <span className="text-slate-600 font-medium text-xs">
                                                                ↳ retirada do depósito
                                                            </span>
                                                        ) : (soc.reposto || soc.jaRetirouDeposito) ? (
                                                            <span className="text-emerald-700 font-extrabold text-xs">
                                                                ✓ reposto ×{soc.qtdRetirada || soc.quantidade}
                                                            </span>
                                                        ) : isARepor ? (
                                                            <span className="inline-flex items-center gap-1.5">
                                                                <span className="text-amber-700 font-extrabold text-xs">⏳ a repor</span>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => onReporLancamento(soc)}
                                                                    className="px-2 py-0.5 rounded-md bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-[10px] shadow-xs transition-all flex items-center gap-1"
                                                                    title="Confirmar retirada e dar baixa no depósito"
                                                                >
                                                                    <span>📦 Repor</span>
                                                                </button>
                                                            </span>
                                                        ) : null}
                                                    </div>

                                                    {/* Linha 2: Subtexto descritivo e Militar */}
                                                    <div className="text-[11px] text-slate-600 mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                                                        {(soc.observacao || soc.obs) ? (
                                                            <span className="text-slate-700 font-medium">{soc.observacao || soc.obs}</span>
                                                        ) : (soc.jaRetirouDeposito && !isReporType) ? (
                                                            <span className="text-slate-500 font-medium">Retirado do depósito no mesmo lançamento</span>
                                                        ) : null}

                                                        <span className="uppercase font-bold text-slate-700">
                                                            {soc.militar ? soc.militar.toUpperCase() : 'OFICIAL AEROMÉDICO'}
                                                        </span>

                                                        {soc.foto && (
                                                            <button
                                                                type="button"
                                                                onClick={() => setSelectedPhoto(soc.foto)}
                                                                className="text-rose-700 hover:text-rose-900 font-bold inline-flex items-center gap-1 text-[11px] ml-1"
                                                                title="Visualizar foto anexada"
                                                            >
                                                                <span>📷 Ver anexo</span>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Ações: Editar e Apagar */}
                                            <div className="flex items-center gap-1 shrink-0 pt-0.5">
                                                <button
                                                    type="button"
                                                    onClick={() => onEditLancamento(soc)}
                                                    className="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors"
                                                    title="Editar / Corrigir este lançamento"
                                                >
                                                    <span className="text-xs">✏️</span>
                                                </button>

                                                <button
                                                    type="button"
                                                    onClick={() => onRequestDelete(soc)}
                                                    className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors font-bold text-base leading-none"
                                                    title="Apagar este lançamento"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* Rodapé com aviso dos 4 dias e atalho do Histórico */}
                        <div className="pt-3 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs text-slate-600">
                            <div className="flex items-center gap-2">
                                <span className="text-slate-400">ℹ️</span>
                                <span>Exibindo lançamentos referentes aos últimos 4 dias. Para consultar datas anteriores, utilize o botão <strong>Histórico</strong>.</span>
                            </div>
                            <button
                                type="button"
                                onClick={onOpenHistorico}
                                className="px-3 py-1.5 rounded-xl bg-sand-100 hover:bg-sand-200 text-slate-800 font-bold text-xs border border-sand-300 transition-all flex items-center gap-1.5 shrink-0 self-start sm:self-auto"
                            >
                                <span>📜 Abrir Histórico Completo</span>
                            </button>
                        </div>
                    </div>

                    {/* Modal para Visualização da Foto Ampliada */}
                    {selectedPhoto && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedPhoto(null)}>
                            <div className="bg-white p-3 rounded-2xl max-w-lg w-full shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center pb-2 border-b">
                                    <span className="text-xs font-bold text-slate-800">📷 Imagem Anexada do Socorro</span>
                                    <button type="button" onClick={() => setSelectedPhoto(null)} className="text-slate-500 hover:text-slate-900 font-black text-lg">×</button>
                                </div>
                                <img src={selectedPhoto} alt="Registro Ampliado" className="w-full h-auto max-h-[70vh] object-contain rounded-xl mt-2" />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ====================================================================

                    localStorage.removeItem(`sigaero_draft_passagem_${selectedDate}`);

                            return voosAno.filter(v => {

                            }).length;
                        });
                        const rowTot = rowMeses.reduce((a, b) => a + b, 0);
                        lines.push(g.grupo + ';' + st + ';' + rowMeses.join(';') + ';' + rowTot);

        // 1. Modal de Configurações da Planilha Google (Opção A)

            const [testStatus, setTestStatus] = useState(null);
            const [testing, setTesting] = useState(false);

            if (!isOpen) return null;

            const handleTest = async () => {
                setTesting(true);
                setTestStatus(null);
                const res = await callGAS(url, 'getData');
                setTesting(false);
                if (res.success || res.status === 'success') {
                    setTestStatus({ ok: true, msg: 'Conexão estabelecida com sucesso com a Planilha Dedicada do SIG-AEROMÉDICO!' });
                } else if (res.status === 'local_demo') {
                    setTestStatus({ ok: false, msg: 'URL padrão/vazia: operando em cache local demonstrativo.' });
                } else {
                    setTestStatus({ ok: false, msg: res.message || 'Erro ao conectar à planilha.' });
                }
            };

            const handleSave = () => {
                onSaveScriptUrl(url.trim());
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-in fade-in duration-200">

                            </div>

                        <div className="space-y-4 my-5 text-xs text-slate-300">
                            <p>
                                O sistema está estruturado para a <strong>Opção A (Planilha Dedicada SIG-AEROMÉDICO)</strong>, garantindo velocidade, segurança e isolamento do SIG-MAT.
                            </p>

                            <div>

                                />
                                <p className="text-[10px] text-slate-500 mt-1">

                                </p>
                            </div>

                            {testStatus && (
                                <div className={`p-3 rounded-xl border text-xs flex items-center gap-2 ${testStatus.ok ? 'bg-emerald-950/60 border-emerald-800 text-emerald-200' : 'bg-amber-950/60 border-amber-800 text-amber-200'}`}>
                                    <Icon name={testStatus.ok ? "check" : "alert"} className="w-4 h-4 shrink-0" />
                                    <span>{testStatus.msg}</span>

                            <div className="flex items-center gap-2 pt-2">

                                >
                                    Salvar Configuração
                                </button>
                            </div>

                    </div>

        // 2. Modal de Apontamento de Não Conformidade (NC)
        const ModalNC = ({ isOpen, onClose, item, currentNC, onSave }) => {
            const [ncType, setNcType] = useState('FALTA');
            const [notes, setNotes] = useState('');
            const [photo, setPhoto] = useState(null);

            useEffect(() => {
                if (currentNC) {

                    setNotes('');

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPhoto(reader.result);

                    reader.readAsDataURL(file);

                    notes: notes.trim(),

        // 3. Modal de Movimentação do Almoxarifado
        const ModalMovimento = ({ isOpen, onClose, item, onConfirm, operator }) => {
            const [type, setType] = useState('SAIDA'); // 'ENTRADA', 'SAIDA', 'BAIXA_VENCIMENTO', 'AJUSTE'
            const [quantity, setQuantity] = useState(1);
            const [reason, setReason] = useState('');
            const [lot, setLot] = useState('');
            const [expiry, setExpiry] = useState('');

            useEffect(() => {
                if (item) {
                    setQuantity(1);
                    setReason('');
                    setLot(item.serialLot || '');
                    setExpiry(item.expirationDate || '');
                }
            }, [item, isOpen]);

            if (!isOpen || !item) return null;

            const curStock = Number(item.currentStock) || 0;
            const numQtd = Number(quantity) || 0;
            const newStock = type === 'ENTRADA' ? curStock + numQtd :
                             type === 'AJUSTE' ? numQtd :
                             Math.max(0, curStock - numQtd);

            const handleSave = () => {
                if (numQtd <= 0 && type !== 'AJUSTE') return;
                onConfirm({
                    itemId: item.id,
                    itemName: item.name,
                    type,
                    quantity: numQtd,
                    curStock,
                    newStock,
                    reason: reason.trim(),
                    lot,
                    expiry,
                    operator: `${operator.grad} ${operator.warName}`,
                    rg: operator.rg

                onClose();

                                />

                        s.onload = resolve;
                        s.onerror = () => reject(new Error('Falha ao carregar ' + src));
                        document.head.appendChild(s);
                    });
                    if (!window.html2canvas) {
                        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

                    const pdfFixStyle = document.createElement('style');
                    pdfFixStyle.setAttribute('data-pdf-fix', 'pedido-mensal');

                        #pdf-pedido-mensal-render, #pdf-pedido-mensal-render * { line-height: 1.25 !important; }
                        #pdf-pedido-mensal-render td, #pdf-pedido-mensal-render th { vertical-align: middle !important; }
                        #pdf-pedido-mensal-render img { display: block; }
                    `;
                    document.head.appendChild(pdfFixStyle);

                    const prevScrollY = window.scrollY;
                    window.scrollTo(0, 0);

                    const renderW = printContainer.offsetWidth;
                    const renderH = printContainer.offsetHeight;
                    let canvas;
                    try {
                        canvas = await window.html2canvas(printContainer, {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: '#ffffff',
                            logging: false,
                            x: 0,
                            y: 0,
                            scrollX: 0,
                            scrollY: 0,
                            width: renderW,
                            height: renderH,
                            windowWidth: Math.max(renderW, document.documentElement.clientWidth),
                            windowHeight: Math.max(renderH, document.documentElement.clientHeight),
                            onclone: (clonedDoc) => {
                                const st = clonedDoc.createElement('style');
                                st.innerHTML = pdfFixStyle.innerHTML;
                                clonedDoc.head.appendChild(st);
                            }
                        });
                    } finally {

                        if (printContainer.parentNode) document.body.removeChild(printContainer);
                        if (pdfFixStyle.parentNode) pdfFixStyle.parentNode.removeChild(pdfFixStyle);

                    const maxW = pageW - margem * 2;
                    const maxH = pageH - margem * 2;
                    const ratio = canvas.height / canvas.width;
                    let imgW = maxW;
                    let imgH = imgW * ratio;
                    if (imgH > maxH) {
                        imgH = maxH;
                        imgW = imgH / ratio;
                    }
                    const posX = (pageW - imgW) / 2;
                    const posY = margem;

                                                        {it.sugerido}

                                                            type="number"
                                                            min="0"
                                                            value={it.solicitado}

                                                                isReq ? 'border-rose-500 text-rose-900 bg-rose-50/30 font-black' : 'border-slate-300 text-slate-800'
                                                            }`}

                                                        <div className="absolute right-1 inset-y-1 flex flex-col justify-center">

                                                            >
                                                                ▲
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => handleItemChange(realIndex, Math.max(0, (Number(it.solicitado) || 0) - 1))}
                                                                className="px-1 text-slate-500 hover:text-slate-900 leading-none text-[8px] font-black"
                                                            >
                                                                ▼
                                                            </button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* Botões do Rodapé */}
                        <div className="pt-3 border-t-2 border-slate-200 shrink-0 flex items-center justify-between gap-3 flex-wrap">
                            <button
                                type="button"
                                onClick={handleUsarSugeridos}
                                className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-extrabold text-xs transition-all flex items-center gap-1.5 shadow-xs"
                                title="Preencher automaticamente todos os campos Solicitado com os valores sugeridos"
                            >
                                <span>↺</span>
                                <span>Usar os sugeridos</span>
                            </button>

                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold text-xs"
                                >
                                    Cancelar
                                </button>

                                <button
                                    type="button"
                                    onClick={handleGerarPDF}
                                    disabled={isExporting}
                                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xs shadow-md transition-all flex items-center gap-1.5 disabled:opacity-50"
                                >
                                    <span>📄</span>
                                    <span>{isExporting ? 'Gerando impresso DSE...' : 'Gerar PDF'}</span>

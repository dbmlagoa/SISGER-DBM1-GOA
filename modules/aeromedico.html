<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-Aeromédico v2 - Gestão de Insumos & APH • DBM1/GOA CBMERJ</title>
    
    <!-- 1. ESCUDO DE PROTEÇÃO PARA IFRAMES / GOOGLE SITES (Evita crash de LocalStorage) -->
    <script>
        (function() {
            var memoryStore = {};
            try { 
                window.localStorage.getItem(''); 
            } catch (e) {
                Object.defineProperty(window, 'localStorage', { 
                    value: { 
                        getItem: function(k) { return memoryStore[k] || null; }, 
                        setItem: function(k, v) { memoryStore[k] = String(v); }, 
                        removeItem: function(k) { delete memoryStore[k]; },
                        clear: function() { memoryStore = {}; }
                    } 
                });
            }
            try { 
                window.sessionStorage.getItem(''); 
            } catch (e) {
                Object.defineProperty(window, 'sessionStorage', { 
                    value: { 
                        getItem: function(k) { return memoryStore[k] || null; }, 
                        setItem: function(k, v) { memoryStore[k] = String(v); }, 
                        removeItem: function(k) { delete memoryStore[k]; },
                        clear: function() { memoryStore = {}; }
                    } 
                });
            }
        })();
    </script>

    <!-- 2. CDNs DE ALTA PERFORMANCE (Tailwind, React 18, Babel, html2pdf) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #0b1120; color: #1e293b; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 768px) {

        input, select, textarea { font-size: 15px !important; }

</head>
<body class="bg-slate-950 text-slate-100 selection:bg-blue-600 selection:text-white">
    <div id="root">
        <div class="flex h-screen items-center justify-center bg-slate-950">
            <div class="text-center">
                <div class="w-14 h-14 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-blue-400 font-black tracking-widest text-xs uppercase animate-pulse">Carregando SIG-Aeromédico DBM1/GOA...</p>
            </div>
        </div>
    </div>

    <!-- Adicionado data-presets="react,env" para garantir suporte a código em todos os browsers -->
    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef } = React;

        // URL DO ENDPOINT GOOGLE APPS SCRIPT OFICIAL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsRBEHsZ6ngBlmLpB6_52Ho1iJwvcM1tL14O0RHuFfs2PEk4mr-mkZGSJqB57QEMp7/exec";

        // Ícones SVG padronizados
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const paths = {
                dashboard: "M4 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zm10 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5zM4 15a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4zm10 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4z",
                kits: "M19 7h-3V6a4 4 0 0 0-8 0v1H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zm-9-1a2 2 0 0 1 4 0v1h-4V6zm2 6v6m-3-3h6",
                inventory: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4",
                mission: "M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6M2 12h20",
                shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
                alert: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z",
                clock: "M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                lock: "M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z",
                oxygen: "M19.428 15.428a2 2 0 0 0-1.022-.547l-2.387-.477a6 6 0 0 0-3.86.517l-.318.158a6 6 0 0 1-3.86.517L6.05 15.21a2 2 0 0 0-1.806.547M8 4h8l-1 1v5.172a2 2 0 0 0 .586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 0 0 9 10.172V5L8 4z",
                download: "M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4",
                sync: "M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15",
                check: "M5 13l4 4L19 7",
                plus: "M12 5v14M5 12h14",
                history: "M12 8v4l3 3 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                plane: "M12 19l9 2-9-18-9 18 9-2zm0 0v-8",
                pill: "M10.5 6a4.5 4.5 0 1 1 6.364 6.364l-6.364 6.364a4.5 4.5 0 1 1-6.364-6.364L10.5 6z M7.5 13.5l6-6",
                x: "M6 18L18 6M6 6l12 12",
                wrench: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
                user: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            };
            return (
                <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                    <path d={paths[name] || ""}></path>
                </svg>
            );
        };

        // KITS PADRÃO INICIAIS DA UASA / GOA
        const DEFAULT_KITS = [
            { id: "KIT-01", name: "Mochila Vias Aéreas & Intubação", aircraft: "Esquilo (Bombeiro 01)", seal: "LAC-2026-0841", checkedAt: "Hoje, 06:40", responsible: "Cap BM Méd Petrus (RG 49917)", status: "LACRADO", color: "blue" },
            { id: "KIT-02", name: "Mochila Acesso Venoso & Fármacos", aircraft: "Esquilo (Bombeiro 01)", seal: "LAC-2026-0842", checkedAt: "Hoje, 06:40", responsible: "Cap BM Méd Petrus (RG 49917)", status: "LACRADO", color: "emerald" },
            { id: "KIT-03", name: "Mochila Trauma & Curativos Táticos", aircraft: "Esquilo (Bombeiro 01)", seal: "LAC-2026-0843", checkedAt: "Hoje, 06:40", responsible: "1º Ten BM Liborio (RG 45317)", status: "LACRADO", color: "red" },
            { id: "KIT-04", name: "Kit Parto & Pediátrico Avançado", aircraft: "Esquilo (Bombeiro 01)", seal: "LAC-2026-0844", checkedAt: "Hoje, 06:40", responsible: "1º Ten BM Liborio (RG 45317)", status: "LACRADO", color: "amber" },
            { id: "KIT-05", name: "Mochila Completa UASA (UTI Aérea)", aircraft: "AW169 (Sobreaviso)", seal: "LAC-2026-0910", checkedAt: "Hoje, 06:40", responsible: "Cap BM Méd Petrus (RG 49917)", status: "LACRADO", color: "purple" }
        ];

        // CILINDROS DE O2 PADRÃO
        const DEFAULT_O2 = [
            { id: "O2-01", name: "Cilindro Fibra Carbono Luxfer 4.7L", aircraft: "Esquilo (Bombeiro 01)", capacityL: 1000, pressurePSI: 2000, hydroTest: "2029-01-15", status: "OPERACIONAL (100%)" },
            { id: "O2-02", name: "Cilindro Alumínio Portátil ME 2.9L", aircraft: "Mochila Vias Aéreas", capacityL: 680, pressurePSI: 1950, hydroTest: "2028-06-10", status: "OPERACIONAL (98%)" },
            { id: "O2-03", name: "Cilindro Reserva Hangar UASA 10L", aircraft: "Reserva Hangar DBM1", capacityL: 2000, pressurePSI: 2200, hydroTest: "2030-02-20", status: "OPERACIONAL (100%)" }
        ];

        const App = () => {
            // Autenticação pré-carregada para uso imediato pela tripulação
            const [currentUser, setCurrentUser] = useState({
                graduation: "Cap BM Méd",
                warName: "Petrus",
                rg: "49917",
                role: "Médico de Voo"
            });
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Dados de Estado
            const [items, setItems] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [kits, setKits] = useState(DEFAULT_KITS);
            const [cilindrosO2, setCilindrosO2] = useState(DEFAULT_O2);
            const [controlledLedger, setControlledLedger] = useState([]);
            
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('TODOS');
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

            // Modais
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState('item'); // 'item', 'movement', 'seal', 'mission', 'damage'
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedKit, setSelectedKit] = useState(null);

            // Calculadora de O2
            const [calcTankType, setCalcTankType] = useState('1000'); // Fator aproximado
            const [calcPressure, setCalcPressure] = useState(2000);
            const [calcFlowRate, setCalcFlowRate] = useState(10); // L/min

            // Formatação de data BR
            const formatBRDate = (dateString) => {
                if (!dateString) return '---';
                try {
                    const clean = String(dateString).split('T')[0];
                    const [y, m, d] = clean.split('-');
                    if (!y || !m || !d) return dateString;
                    return `${d}/${m}/${y}`;
                } catch(e) { return dateString; }
            };

            // Cálculo dos dias restantes para vencimento (FEFO)
            const getDaysUntilExpiry = (dateString) => {
                if (!dateString) return null;
                try {
                    const clean = String(dateString).split('T')[0];
                    const [y, m, d] = clean.split('-');
                    if (!y || !m || !d) return null;
                    const exp = new Date(y, m - 1, d);
                    const now = new Date();
                    now.setHours(0, 0, 0, 0);
                    const diffTime = exp - now;
                    return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                } catch (e) { return null; }
            };

            // Estatísticas e Alertas Operacionais
            const stats = useMemo(() => {
                const critical = items.filter(i => Number(i.currentStock) < Number(i.minStock));
                const expired = items.filter(i => {
                    const days = getDaysUntilExpiry(i.expirationDate);
                    return days !== null && days < 0;
                });
                const expiringSoon = items.filter(i => {
                    const days = getDaysUntilExpiry(i.expirationDate);
                    return days !== null && days >= 0 && days <= 60;
                });
                const damages = transactions.filter(t => t.type && (t.type.includes('AVARIA') || t.type.includes('ALTERAÇÃO') || t.type.includes('MANUTENÇÃO')));
                const controlledCount = items.filter(i => i.category && i.category.includes('Controlado')).length;
                
                return {
                    totalItems: items.length,
                    critical,
                    expired,
                    expiringSoon,
                    damages,
                    controlledCount,
                    totalMovements: transactions.length
                };
            }, [items, transactions]);

            // Carga e Sincronização de Dados
            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
                    const data = await res.json();
                    
                    if (data.items && Array.isArray(data.items)) {
                        setItems(data.items.map(row => ({
                            id: row[0],
                            name: String(row[1] || ''),
                            manufacturer: String(row[2] || ''),
                            expirationDate: row[3] ? String(row[3]).split('T')[0] : '',
                            lifespan: row[4] || 0,
                            serialLot: String(row[5] || ''),
                            currentStock: Number(row[6]) || 0,
                            minStock: Number(row[7]) || 0,
                            category: String(row[8] || (String(row[1] || '').toLowerCase().includes('desfibrilador') || String(row[1] || '').toLowerCase().includes('bomba') ? 'Equipamento Biomédico' : 'Fármaco Comum')),
                            location: String(row[9] || 'Farmácia UASA')
                        })));
                    }

                    if (data.transactions && Array.isArray(data.transactions)) {
                        setTransactions(data.transactions.map(row => ({
                            movementDate: row[0],
                            itemName: row[1],
                            type: row[2],
                            quantity: Number(row[3]) || 1,
                            bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                            recorder: { warName: row[7], rg: row[9] || "---" },
                            reason: row[8],
                            missionNum: row[10] || "",
                            lot: row[11] || ""
                        })).reverse());
                    }

                    if (data.kits && Array.isArray(data.kits) && data.kits.length > 0) {
                        setKits(data.kits.map(r => ({
                            id: r[0], name: r[1], aircraft: r[2], seal: r[3],
                            checkedAt: r[4], responsible: `${r[5]} ${r[6]} (RG: ${r[7]})`,
                            status: r[8] || "LACRADO", obs: r[9] || ""
                        })));
                    }

                    if (data.cilindrosO2 && Array.isArray(data.cilindrosO2) && data.cilindrosO2.length > 0) {
                        setCilindrosO2(data.cilindrosO2.map(c => ({
                            id: c[0], name: c[1], aircraft: c[2],
                            capacityL: Number(c[3]) || 1000, pressurePSI: Number(c[4]) || 2000,
                            hydroTest: c[6] || "", status: c[7] || "OPERACIONAL"
                        })));
                    }

                } catch (err) {
                    console.warn("Conexão direta ao banco offline, mantendo dados operacionais em memória.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            // Salvar Insumo
            const handleSaveItem = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const f = e.target;
                const newItem = {
                    id: selectedItem?.id || ("ID-" + Date.now()),
                    name: f.name.value,
                    manufacturer: f.manufacturer.value,
                    serialLot: f.serialLot.value,
                    expirationDate: f.expirationDate.value,
                    currentStock: Number(f.currentStock.value),
                    minStock: Number(f.minStock.value),
                    category: f.category.value,
                    location: f.location.value
                };

                // Atualização Otimista
                setItems(prev => {
                    const exists = prev.find(i => i.id === newItem.id);
                    if (exists) return prev.map(i => i.id === newItem.id ? newItem : i);
                    return [...prev, newItem];
                });

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'saveItem', item: newItem })
                    });
                } catch(e) {}
                
                setIsSubmitting(false);
                setIsModalOpen(false);
                fetchData();
            };

            // Registro de Movimentação Individual (Cautela/Entrada/Avaria)
            const handleRegisterMovement = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const f = e.target;
                const item = items.find(i => i.id === f.itemId.value);
                const qty = Number(f.quantity.value);
                const type = f.movementType.value;

                let newStock = item.currentStock;
                if (type === 'entrada') newStock += qty;
                else if (type === 'saída') newStock = Math.max(0, newStock - qty);

                const trans = {
                    itemId: item.id,
                    itemName: item.name,
                    type: type,
                    quantity: qty,
                    reason: f.reason.value,
                    movementDate: new Date().toISOString(),
                    bearer: {
                        graduation: f.b_grad?.value || currentUser.graduation,
                        warName: f.b_name?.value || currentUser.warName,
                        rg: f.b_rg?.value || currentUser.rg
                    },
                    recorder: { warName: currentUser.warName, rg: currentUser.rg },
                    lot: item.serialLot
                };

                setItems(prev => prev.map(i => i.id === item.id ? { ...i, currentStock: newStock } : i));
                setTransactions(prev => [trans, ...prev]);

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'registerMovement', trans, newStock })
                    });
                } catch(e) {}

                setIsSubmitting(false);
                setIsModalOpen(false);
                fetchData();
            };

            // Homologação Rápida dos Lacres das Mochilas (Matinal pós-briefing 06:40)
            const handleQuickSealsVerifyAll = async () => {
                if (!confirm("Confirmar que todas as 5 mochilas/kits de bordo foram visualmente inspecionadas e os LACRES de segurança estão intactos?")) return;
                
                const nowStr = `Hoje, ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
                const respStr = `${currentUser.graduation} ${currentUser.warName} (RG: ${currentUser.rg})`;

                setKits(prev => prev.map(k => ({
                    ...k,
                    checkedAt: nowStr,
                    responsible: respStr,
                    status: "LACRADO"
                })));

                alert("✅ Todos os kits homologados e prontos para acionamento aeromédico!");
            };

            // Atualização individual de lacre
            const handleUpdateSingleSeal = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const f = e.target;
                const newSeal = f.sealNumber.value;
                const status = f.status.value;
                const obs = f.obs.value;

                const nowStr = `Hoje, ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
                const respStr = `${currentUser.graduation} ${currentUser.warName} (RG: ${currentUser.rg})`;

                setKits(prev => prev.map(k => k.id === selectedKit.id ? {
                    ...k,
                    seal: newSeal,
                    checkedAt: nowStr,
                    responsible: respStr,
                    status: status,
                    obs: obs
                } : k));

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'updateKitLacre',
                            kitId: selectedKit.id,
                            lacre: newSeal,
                            status: status,
                            obs: obs,
                            responsavel: { graduation: currentUser.graduation, warName: currentUser.warName, rg: currentUser.rg }
                        })
                    });
                } catch(e) {}

                setIsSubmitting(false);
                setIsModalOpen(false);
            };

            // Registro de Consumo Pós-Missão (com baixa em ampolas e Portaria 344)
            const handleRegisterMissionConsumption = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const f = e.target;
                
                const missionCode = f.missionCode.value;
                const aircraft = f.aircraft.value;
                const patientName = f.patientName.value;
                const doctorName = f.doctorName.value;
                const doctorCRM = f.doctorCRM.value;
                const nurseName = f.nurseName.value;
                const nurseCOREN = f.nurseCOREN.value;

                const itemId = f.consumedItem.value;
                const qty = Number(f.consumedQty.value);
                const discardQty = Number(f.discardQty?.value || 0);
                const selectedObj = items.find(i => i.id === itemId);

                if (selectedObj) {
                    const newStock = Math.max(0, selectedObj.currentStock - qty);
                    setItems(prev => prev.map(i => i.id === itemId ? { ...i, currentStock: newStock } : i));

                    const trans = {
                        itemName: selectedObj.name,
                        type: "saída (Missão APH)",
                        quantity: qty,
                        movementDate: new Date().toISOString(),
                        bearer: { graduation: "Enfermeiro", warName: nurseName, rg: "COREN: " + nurseCOREN },
                        recorder: { warName: doctorName, rg: "CRM: " + doctorCRM },
                        reason: `Missão ${missionCode} (${aircraft}) - Paciente: ${patientName}`,
                        missionNum: missionCode,
                        lot: selectedObj.serialLot
                    };
                    setTransactions(prev => [trans, ...prev]);

                    if (selectedObj.category.includes('Controlado') || discardQty > 0) {
                        setControlledLedger(prev => [{
                            date: new Date().toLocaleString('pt-BR'),
                            drug: selectedObj.name,
                            lot: selectedObj.serialLot,
                            used: qty,
                            discarded: discardQty,
                            mission: missionCode,
                            doctor: `${doctorName} (CRM: ${doctorCRM})`,
                            nurse: `${nurseName} (COREN: ${nurseCOREN})`
                        }, ...prev]);
                    }

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'registerMissaoConsumo',
                                missao: {
                                    codigo: missionCode,
                                    aeronave: aircraft,
                                    paciente: patientName,
                                    medico: { warName: doctorName, crm: doctorCRM },
                                    enfermeiro: { warName: nurseName, coren: nurseCOREN }
                                },
                                itens: [{
                                    itemId: selectedObj.id,
                                    itemName: selectedObj.name,
                                    qty: qty,
                                    sobraDescartada: discardQty,
                                    lot: selectedObj.serialLot,
                                    isControlled: selectedObj.category.includes('Controlado')
                                }]
                            })
                        });
                    } catch(e) {}
                }

                setIsSubmitting(false);
                setIsModalOpen(false);
                alert("✅ Relatório de consumo da missão homologado e estoque atualizado!");
            };

                let factor = 0.50;

                if (calcTankType === '425') factor = 0.16; // Cilindro D
                if (calcTankType === '2000') factor = 0.90; // Cilindro Grande

                const totalLitersAvailable = safePressure * factor;
                const minutes = Math.floor(totalLitersAvailable / flow);
                const hours = Math.floor(minutes / 60);
                const remMinutes = minutes % 60;

                return {
                    minutes,
                    formatted: hours > 0 ? `${hours}h ${remMinutes}min` : `${minutes} min`,
                    totalLiters: Math.round(totalLitersAvailable),

                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left min-w-[800px]">
                                                <thead className="bg-slate-950/80 border-b border-slate-800 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                                                    <tr>
                                                        <th className="px-6 py-4">Data/Hora</th>
                                                        <th className="px-6 py-4">Insumo</th>
                                                        <th className="px-6 py-4">Portador (Retirada)</th>
                                                        <th className="px-6 py-4">Fiel (Registrador)</th>
                                                        <th className="px-6 py-4 text-center">Tipo & Quantidade</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 text-xs">
                                                    {transactions.map((t, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-850/60">
                                                            <td className="px-6 py-4 font-bold text-slate-400">{new Date(t.movementDate).toLocaleDateString('pt-BR')}</td>
                                                            <td className="px-6 py-4">
                                                                <p className="font-black text-white uppercase">{t.itemName}</p>
                                                                <p className="text-[9px] text-slate-500 italic mt-0.5">{t.reason}</p>
                                                            </td>
                                                            <td className="px-6 py-4 uppercase">
                                                                <p className="font-black text-slate-200">{t.bearer.graduation} {t.bearer.warName}</p>
                                                                <p className="text-[9px] text-slate-500">RG: {t.bearer.rg}</p>
                                                            </td>
                                                            <td className="px-6 py-4 uppercase">
                                                                <p className="font-bold text-blue-400">{t.recorder.warName}</p>
                                                                <p className="text-[9px] text-slate-500">RG: {t.recorder.rg}</p>
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <span className={`px-2.5 py-1 rounded-lg font-black uppercase text-[9px] border ${
                                                                    t.type.includes('entrada')
                                                                        ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
                                                                        : 'bg-red-500/20 text-red-400 border-red-500/30'
                                                                }`}>
                                                                    {t.type} ({t.quantity} un)
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODAIS (Novo Insumo, Movimentação, Lacre) */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-t-3xl md:rounded-3xl w-full max-w-xl p-6 md:p-8 shadow-2xl overflow-y-auto max-h-[92vh] custom-scrollbar">
                                
                                <div className="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">
                                    <h3 className="text-base font-black uppercase text-white">
                                        {modalType === 'item' ? (selectedItem ? 'Editar Insumo' : 'Cadastrar Novo Insumo') :
                                         modalType === 'seal' ? `Conferir Lacre: ${selectedKit?.name}` :
                                         'Registrar Cautela / Movimentação'}
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white p-2">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* Form: Novo Insumo */}
                                {modalType === 'item' && (
                                    <form onSubmit={handleSaveItem} className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nome do Insumo / Medicamento</label>
                                            <input name="name" required defaultValue={selectedItem?.name} placeholder="Ex: Midazolam 15mg/3ml ou Tubo Orotraqueal 7.5" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none focus:border-blue-500" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Categoria</label>
                                                <select name="category" defaultValue={selectedItem?.category || "Fármaco Comum"} className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none">
                                                    <option value="Fármaco Comum">Fármaco Comum</option>
                                                    <option value="Controlado (Port. 344)">Controlado (Port. 344)</option>
                                                    <option value="Material/Descartável APH">Material/Descartável APH</option>
                                                    <option value="Equipamento Biomédico">Equipamento Biomédico</option>
                                                    <option value="Gás Medicinal">Gás Medicinal</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Marca / Fabricante</label>
                                                <input name="manufacturer" defaultValue={selectedItem?.manufacturer} placeholder="Ex: Cristália / Zoll" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nº Lote / Série</label>
                                                <input name="serialLot" defaultValue={selectedItem?.serialLot} placeholder="Ex: L24059A" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-amber-400 uppercase outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Data de Validade</label>
                                                <input name="expirationDate" type="date" defaultValue={selectedItem?.expirationDate} className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white outline-none" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Carga Atual (Saldo)</label>
                                                <input name="currentStock" type="number" defaultValue={selectedItem?.currentStock || 10} required className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-black text-white text-center outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Carga Mínima (Alerta)</label>
                                                <input name="minStock" type="number" defaultValue={selectedItem?.minStock || 5} required className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-black text-red-400 text-center outline-none" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Localização Operacional</label>
                                            <input name="location" defaultValue={selectedItem?.location || "Farmácia UASA"} placeholder="Ex: Farmácia UASA / Mochila Vias Aéreas" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none" />
                                        </div>

                                        <button type="submit" disabled={isSubmitting} className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-xl transition-all disabled:opacity-50 mt-4">
                                            {isSubmitting ? 'Salvando...' : 'Gravar Alterações'}
                                        </button>
                                    </form>
                                )}

                                {/* Form: Atualizar Lacre */}
                                {modalType === 'seal' && (
                                    <form onSubmit={handleUpdateSingleSeal} className="space-y-4">
                                        <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase">Kit Selecionado:</p>
                                            <p className="font-black text-sm text-white uppercase">{selectedKit?.name}</p>
                                            <p className="text-[10px] text-blue-400 font-bold uppercase">{selectedKit?.aircraft}</p>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Novo Número do Lacre de Segurança</label>
                                            <input name="sealNumber" required defaultValue={selectedKit?.seal} placeholder="Ex: LAC-2026-0955" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-sm font-black text-amber-400 font-mono uppercase outline-none focus:border-amber-500" />
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Situação da Mochila</label>
                                            <select name="status" defaultValue={selectedKit?.status} className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none">
                                                <option value="LACRADO">LACRADO (Pronto Emprego)</option>
                                                <option value="ROMPIDO EM VOO">ROMPIDO EM VOO (Atendimento)</option>
                                                <option value="REPOSIÇÃO PENDENTE">REPOSIÇÃO PENDENTE (Em Armário)</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Observações da Conferência</label>
                                            <textarea name="obs" defaultValue={selectedKit?.obs} rows="2" placeholder="Ex: Itens repostos e conferidos conforme padrão UASA." className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white outline-none"></textarea>
                                        </div>

                                        <button type="submit" disabled={isSubmitting} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-xl transition-all disabled:opacity-50 mt-4">
                                            {isSubmitting ? 'Atualizando...' : 'Confirmar Lacre & Homologar'}
                                        </button>
                                    </form>
                                )}

                                {/* Form: Cautela / Movimentação Individual */}
                                {modalType === 'movement' && (
                                    <form onSubmit={handleRegisterMovement} className="space-y-4">
                                        <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase">Insumo:</p>
                                            <p className="font-black text-sm text-white uppercase">{selectedItem?.name}</p>
                                            <p className="text-[10px] text-amber-400 font-bold">Lote: {selectedItem?.serialLot} | Saldo Atual: {selectedItem?.currentStock} un</p>
                                        </div>

                                        <input type="hidden" name="itemId" value={selectedItem?.id} />

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tipo de Movimentação</label>
                                                <select name="movementType" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none">
                                                    <option value="saída">Saída / Cautela</option>
                                                    <option value="entrada">Entrada / Reposição</option>
                                                    <option value="AVARIA">Avaria / Manutenção</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Quantidade</label>
                                                <input name="quantity" type="number" min="1" defaultValue="1" required className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-black text-white text-center outline-none" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Militar Portador (Quem Retira)</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <input name="b_grad" defaultValue={currentUser.graduation} placeholder="Graduação" required className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none" />
                                                <input name="b_name" defaultValue={currentUser.warName} placeholder="Nome Guerra" required className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none" />
                                                <input name="b_rg" defaultValue={currentUser.rg} placeholder="RG" required className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white outline-none" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Motivo / Finalidade</label>
                                            <input name="reason" required placeholder="Ex: Equipagem da aeronave ou reposição pós-missão" className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white uppercase outline-none" />
                                        </div>

                                        <button type="submit" disabled={isSubmitting} className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-xl transition-all disabled:opacity-50 mt-4">
                                            {isSubmitting ? 'Registrando...' : 'Confirmar Lançamento'}
                                        </button>
                                    </form>
                                )}

                            </div>
                        </div>
                    )}

                    {/* TEMPLATE OCULTO PARA GERAÇÃO DO RELATÓRIO PDF FORMAL A4 */}
                    <div className="fixed -left-[9999px] top-0">
                        <div id="pdf-report-container" className="bg-white text-black p-8 w-[195mm] min-h-[285mm] font-sans">
                            {/* Cabeçalho Oficial Militar */}
                            <div className="border-b-2 border-slate-900 pb-4 mb-6 text-center">
                                <h1 className="text-base font-black uppercase tracking-tight text-slate-900">Corpo de Bombeiros Militar do Estado do Rio de Janeiro</h1>
                                <h2 className="text-xs font-bold uppercase tracking-widest text-slate-700">Grupamento de Operações Aéreas • 1º DBM / GOA</h2>
                                <h3 className="text-xs font-black uppercase text-blue-900 mt-2">SIG-Aeromédico • Relatório de Prontidão Operacional & Suporte APH</h3>
                                <div className="mt-3 flex justify-between text-[9px] text-slate-600 font-bold border-t border-slate-200 pt-2">
                                    <span>Emissão: {new Date().toLocaleDateString('pt-BR')} às {new Date().toLocaleTimeString('pt-BR')}</span>
                                    <span>Oficial Responsável: {currentUser.graduation} {currentUser.warName} (RG: {currentUser.rg})</span>
                                </div>
                            </div>

                            {/* Seção 1: Status das Mochilas e Lacres */}
                            <div className="mb-6">
                                <h4 className="text-[11px] font-black uppercase bg-slate-100 p-1.5 border-l-4 border-emerald-600 text-slate-900 mb-2">1. Prontidão das Mochilas de Bordo & Lacres Ativos</h4>
                                <table className="w-full text-left text-[9px] border-collapse border border-slate-300">
                                    <thead>
                                        <tr className="bg-slate-200 text-slate-800">
                                            <th className="border border-slate-300 p-1.5">Mochila / Kit de Bordo</th>
                                            <th className="border border-slate-300 p-1.5">Aeronave</th>
                                            <th className="border border-slate-300 p-1.5 text-center">Nº Lacre</th>
                                            <th className="border border-slate-300 p-1.5 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {kits.map(k => (
                                            <tr key={k.id}>
                                                <td className="border border-slate-300 p-1.5 font-bold">{k.name}</td>
                                                <td className="border border-slate-300 p-1.5">{k.aircraft}</td>
                                                <td className="border border-slate-300 p-1.5 text-center font-mono font-bold text-amber-800">{k.seal}</td>
                                                <td className="border border-slate-300 p-1.5 text-center font-bold text-emerald-800">{k.status}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Seção 2: Itens Abaixo do Mínimo */}
                            <div className="mb-6">
                                <h4 className="text-[11px] font-black uppercase bg-slate-100 p-1.5 border-l-4 border-red-600 text-slate-900 mb-2">2. Solicitação de Reposição Urgente (Saldo Crítico)</h4>
                                {stats.critical.length > 0 ? (
                                    <table className="w-full text-left text-[9px] border-collapse border border-slate-300">
                                        <thead>
                                            <tr className="bg-red-50 text-red-900">
                                                <th className="border border-slate-300 p-1.5">Insumo</th>
                                                <th className="border border-slate-300 p-1.5">Lote / Marca</th>
                                                <th className="border border-slate-300 p-1.5 text-center">Saldo Atual</th>
                                                <th className="border border-slate-300 p-1.5 text-center">Cota Mínima</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {stats.critical.map(i => (
                                                <tr key={i.id}>
                                                    <td className="border border-slate-300 p-1.5 font-bold">{i.name}</td>
                                                    <td className="border border-slate-300 p-1.5">{i.serialLot} ({i.manufacturer})</td>
                                                    <td className="border border-slate-300 p-1.5 text-center font-bold text-red-700">{i.currentStock} un</td>
                                                    <td className="border border-slate-300 p-1.5 text-center">{i.minStock} un</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                ) : (
                                    <p className="text-[9px] text-slate-500 italic">Todos os insumos operacionais em níveis de segurança regulares.</p>
                                )}
                            </div>

                            {/* Assinaturas Oficiais */}
                            <div className="mt-16 grid grid-cols-2 gap-8 text-center text-[10px]">
                                <div>
                                    <div className="border-b border-slate-900 pb-1 mb-1 font-bold">{currentUser.graduation} {currentUser.warName}</div>
                                    <p className="text-slate-600">Oficial Médico de Voo / Fiel de Carga</p>
                                </div>
                                <div>
                                    <div className="border-b border-slate-900 pb-1 mb-1 font-bold">Comandante da Aeronave / Chefe de Socorro</div>
                                    <p className="text-slate-600">1º Destacamento de Bombeiro Militar / GOA</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                    </div>
                </div>
            );
        };

        // ====================================================================
        // COMPONENTE: MODAL CONFERÊNCIA DO ALMOXARIFADO
        // ====================================================================
        const ModalConferenciaAlmox = ({ 
            isOpen, 
            onClose, 
            almoxItems, 
            almoxMovements, 
            socorrosList, 
            operator 
        }) => {
            if (!isOpen) return null;

            // Período padrão: 30 dias atrás até hoje
            const todayStr = new Date().toISOString().split('T')[0];
            const thirtyAgo = new Date();
            thirtyAgo.setDate(thirtyAgo.getDate() - 30);
            const thirtyAgoStr = thirtyAgo.toISOString().split('T')[0];

            const [startDate, setStartDate] = useState(thirtyAgoStr);
            const [endDate, setEndDate] = useState(todayStr);
            const [soOQueSeMoveu, setSoOQueSeMoveu] = useState(false);
            const [refreshTick, setRefreshTick] = useState(0);

            // Consolidação das movimentações (manuais do almoxarifado + reposições/baixas de socorros)
            const allMovements = useMemo(() => {
                const list = [];
                // 1. Movimentos manuais registrados
                (almoxMovements || []).forEach(m => {
                    list.push({
                        id: m.id || `MOV-${Math.random()}`,
                        dataHora: m.dataHora || new Date().toISOString(),
                        item: m.itemName || m.item || 'Insumo',
                        tipo: m.tipo || m.type || 'SAIDA',
                        quantidade: Number(m.quantidade || m.quantity) || 1,
                        saldoAnterior: m.curStock || m.saldoAnterior || '---',
                        saldoNovo: m.newStock || m.saldoNovo || '---',
                        motivo: m.reason || m.motivo || 'Movimentação Almoxarifado',
                        responsavel: m.responsavel || (operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico')
                    });
                });

                // 2. Movimentos gerados por reposição e socorros
                (socorrosList || []).forEach(s => {
                    const isReposto = s.reposto || s.jaRetirouDeposito || s.tipo === 'Reposição do depósito';
                    if (isReposto && s.dataHora) {
                        list.push({
                            id: `SOC-${s.id}`,
                            dataHora: s.dataHora,
                            item: s.item || s.itemName || 'Insumo',
                            tipo: 'SAIDA',
                            quantidade: Number(s.qtdRetirada || s.quantidade) || 1,
                            saldoAnterior: '---',
                            saldoNovo: '---',
                            motivo: `${s.tipo || 'Uso'} (${s.raphTih || 'Socorro'})`,
                            responsavel: s.militar || 'UASA'
                        });
                    }
                });

                // Ordenar decrescente por data/hora
                return list.sort((a, b) => new Date(b.dataHora) - new Date(a.dataHora));
            }, [almoxMovements, socorrosList, refreshTick, operator]);

            // Filtragem por período
            const filteredMovements = useMemo(() => {
                return allMovements.filter(m => {
                    if (m.dataHora) {
                        const dateOnly = String(m.dataHora).split('T')[0];
                        if (startDate && dateOnly < startDate) return false;
                        if (endDate && dateOnly > endDate) return false;
                    }
                    return true;
                });
            }, [allMovements, startDate, endDate]);

            // Estatísticas do período
            const stats = useMemo(() => {
                let entradas = 0;
                let saidas = 0;
                const distinctItems = new Set();

                filteredMovements.forEach(m => {
                    distinctItems.add((m.item || '').toLowerCase());
                    const t = (m.tipo || '').toUpperCase();
                    const q = Number(m.quantidade) || 1;
                    if (t.includes('ENTRADA')) {
                        entradas += q;
                    } else if (t.includes('SAIDA') || t.includes('SAÍDA')) {
                        saidas += q;
                    }
                });

                return {
                    entradas,
                    saidas,
                    totalItens: distinctItems.size
                };
            }, [filteredMovements]);

            // Exportação CSV
            const handleExportCSV = () => {
                if (filteredMovements.length === 0) {
                    alert('Nenhuma movimentação para exportar no período.');
                    return;
                }
                const headers = ['DataHora', 'Item', 'Tipo', 'Quantidade', 'SaldoAnterior', 'SaldoNovo', 'Motivo', 'Responsavel'];
                const rows = filteredMovements.map(m => [
                    m.dataHora,
                    `"${(m.item || '').replace(/"/g, '""')}"`,
                    m.tipo,
                    m.quantidade,
                    m.saldoAnterior,
                    m.saldoNovo,
                    `"${(m.motivo || '').replace(/"/g, '""')}"`,
                    `"${(m.responsavel || '').replace(/"/g, '""')}"`
                ]);
                const csvContent = 'data:text/csv;charset=utf-8,﻿' + [headers.join(';'), ...rows.map(e => e.join(';'))].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', `conferencia_almoxarifado_${startDate}_${endDate}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Impressão / PDF Oficial da Conferência
            const handlePrintPDF = async () => {
                const printContainer = document.createElement('div');
                printContainer.style.padding = '14px 18px';
                printContainer.style.background = '#ffffff';
                printContainer.style.fontFamily = 'Arial, sans-serif';
                printContainer.style.color = '#000000';

                const rowsHtml = filteredMovements.map((m, idx) => `
                    <tr style="background:${idx % 2 === 0 ? '#ffffff' : '#f8fafc'}; font-size: 9px;">
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left;">
                            ${m.dataHora ? `${new Date(m.dataHora).toLocaleDateString('pt-BR')} ${new Date(m.dataHora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : '---'}
                        </td>
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; font-weight: bold; text-align: left;">${m.item}</td>
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold; color: ${m.tipo === 'ENTRADA' ? '#15803d' : '#b91c1c'};">${m.tipo}</td>
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${m.quantidade}</td>
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left;">${m.motivo}</td>
                        <td style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left;">${m.responsavel}</td>
                    </tr>
                `).join('');

                const horaGeracao = new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR');

                printContainer.innerHTML = `
                    <div style="border-bottom: 2px solid #b91c1c; padding-bottom: 8px; margin-bottom: 12px; text-align: center;">
                        <h4 style="margin: 0; font-size: 11px; font-weight: bold;">CORPO DE BOMBEIROS MILITAR DO ESTADO DO RIO DE JANEIRO</h4>
                        <h3 style="margin: 2px 0; font-size: 12px; font-weight: 800; color: #b91c1c;">RELATÓRIO OFICIAL DE CONFERÊNCIA DO ALMOXARIFADO MÉDICO</h3>
                        <h4 style="margin: 2px 0; font-size: 10px; font-weight: bold; color: #334155;">GRUPAMENTO DE OPERAÇÕES AÉREAS • DBM1/GOA - Lagoa</h4>
                        <p style="margin: 4px 0 0; font-size: 9.5px; font-weight: bold;">
                            Período: ${new Date(startDate + 'T00:00:00').toLocaleDateString('pt-BR')} até ${new Date(endDate + 'T23:59:59').toLocaleDateString('pt-BR')} · Entradas: ${stats.entradas} · Saídas: ${stats.saidas} · Itens: ${stats.totalItens}
                        </p>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 14px;">
                        <thead>
                            <tr style="background: #f1f5f9; font-size: 9.5px; font-weight: bold;">
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left; width: 18%;">Data/Hora</th>
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left; width: 32%;">Item</th>
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: center; width: 12%;">Tipo</th>
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: center; width: 8%;">Qtd</th>
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left; width: 18%;">Motivo / RAPH</th>
                                <th style="padding: 4px 6px; border: 1px solid #cbd5e1; text-align: left; width: 12%;">Responsável</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml || '<tr><td colspan="6" style="padding: 10px; text-align: center;">Nada a mostrar no período.</td></tr>'}</tbody>
                    </table>

                    <div style="margin-top: 24px; border-top: 1px solid #000; padding-top: 6px; font-size: 9px; display: flex; justify-content: space-between;">
                        <span><strong>Emissão:</strong> ${operator ? `${operator.grad} ${operator.warName} (RG: ${operator.rg})` : 'Oficial Aeromédico'}</span>
                        <span><strong>Data/Hora:</strong> ${horaGeracao}</span>
                    </div>
                `;

                const opt = {
                    margin: [8, 8, 8, 8],
                    filename: `Conferencia_Almoxarifado_${startDate}_${endDate}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                await html2pdf().set(opt).from(printContainer).save();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white border-2 border-slate-200 rounded-2xl max-w-4xl w-full p-4 sm:p-6 shadow-2xl max-h-[92vh] flex flex-col">
                        {/* Cabeçalho */}
                        <div className="flex items-center justify-between pb-3 border-b-2 border-slate-200 shrink-0">
                            <div>
                                <h3 className="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
                                    <span className="text-emerald-700">📊</span>
                                    <span>Conferência do almoxarifado</span>
                                </h3>
                                <p className="text-xs text-slate-500 font-medium mt-0.5">
                                    Histórico de entradas, saídas e movimentações do estoque operacional.
                                </p>
                            </div>
                            <button type="button" onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-800 text-2xl font-black leading-none">×</button>
                        </div>

                        {/* Filtros De / Até e Só o que se moveu */}
                        <div className="py-3 shrink-0 flex items-center gap-3 flex-wrap border-b border-slate-100 text-xs">
                            <div className="flex items-center gap-1.5">
                                <label className="font-bold text-slate-700">De:</label>
                                <input
                                    type="date"
                                    value={startDate}
                                    onChange={(e) => setStartDate(e.target.value)}
                                    className="bg-white border-2 border-slate-300 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-900 focus:outline-none"
                                />
                            </div>

                            <div className="flex items-center gap-1.5">
                                <label className="font-bold text-slate-700">Até:</label>
                                <input
                                    type="date"
                                    value={endDate}
                                    onChange={(e) => setEndDate(e.target.value)}
                                    className="bg-white border-2 border-slate-300 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-900 focus:outline-none"
                                />
                            </div>

                            <label className="flex items-center gap-2 cursor-pointer font-bold text-slate-800 select-none ml-2">
                                <input
                                    type="checkbox"
                                    checked={soOQueSeMoveu}
                                    onChange={(e) => setSoOQueSeMoveu(e.target.checked)}
                                    className="w-4 h-4 rounded text-emerald-600 focus:ring-0 cursor-pointer"
                                />
                                <span>só o que se moveu</span>
                            </label>
                        </div>

                        {/* Indicador de Resumo do Período */}
                        <div className="py-2.5 shrink-0 px-3 bg-sand-50 rounded-xl border border-sand-200 text-xs font-bold text-slate-800 my-2">
                            No período: <strong className="text-emerald-800">{stats.entradas} entrada(s)</strong> · <strong className="text-rose-800">{stats.saidas} saída(s)</strong> em <strong className="text-slate-950">{stats.totalItens} item(ns)</strong>.
                        </div>

                        {/* Tabela de Entradas e Saídas */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar border-2 border-slate-200 rounded-xl my-1">
                            {filteredMovements.length === 0 ? (
                                <div className="p-12 text-center text-slate-500 font-bold text-xs">
                                    Nada a mostrar no período.
                                </div>
                            ) : (
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead className="bg-slate-100 text-slate-800 font-black sticky top-0 z-10 border-b border-slate-300 shadow-xs">
                                        <tr>
                                            <th className="p-2.5 pl-3">Data / Hora</th>
                                            <th className="p-2.5">Item</th>
                                            <th className="p-2.5 text-center">Tipo</th>
                                            <th className="p-2.5 text-center">Qtd</th>
                                            <th className="p-2.5">Motivo / RAPH / Destino</th>
                                            <th className="p-2.5">Responsável</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredMovements.map((m, idx) => (
                                            <tr key={m.id || idx} className="hover:bg-sand-50/70 transition-colors">
                                                <td className="p-2.5 pl-3 font-semibold text-slate-600 whitespace-nowrap">
                                                    {m.dataHora ? `${new Date(m.dataHora).toLocaleDateString('pt-BR')} ${new Date(m.dataHora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : 'Hoje'}
                                                </td>
                                                <td className="p-2.5 font-black text-slate-900">
                                                    {m.item}
                                                </td>
                                                <td className="p-2.5 text-center">
                                                    <span className={`px-2 py-0.5 rounded-lg text-[10px] font-black uppercase text-white ${
                                                        m.tipo === 'ENTRADA' ? 'bg-emerald-700' :
                                                        m.tipo === 'AJUSTE' ? 'bg-amber-600' :
                                                        'bg-rose-700'
                                                    }`}>
                                                        {m.tipo}
                                                    </span>
                                                </td>
                                                <td className="p-2.5 text-center font-black text-slate-900">
                                                    {m.quantidade}
                                                </td>
                                                <td className="p-2.5 text-slate-700 font-medium">
                                                    {m.motivo}
                                                </td>
                                                <td className="p-2.5 text-slate-600 uppercase font-semibold text-[11px]">
                                                    {m.responsavel}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>

                        {/* Botões do Rodapé: Atualizar ⬇, CSV e 🖨 Imprimir */}
                        <div className="pt-3 border-t-2 border-slate-200 shrink-0 flex items-center justify-between gap-3 flex-wrap">
                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    onClick={() => setRefreshTick(t => t + 1)}
                                    className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold text-xs transition-all flex items-center gap-1 shadow-xs"
                                    title="Atualizar lista de movimentações"
                                >
                                    <span>Atualizar</span>
                                    <span>⬇</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={handleExportCSV}
                                    className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-bold text-xs transition-all flex items-center gap-1.5 shadow-xs"
                                    title="Baixar dados em formato CSV compatível com Excel"
                                >
                                    <span>📊 CSV</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={handlePrintPDF}
                                    className="px-3.5 py-2 rounded-xl bg-sand-100 hover:bg-sand-200 text-slate-900 border-2 border-sand-300 font-bold text-xs transition-all flex items-center gap-1.5 shadow-xs"
                                    title="Gerar tabela impressa em PDF"
                                >
                                    <span>🖨 Imprimir</span>
                                </button>
                            </div>

                            <button
                                type="button"
                                onClick={onClose}
                                className="px-6 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs transition-all shadow-sm"
                            >
                                Fechar
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 5. Modal de Novo Socorro / Registrar Lançamento do Socorro
        const ModalNovoSocorro = ({ isOpen, onClose, almoxItems, checklistCatalog, onSave, operator }) => {
            const [tipo, setTipo] = useState('Uso'); // Uso, Reposição do depósito, Falta detectada, Avaria detectada
            const [quantidade, setQuantidade] = useState(1);
            const [itemSearchQuery, setItemSearchQuery] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            
            const [tipoOcorrencia, setTipoOcorrencia] = useState('RAPH'); // RAPH, TIH, Outro
            const [numDocumento, setNumDocumento] = useState('');
            
            const [jaRetirouDeposito, setJaRetirouDeposito] = useState(false); // false = 'Não — repor depois', true = 'Sim, já retirei'
            const [qtdRetirada, setQtdRetirada] = useState(1);
            
            const [observacao, setObservacao] = useState('');
            const [foto, setFoto] = useState(null);
            const fileInputRef = useRef(null);

            // Reseta formulário ao abrir
            useEffect(() => {
                if (isOpen) {
                    setTipo('Uso');
                    setQuantidade(1);
                    setItemSearchQuery('');
                    setSelectedItem(null);
                    setIsDropdownOpen(false);
                    setTipoOcorrencia('RAPH');
                    setNumDocumento('');
                    setJaRetirouDeposito(false);
                    setQtdRetirada(1);
                    setObservacao('');
                    setFoto(null);
                }
            }, [isOpen]);

            // Sincroniza qtdRetirada com quantidade se não modificado manualmente
            useEffect(() => {
                if (!jaRetirouDeposito) {
                    setQtdRetirada(quantidade);
                }
            }, [quantidade, jaRetirouDeposito]);

            // Monta lista de busca unificada (Checklist Diário + Almoxarifado)
            const searchableItems = useMemo(() => {
                const list = [];
                const seen = new Set();
                
                // Itens do checklist diário
                (checklistCatalog || []).forEach(it => {
                    const name = (it.nome || it.name || '').trim();
                    if (name && !seen.has(name.toLowerCase())) {
                        seen.add(name.toLowerCase());
                        list.push({
                            id: it.id || `CHK-${name}`,
                            name: name,
                            category: it.grupo || it.aba || it.compartimento || 'Checklist Diário',
                            isPsico: it.aba === 'PSICOTROPICOS' || (it.grupo && it.grupo.toLowerCase().includes('psicotr'))
                        });
                    }
                });

                // Itens do Almoxarifado Central
                (almoxItems || []).forEach(it => {
                    const name = (it.name || '').trim();
                    if (name && !seen.has(name.toLowerCase())) {
                        seen.add(name.toLowerCase());
                        list.push({
                            id: it.id,
                            name: name,
                            category: it.category || 'Almoxarifado Central',
                            isPsico: (it.category && it.category.toLowerCase().includes('psicotr')) || false,
                            stock: it.currentStock
                        });
                    }
                });

                return list;
            }, [checklistCatalog, almoxItems]);

            // Filtragem rápida por digitação
            const filteredItems = useMemo(() => {
                if (!itemSearchQuery.trim()) return searchableItems.slice(0, 15);
                const q = itemSearchQuery.toLowerCase();
                return searchableItems.filter(it => 
                    it.name.toLowerCase().includes(q) || 
                    it.category.toLowerCase().includes(q)
                ).slice(0, 20);
            }, [searchableItems, itemSearchQuery]);

            // Verifica se o item selecionado é psicotrópico (torna RAPH/TIH obrigatório)
            const isPsicotropico = useMemo(() => {
                if (selectedItem && selectedItem.isPsico) return true;
                const q = (selectedItem ? selectedItem.name : itemSearchQuery).toLowerCase();
                return ['fentanil', 'morfina', 'midazolam', 'cetamina', 'etomidato', 'succinilcolina', 'vecurônio'].some(p => q.includes(p));
            }, [selectedItem, itemSearchQuery]);

            if (!isOpen) return null;

            const handleSelectItem = (it) => {
                setSelectedItem(it);
                setItemSearchQuery(it.name);
                setIsDropdownOpen(false);
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        alert('A imagem deve ter no máximo 5MB.');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFoto(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const itemName = selectedItem ? selectedItem.name : itemSearchQuery.trim();
                if (!itemName) {
                    alert('Por favor, digite e selecione o Item do socorro.');
                    return;
                }

                // Regra mandatória: psicotrópico exige RAPH ou TIH
                if (isPsicotropico && !numDocumento.trim()) {
                    alert('⚠️ ATENÇÃO: Em substâncias e medicamentos psicotrópicos (Portaria SVS/MS nº 344/1998), o número do RAPH ou do TIH é OBRIGATÓRIO!');
                    return;
                }

                const docStr = numDocumento.trim() ? `${tipoOcorrencia} ${numDocumento.trim()}` : '';

                const newRecord = {
                    id: `SOC-${Date.now()}`,
                    dataHora: new Date().toISOString(), // a hora entra sozinha
                    tipo: tipo,
                    item: itemName,
                    almoxItemId: selectedItem ? selectedItem.id : null,
                    quantidade: Number(quantidade) || 1,
                    tipoOcorrencia: tipoOcorrencia,
                    numDocumento: numDocumento.trim(),
                    raphTih: docStr || (tipo === 'Uso' ? 'Atendimento' : tipo),
                    isPsicotropico: isPsicotropico,
                    jaRetirouDeposito: jaRetirouDeposito,
                    qtdRetirada: jaRetirouDeposito ? (Number(qtdRetirada) || Number(quantidade) || 1) : 0,
                    reposto: jaRetirouDeposito || tipo === 'Reposição do depósito',
                    statusRepor: (jaRetirouDeposito || tipo === 'Reposição do depósito') ? 'REPOSTO' : 'A_REPOR',
                    observacao: observacao.trim(),
                    obs: observacao.trim(),
                    foto: foto,
                    militar: operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico',
                    rg: operator ? operator.rg : '---'
                };

                onSave(newRecord);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white border-2 border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[92vh] overflow-y-auto custom-scrollbar">
                        {/* Cabeçalho do Formulário */}
                        <div className="flex items-center justify-between pb-3 border-b-2 border-slate-200">
                            <h3 className="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
                                <span className="text-rose-600 font-black">➕</span>
                                <span>Registrar lançamento do socorro</span>
                            </h3>
                            <button 
                                type="button" 
                                onClick={onClose} 
                                className="p-1 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 font-black text-xl leading-none"
                                title="Fechar"
                            >
                                ×
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4 my-4 text-xs">
                            {/* 1. Tipo */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1.5">Tipo de Lançamento:</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {[
                                        { id: 'Uso', label: 'Uso', color: 'border-blue-500 bg-blue-50 text-blue-950' },
                                        { id: 'Reposição do depósito', label: 'Reposição do depósito', color: 'border-emerald-500 bg-emerald-50 text-emerald-950' },
                                        { id: 'Falta detectada', label: 'Falta detectada', color: 'border-amber-500 bg-amber-50 text-amber-950' },
                                        { id: 'Avaria detectada', label: 'Avaria detectada', color: 'border-rose-500 bg-rose-50 text-rose-950' }
                                    ].map(t => {
                                        const selected = tipo === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setTipo(t.id)}
                                                className={`py-2 px-3 rounded-xl text-xs font-bold border-2 transition-all text-left flex items-center justify-between ${
                                                    selected
                                                        ? `${t.color} font-black shadow-xs ring-1 ring-slate-400`
                                                        : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'
                                                }`}
                                            >
                                                <span>{t.label}</span>
                                                {selected && <span className="font-black text-rose-600">✓</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 2. Qtd e 3. Item */}
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                {/* Qtd com seletor de seta para cima e para baixo no canto direito */}
                                <div className="sm:col-span-1">
                                    <label className="block font-bold text-slate-800 mb-1">Qtd:</label>
                                    <div className="relative flex items-center">
                                        <input
                                            type="number"
                                            min="1"
                                            value={quantidade}
                                            onChange={(e) => setQuantidade(Math.max(1, parseInt(e.target.value) || 1))}
                                            className="w-full bg-white border-2 border-slate-300 rounded-xl px-3 py-2 text-sm font-black text-slate-900 pr-9 focus:border-rose-600 focus:outline-none"
                                            required
                                        />
                                        <div className="absolute right-1 inset-y-1 flex flex-col justify-center">
                                            <button
                                                type="button"
                                                onClick={() => setQuantidade(prev => prev + 1)}
                                                className="px-1 text-slate-600 hover:text-slate-950 hover:bg-slate-100 rounded leading-none text-[9px] font-black"
                                                title="Aumentar"
                                            >
                                                ▲
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setQuantidade(prev => Math.max(1, prev - 1))}
                                                className="px-1 text-slate-600 hover:text-slate-950 hover:bg-slate-100 rounded leading-none text-[9px] font-black"
                                                title="Diminuir"
                                            >
                                                ▼
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Item com busca comunicada aos checklists diários */}
                                <div className="sm:col-span-3 relative">
                                    <label className="block font-bold text-slate-800 mb-1">Item (digite para buscar):</label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            value={itemSearchQuery}
                                            onChange={(e) => {
                                                setItemSearchQuery(e.target.value);
                                                setSelectedItem(null);
                                                setIsDropdownOpen(true);
                                            }}
                                            onFocus={() => setIsDropdownOpen(true)}
                                            placeholder="Digite para buscar insumo do checklist..."
                                            className="w-full bg-white border-2 border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 placeholder-slate-400 focus:border-rose-600 focus:outline-none"
                                            required
                                        />
                                        {selectedItem && (
                                            <span className="absolute right-2.5 top-2 text-emerald-600 font-black text-xs" title="Item Selecionado">
                                                ✓
                                            </span>
                                        )}
                                    </div>

                                    {/* Dropdown de Auto-sugestão */}
                                    {isDropdownOpen && filteredItems.length > 0 && (
                                        <div className="absolute left-0 right-0 top-full mt-1 bg-white border-2 border-slate-300 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
                                            {filteredItems.map((it, idx) => (
                                                <div
                                                    key={it.id || idx}
                                                    onClick={() => handleSelectItem(it)}
                                                    className="p-2.5 hover:bg-sand-100 cursor-pointer flex items-center justify-between gap-2 text-xs transition-colors"
                                                >
                                                    <div>
                                                        <p className="font-bold text-slate-900">{it.name}</p>
                                                        <span className="text-[10px] text-slate-500 font-medium">{it.category}</span>
                                                    </div>
                                                    {it.isPsico && (
                                                        <span className="px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300 text-[9px] font-black uppercase">
                                                            Psicotrópico
                                                        </span>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* Alerta de Psicotrópico detectado */}
                                    {isPsicotropico && (
                                        <div className="mt-1 flex items-center gap-1.5 text-[11px] font-bold text-amber-800">
                                            <span>⚠️ Psicotrópico detectado: RAPH/TIH é obrigatório para este insumo.</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 4. Ocorrência do socorro (opcional, exceto para psicotrópico) */}
                            <div className="p-3 rounded-xl bg-sand-50 border border-sand-300 space-y-2">
                                <div className="flex items-center justify-between">
                                    <label className="font-bold text-slate-800">
                                        Ocorrência do socorro:
                                    </label>
                                    {isPsicotropico ? (
                                        <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300">
                                            OBRIGATÓRIO
                                        </span>
                                    ) : (
                                        <span className="text-[10px] font-semibold text-slate-500">
                                            (Opcional)
                                        </span>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    {/* Opções de Seleção: RAPH, TIH, Outro */}
                                    <div className="flex bg-slate-200 p-0.5 rounded-xl border border-slate-300 gap-1">
                                        {['RAPH', 'TIH', 'Outro'].map(opc => (
                                            <button
                                                key={opc}
                                                type="button"
                                                onClick={() => setTipoOcorrencia(opc)}
                                                className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                                    tipoOcorrencia === opc
                                                        ? 'bg-white text-rose-700 shadow-xs font-black'
                                                        : 'text-slate-700 hover:text-slate-900'
                                                }`}
                                            >
                                                {opc}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Número do Documento */}
                                    <div className="sm:col-span-2">
                                        <input
                                            type="text"
                                            value={numDocumento}
                                            onChange={(e) => setNumDocumento(e.target.value)}
                                            placeholder={tipoOcorrencia === 'Outro' ? 'Ex: Treinamento / Instrução UASA' : `Nº do ${tipoOcorrencia} (Ex: 4921)`}
                                            className={`w-full bg-white border-2 rounded-xl px-3 py-1.5 text-xs font-mono font-bold text-slate-900 focus:outline-none ${
                                                isPsicotropico && !numDocumento.trim()
                                                    ? 'border-amber-400 focus:border-rose-600'
                                                    : 'border-slate-300 focus:border-rose-600'
                                            }`}
                                            required={isPsicotropico}
                                        />
                                    </div>
                                </div>

                                <p className="text-[10px] text-slate-600 font-medium">
                                    Informe o RAPH/TIH do socorro quando houver — ajuda a rastrear o consumo.
                                </p>
                            </div>

                            {/* 5. Já retirou do depósito para repor a mochila? */}
                            <div className="p-3.5 rounded-xl bg-white border-2 border-slate-200 space-y-2.5">
                                <label className="block font-bold text-slate-900">
                                    Já retirou do depósito para repor a mochila?
                                </label>

                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setJaRetirouDeposito(false)}
                                        className={`py-2 px-3 rounded-xl text-xs font-bold border-2 transition-all text-center ${
                                            !jaRetirouDeposito
                                                ? 'bg-amber-50 border-amber-500 text-amber-950 font-black shadow-xs'
                                                : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'
                                        }`}
                                    >
                                        Não — repor depois
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setJaRetirouDeposito(true)}
                                        className={`py-2 px-3 rounded-xl text-xs font-bold border-2 transition-all text-center ${
                                            jaRetirouDeposito
                                                ? 'bg-emerald-50 border-emerald-500 text-emerald-950 font-black shadow-xs'
                                                : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'
                                        }`}
                                    >
                                        Sim, já retirei
                                    </button>
                                </div>

                                {/* Se SIM: Abre campo de seleção de quantidade para baixa automática */}
                                {jaRetirouDeposito ? (
                                    <div className="p-2.5 rounded-xl bg-emerald-50 border border-emerald-300 space-y-2 mt-2">
                                        <div className="flex items-center justify-between gap-3">
                                            <label className="font-bold text-emerald-950 text-xs">
                                                Qtd retirada do depósito para reposição imediata:
                                            </label>
                                            <div className="relative flex items-center w-28">
                                                <input
                                                    type="number"
                                                    min="1"
                                                    value={qtdRetirada}
                                                    onChange={(e) => setQtdRetirada(Math.max(1, parseInt(e.target.value) || 1))}
                                                    className="w-full bg-white border-2 border-emerald-400 rounded-xl px-3 py-1.5 text-xs font-black text-slate-900 pr-8 focus:outline-none"
                                                />
                                                <div className="absolute right-1 inset-y-1 flex flex-col justify-center">
                                                    <button
                                                        type="button"
                                                        onClick={() => setQtdRetirada(prev => prev + 1)}
                                                        className="px-1 text-slate-600 hover:text-slate-950 rounded leading-none text-[8px] font-black"
                                                    >
                                                        ▲
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => setQtdRetirada(prev => Math.max(1, prev - 1))}
                                                        className="px-1 text-slate-600 hover:text-slate-950 rounded leading-none text-[8px] font-black"
                                                    >
                                                        ▼
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="text-[10px] text-emerald-800 font-semibold flex items-center gap-1">
                                            <span>✓</span>
                                            <span>Toda reposição dá baixa automática no Almoxarifado.</span>
                                        </p>
                                    </div>
                                ) : (
                                    <p className="text-[10.5px] text-amber-900 bg-amber-50 p-2 rounded-lg border border-amber-200 font-semibold leading-relaxed">
                                        Sem problema: o lançamento fica marcado como "a repor" e o botão 📦 Repor aparece na linha do tempo.
                                    </p>
                                )}
                            </div>

                            {/* 6. Observação */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1">Observação:</label>
                                <textarea
                                    rows="2"
                                    value={observacao}
                                    onChange={(e) => setObservacao(e.target.value)}
                                    placeholder="Descreva detalhes da ocorrência, paciente, motivo da avaria ou reposição..."
                                    className="w-full bg-white border-2 border-slate-300 rounded-xl p-2.5 text-xs text-slate-900 font-medium placeholder-slate-400 focus:border-rose-600 focus:outline-none"
                                ></textarea>
                            </div>

                            {/* 7. Foto (opcional) */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1">Foto (opcional):</label>
                                <input
                                    type="file"
                                    accept="image/*"
                                    ref={fileInputRef}
                                    onChange={handlePhotoUpload}
                                    className="hidden"
                                />

                                <div className="flex items-center gap-3">
                                    <button
                                        type="button"
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="px-3.5 py-2 rounded-xl bg-white border-2 border-slate-300 hover:bg-slate-100 text-slate-800 font-extrabold text-xs transition-all flex items-center gap-1.5 shadow-xs"
                                    >
                                        <span>📷 Anexar</span>
                                    </button>

                                    {foto && (
                                        <div className="flex items-center gap-2 bg-sand-50 p-1.5 px-2.5 rounded-xl border border-sand-300">
                                            <img src={foto} alt="Preview" className="w-8 h-8 object-cover rounded-lg border" />
                                            <span className="text-[10px] text-emerald-800 font-bold">Foto pronta</span>
                                            <button
                                                type="button"
                                                onClick={() => setFoto(null)}
                                                className="text-rose-600 hover:text-rose-800 font-black text-xs ml-1"
                                                title="Remover foto"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 8. Botões Cancelar e Registrar */}
                            <div className="flex items-center gap-2 pt-3 border-t-2 border-slate-200">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border-2 border-slate-300 font-extrabold transition-all"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black shadow-md shadow-rose-900/30 transition-all flex items-center justify-center gap-1.5"
                                >
                                    <span>Registrar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // 5.1 Modal de Edição / Correção de Lançamento do Socorro
        const ModalEditarSocorro = ({ isOpen, onClose, socorro, almoxItems, checklistCatalog, onSave, operator }) => {
            if (!isOpen || !socorro) return null;

            const [tipo, setTipo] = useState(socorro.tipo || 'Uso');
            const [quantidade, setQuantidade] = useState(Number(socorro.quantidade) || 1);
            const [itemSearchQuery, setItemSearchQuery] = useState(socorro.item || '');
            const [selectedItem, setSelectedItem] = useState(null);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            
            const [tipoOcorrencia, setTipoOcorrencia] = useState(socorro.tipoOcorrencia || 'RAPH');
            const [numDocumento, setNumDocumento] = useState(socorro.numDocumento || (socorro.raphTih ? String(socorro.raphTih).replace(/^(RAPH|TIH|Outro)\s*/i, '') : ''));
            
            const [jaRetirouDeposito, setJaRetirouDeposito] = useState(socorro.jaRetirouDeposito || socorro.reposto || false);
            const [qtdRetirada, setQtdRetirada] = useState(Number(socorro.qtdRetirada) || Number(socorro.quantidade) || 1);
            
            const [observacao, setObservacao] = useState(socorro.observacao || socorro.obs || '');
            const [foto, setFoto] = useState(socorro.foto || null);
            const fileInputRef = useRef(null);

            // Lista unificada para busca
            const searchableItems = useMemo(() => {
                const list = [];
                const seen = new Set();
                (checklistCatalog || []).forEach(it => {
                    const name = (it.nome || it.name || '').trim();
                    if (name && !seen.has(name.toLowerCase())) {
                        seen.add(name.toLowerCase());
                        list.push({
                            id: it.id || `CHK-${name}`,
                            name: name,
                            category: it.grupo || it.aba || it.compartimento || 'Checklist Diário',
                            isPsico: it.aba === 'PSICOTROPICOS' || (it.grupo && it.grupo.toLowerCase().includes('psicotr'))
                        });
                    }
                });
                (almoxItems || []).forEach(it => {
                    const name = (it.name || '').trim();
                    if (name && !seen.has(name.toLowerCase())) {
                        seen.add(name.toLowerCase());
                        list.push({
                            id: it.id,
                            name: name,
                            category: it.category || 'Almoxarifado Central',
                            isPsico: (it.category && it.category.toLowerCase().includes('psicotr')) || false,
                            stock: it.currentStock
                        });
                    }
                });
                return list;
            }, [checklistCatalog, almoxItems]);

            const filteredItems = useMemo(() => {
                if (!itemSearchQuery.trim()) return searchableItems.slice(0, 15);
                const q = itemSearchQuery.toLowerCase();
                return searchableItems.filter(it => 
                    it.name.toLowerCase().includes(q) || 
                    it.category.toLowerCase().includes(q)
                ).slice(0, 20);
            }, [searchableItems, itemSearchQuery]);

            const isPsicotropico = useMemo(() => {
                if (selectedItem && selectedItem.isPsico) return true;
                const q = (selectedItem ? selectedItem.name : itemSearchQuery).toLowerCase();
                return ['fentanil', 'morfina', 'midazolam', 'cetamina', 'etomidato', 'succinilcolina', 'vecurônio'].some(p => q.includes(p));
            }, [selectedItem, itemSearchQuery]);

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        alert('A imagem deve ter no máximo 5MB.');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => setFoto(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const itemName = selectedItem ? selectedItem.name : itemSearchQuery.trim();
                if (!itemName) {
                    alert('Por favor, informe o Item do socorro.');
                    return;
                }

                if (isPsicotropico && !numDocumento.trim()) {
                    alert('⚠️ ATENÇÃO: Em substâncias e medicamentos psicotrópicos, o número do RAPH ou do TIH é OBRIGATÓRIO!');
                    return;
                }

                // Calcula variação de reposição no almoxarifado (delta)
                const oldReporQtd = (socorro.reposto || socorro.jaRetirouDeposito || socorro.tipo === 'Reposição do depósito') ? (Number(socorro.qtdRetirada || socorro.quantidade) || 1) : 0;
                const newReporQtd = (jaRetirouDeposito || tipo === 'Reposição do depósito') ? (Number(qtdRetirada) || Number(quantidade) || 1) : 0;
                const deltaStock = newReporQtd - oldReporQtd;

                const docStr = numDocumento.trim() ? `${tipoOcorrencia} ${numDocumento.trim()}` : '';

                const updated = {
                    ...socorro,
                    tipo: tipo,
                    item: itemName,
                    almoxItemId: selectedItem ? selectedItem.id : socorro.almoxItemId,
                    quantidade: Number(quantidade) || 1,
                    tipoOcorrencia: tipoOcorrencia,
                    numDocumento: numDocumento.trim(),
                    raphTih: docStr || (tipo === 'Uso' ? 'Atendimento' : tipo),
                    isPsicotropico: isPsicotropico,
                    jaRetirouDeposito: jaRetirouDeposito,
                    qtdRetirada: (jaRetirouDeposito || tipo === 'Reposição do depósito') ? (Number(qtdRetirada) || Number(quantidade) || 1) : 0,
                    reposto: jaRetirouDeposito || tipo === 'Reposição do depósito',
                    statusRepor: (jaRetirouDeposito || tipo === 'Reposição do depósito') ? 'REPOSTO' : 'A_REPOR',
                    observacao: observacao.trim(),
                    obs: observacao.trim(),
                    foto: foto,
                    editadoEm: new Date().toISOString(),
                    editadoPor: operator ? `${operator.grad} ${operator.warName}` : 'Oficial Aeromédico'
                };

                onSave(updated, deltaStock);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white border-2 border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[92vh] overflow-y-auto custom-scrollbar">
                        <div className="flex items-center justify-between pb-3 border-b-2 border-slate-200">
                            <h3 className="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
                                <span className="text-blue-600">✏️</span>
                                <span>Editar lançamento do socorro</span>
                            </h3>
                            <button type="button" onClick={onClose} className="p-1 rounded-lg text-slate-500 hover:text-slate-900 text-xl font-black">×</button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4 my-4 text-xs">
                            {/* Tipo */}
                            <div>
                                <label className="block font-bold text-slate-800 mb-1.5">Tipo de Lançamento:</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {[
                                        { id: 'Uso', label: 'Uso', color: 'border-blue-500 bg-blue-50 text-blue-950' },
                                        { id: 'Reposição do depósito', label: 'Reposição do depósito', color: 'border-emerald-500 bg-emerald-50 text-emerald-950' },
                                        { id: 'Falta detectada', label: 'Falta detectada', color: 'border-amber-500 bg-amber-50 text-amber-950' },
                                        { id: 'Avaria detectada', label: 'Avaria detectada', color: 'border-rose-500 bg-rose-50 text-rose-950' }
                                    ].map(t => {
                                        const selected = tipo === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setTipo(t.id)}
                                                className={`py-2 px-3 rounded-xl text-xs font-bold border-2 transition-all text-left flex items-center justify-between ${
                                                    selected ? `${t.color} font-black shadow-xs ring-1 ring-slate-400` : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'
                                                }`}
                                            >
                                                <span>{t.label}</span>
                                                {selected && <span className="font-black text-blue-600">✓</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Qtd e Item */}
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                <div className="sm:col-span-1">
                                    <label className="block font-bold text-slate-800 mb-1">Qtd:</label>
                                    <div className="relative flex items-center">
                                        <input
                                            type="number"
                                            min="1"
                                            value={quantidade}
                                            onChange={(e) => setQuantidade(Math.max(1, parseInt(e.target.value) || 1))}

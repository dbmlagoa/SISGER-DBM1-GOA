                    return data;
                }
                const res = await fetch(scriptUrl, {

        // ====================================================================
        // COMPONENTE: ABA ALMOXARIFADO MÉDICO (139 ITENS REAIS DO EXCEL)

        const TabAlmoxarifado = ({

        }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('TODOS');
            const [statusFilter, setStatusFilter] = useState('TODOS'); // 'TODOS', 'CRITICO', 'VENCIDO', 'VENCENDO'

            const categories = [

                'Medicamentos e Farmacos',
                'Vias Aereas e Oxigenio',
                'Curativos e Trauma',
                'Acesso Venoso e Infusao',
                'Insumos Gerais'

                return almoxItems.filter(item => {
                    const matchSearch = 
                        item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.category && item.category.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (item.serialLot && item.serialLot.toLowerCase().includes(searchTerm.toLowerCase())) ||
                        (item.id && item.id.toLowerCase().includes(searchTerm.toLowerCase()));

                    const matchCat = categoryFilter === 'TODOS' || item.category === categoryFilter;

                    let matchStatus = true;
                    const days = getDaysUntilExpiry(item.expirationDate);
                    const isCritical = Number(item.currentStock) <= Number(item.minStock);

                    if (statusFilter === 'CRITICO') {
                        matchStatus = isCritical;
                    } else if (statusFilter === 'VENCIDO') {
                        matchStatus = days !== null && days < 0;
                    } else if (statusFilter === 'VENCENDO') {
                        matchStatus = days !== null && days >= 0 && days <= 60;
                    }

                    return matchSearch && matchCat && matchStatus;
                });
            }, [almoxItems, searchTerm, categoryFilter, statusFilter]);

                <div className="space-y-6 tab-fade-in">
                    {/* Barra Superior: Busca, Filtros e Botão Novo */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-3">

                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}

                            </button>

                        {/* Filtros de Categoria */}

                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    type="button"
                                    onClick={() => setCategoryFilter(cat)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                        categoryFilter === cat
                                            ? 'bg-rose-600 text-white shadow'

                                    onClick={() => setStatusFilter('TODOS')}

                                    type="button"

                                        const isZero = Number(item.currentStock) === 0;

                                                            'bg-slate-800 text-emerald-400'
                                                        }`}>
                                                            {formatBRDate(item.expirationDate)}
                                                            {days < 0 && ' (VENCIDO)'}
                                                            {days >= 0 && days <= 60 && ` (${days}d)`}
                                                        </span>
                                                    ) : (
                                                        <span className="text-slate-500">---</span>
                                                    )}
                                                </td>
                                                <td className="py-3 px-3 text-slate-400 text-xs">
                                                    {formatBRDate(item.expirationDate2)}
                                                </td>
                                                <td className="py-3 px-3 font-mono text-[11px] text-slate-400">
                                                    {item.serialLot || 'LOT-UASA'}

                                                <td className="py-3 px-4 text-right">

                                                        type="button"

        const TabCalculadora = () => {
            const [cylinderType, setCylinderType] = useState('0.16'); // M9 = 0.16, Spencer = 0.28, Fixo = 1.56
            const [pressure, setPressure] = useState(2000); // Em PSI
            const [unit, setUnit] = useState('PSI'); // 'PSI' ou 'BAR'
            const [safetyMargin, setSafetyMargin] = useState(500); // PSI
            const [flowRate, setFlowRate] = useState(10); // L/min

            // Fatores de conversão e cálculo
            const factor = Number(cylinderType);

            // Converter se a entrada for em BAR
            const currentPsi = unit === 'BAR' ? pressure * 14.5038 : pressure;
            const marginPsi = unit === 'BAR' ? safetyMargin * 14.5038 : safetyMargin;

            // Autonomia Útil com Margem Segura
            const usefulPsi = Math.max(0, currentPsi - marginPsi);
            const usefulMinutes = flowRate > 0 ? Math.floor((usefulPsi * factor) / flowRate) : 0;
            const totalMinutes = flowRate > 0 ? Math.floor((currentPsi * factor) / flowRate) : 0;

            const usefulHours = `${Math.floor(usefulMinutes / 60)}h ${usefulMinutes % 60}m`;
            const totalHours = `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m`;

                                    >

        // 2. Modal de Apontamento de Não Conformidade (NC)

        // 3. Modal de Movimentação do Almoxarifado

            useEffect(() => {
                if (item) {
                    setQuantity(1);
                    setReason('');
                    setLot(item.serialLot || '');
                    setExpiry(item.expirationDate || '');
                }
            }, [item, isOpen]);

            if (!isOpen || !item) return null;

            const curStock = Number(item.currentStock) || 0;
            const numQtd = Number(quantity) || 0;
            const newStock = type === 'ENTRADA' ? curStock + numQtd :
                             type === 'AJUSTE' ? numQtd :
                             Math.max(0, curStock - numQtd);

            const handleSave = () => {
                if (numQtd <= 0 && type !== 'AJUSTE') return;
                onConfirm({
                    itemId: item.id,
                    itemName: item.name,
                    type,
                    quantity: numQtd,
                    curStock,
                    newStock,
                    reason: reason.trim(),
                    lot,
                    expiry,
                    operator: `${operator.grad} ${operator.warName}`,
                    rg: operator.rg

                onClose();

                                />
                            </div>
                        </div>

                        <div className="flex items-center gap-2 pt-3 border-t border-slate-800">
                            <button

                            >

            const [category, setCategory] = useState('Medicamentos e Farmacos');
            const [currentStock, setCurrentStock] = useState(10);
            const [minStock, setMinStock] = useState(5);
            const [expirationDate, setExpirationDate] = useState('');
            const [serialLot, setSerialLot] = useState('');

                                        equipeAssume: row[11] || '',
                                        rgAssume: row[12] || '',
                                        dataHora: row[13] || ''
                                    }));
                                    setPassagensList(mappedPas);
                                }
                            } else {
                                setSyncStatus('local');
                            }
                        }
                    } else {
                        setSyncStatus('local');
                    }
                };

                loadRemoteData();
                return () => { isMounted = false; };
            }, [scriptUrl]);

            // Handlers de Autenticação
            const handleLogin = (user) => {
                setOperator(user);
                safeSessionSet('sigaero_operator', JSON.stringify(user));
                showToast(`Bem-vindo, ${user.grad} ${user.warName}!`);
            };

            const handleRegister = async (newUser) => {
                setUsers(prev => [newUser, ...prev]);
                setOperator(newUser);
                safeSessionSet('sigaero_operator', JSON.stringify(newUser));
                showToast(`Militar cadastrado com sucesso: ${newUser.grad} ${newUser.warName}!`);
                
                // Envio ao GAS
                callGAS(scriptUrl, 'registerOperator', {
                    grad: newUser.grad,
                    warName: newUser.warName,
                    rg: newUser.rg,
                    pass: newUser.pass,
                    role: newUser.role
                });
            };

            const handleLogout = () => {
                safeSessionRemove('sigaero_operator');
                setOperator(null);
                showToast('Sessão encerrada com segurança.', 'info');
            };

            const handleSaveScriptUrl = (newUrl) => {
                setScriptUrl(newUrl);
                safeLocalSet('sigaero_script_url', newUrl);
                showToast('URL da planilha salva com sucesso!');
            };

            // Handlers de Negócio
            const handleSaveChecklist = (record) => {
                setChecklistHistory(prev => [record, ...prev]);
                showToast(`Checklist salvo! ${record.totalNCs} NC(s) registradas.`);
                callGAS(scriptUrl, 'saveChecklist', { checklist: record });
            };

            const handleSaveSocorro = (socorro) => {
                setSocorrosList(prev => [socorro, ...prev]);
                
                // Baixa automática no almoxarifado se marcada
                if (socorro.reporAlmox && socorro.item) {
                    setAlmoxItems(prev => {
                        return prev.map(item => {
                            if (item.name === socorro.item || (item.name && socorro.item.includes(item.name))) {
                                const cur = Number(item.currentStock) || 0;
                                const sub = Number(socorro.quantidade) || 1;
                                return { ...item, currentStock: Math.max(0, cur - sub) };
                            }
                            return item;
                        });
                    });
                }

                showToast(`Atendimento salvo com sucesso (${socorro.raphTih})!`);
                callGAS(scriptUrl, 'registerSocorro', { socorro });
            };

            const handleConfirmMovimento = (mov) => {
                setAlmoxItems(prev => {
                    return prev.map(item => {
                        if (item.id === mov.itemId) {
                            return {
                                ...item,
                                currentStock: mov.newStock,
                                serialLot: mov.lot || item.serialLot,
                                expirationDate: mov.expiry || item.expirationDate
                            };
                        }
                        return item;
                    });
                });

                showToast(`Estoque atualizado: ${mov.itemName} (${mov.curStock} -> ${mov.newStock})!`);
                callGAS(scriptUrl, 'moveAlmox', { mov });
            };

            const handleSaveNovoItem = (newItem) => {
                setAlmoxItems(prev => [newItem, ...prev]);
                showToast(`Novo item adicionado: ${newItem.name}!`);
                callGAS(scriptUrl, 'saveAlmoxItem', { item: newItem });
            };

            const handleSaveNovoVoo = (voo) => {
                setVoosList(prev => [voo, ...prev]);
                showToast(`Missão aérea salva (${voo.minutosVoo} min voados)!`);
                callGAS(scriptUrl, 'saveVoo', { voo });
            };

            const handleSaveNovaPassagem = (pas) => {
                setPassagensList(prev => [pas, ...prev]);
                showToast('Plantão transmitido e registrado no sistema!');
                callGAS(scriptUrl, 'savePassagem', { passagem: pas });
            };

            // Contagens para Badges do Menu
            const criticalStockCount = useMemo(() => {
                return almoxItems.filter(i => Number(i.currentStock) <= Number(i.minStock)).length;
            }, [almoxItems]);

            const expiryAlertCount = useMemo(() => {
                return almoxItems.filter(i => {
                    const days = getDaysUntilExpiry(i.expirationDate);
                    return days !== null && days <= 60;
                }).length;
            }, [almoxItems]);

            // Se não autenticado, renderiza tela de login
            if (!operator) {
                return (
                    <>
                        <LoginScreen 
                            onLogin={handleLogin} 
                            onRegister={handleRegister} 
                            users={users} 
                            scriptUrl={scriptUrl}
                        />
                        {toast && (
                            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 border animate-in slide-in-from-bottom duration-200 ${
                                toast.type === 'error' ? 'bg-red-950 text-red-200 border-red-800' :
                                toast.type === 'info' ? 'bg-sky-950 text-sky-200 border-sky-800' :
                                'bg-emerald-950 text-emerald-200 border-emerald-800'
                            }`}>
                                <Icon name={toast.type === 'error' ? 'alert' : 'check'} className="w-4 h-4" />
                                <span>{toast.message}</span>
                            </div>
                        )}
                    </>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    {/* Cabeçalho Superior */}
                    <Header
                        operator={operator}
                        onLogout={handleLogout}
                        onOpenSettings={() => setIsSettingsOpen(true)}
                        syncStatus={syncStatus}
                        onToggleMobileMenu={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    />

                    {/* Layout Principal: Sidebar + Conteúdo */}
                    <div className="flex-1 flex overflow-hidden">
                        <Sidebar
                            activeTab={activeTab}
                            onSelectTab={setActiveTab}
                            isMobileOpen={isMobileMenuOpen}
                            onCloseMobile={() => setIsMobileMenuOpen(false)}
                            criticalStockCount={criticalStockCount}
                            expiryAlertCount={expiryAlertCount}
                            pendingChecklists={0}
                        />

                        {/* Conteúdo Central */}
                        <main className="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto custom-scrollbar pb-24 lg:pb-8">
                            {activeTab === 'dashboard' && (
                                <TabDashboard
                                    operator={operator}
                                    almoxItems={almoxItems}
                                    checklistHistory={checklistHistory}
                                    socorrosList={socorrosList}
                                    voosList={voosList}
                                    onNavigate={setActiveTab}
                                    onOpenNewSocorro={() => setIsNovoSocorroOpen(true)}
                                    onOpenMovimento={(item) => setMovModalData({ isOpen: true, item })}
                                />
                            )}

                            {activeTab === 'checklist' && (
                                <TabChecklist
                                    checklistCatalog={checklistCatalog}
                                    onSaveChecklist={handleSaveChecklist}
                                    operator={operator}
                                    checklistHistory={checklistHistory}
                                    onOpenNCModal={(item, currentNC, onSave) => {
                                        setNcModalData({ isOpen: true, item, currentNC, onSave });
                                    }}
                                />
                            )}

                            {activeTab === 'socorros' && (
                                <TabSocorros
                                    socorrosList={socorrosList}
                                    onOpenNewSocorro={() => setIsNovoSocorroOpen(true)}
                                />
                            )}

                            {activeTab === 'almoxarifado' && (
                                <TabAlmoxarifado
                                    almoxItems={almoxItems}
                                    onOpenMovimento={(item) => setMovModalData({ isOpen: true, item })}
                                    onOpenNovoItem={() => setIsNovoItemOpen(true)}
                                />
                            )}

                            {activeTab === 'voos' && (
                                <TabVoos
                                    voosList={voosList}
                                    onOpenNovoVoo={() => setIsNovoVooOpen(true)}
                                />
                            )}

                            {activeTab === 'passagem' && (
                                <TabPassagem
                                    passagensList={passagensList}
                                    onOpenNovaPassagem={() => setIsNovaPassagemOpen(true)}
                                    operator={operator}
                                />
                            )}

                            {activeTab === 'calculadora' && (
                                <TabCalculadora />
                            )}
                        </main>
                    </div>

                    {/* Barra de Navegação Rápida Inferior para Smartphones */}
                    <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-2 py-1.5 flex items-center justify-around z-40">
                        {[
                            { id: 'dashboard', label: 'Resumo', icon: 'dashboard' },
                            { id: 'checklist', label: 'Checklist', icon: 'checklist' },
                            { id: 'socorros', label: 'RAPH', icon: 'socorros' },
                            { id: 'almoxarifado', label: 'Almox', icon: 'almoxarifado' },
                            { id: 'voos', label: 'Voos', icon: 'voos' }
                        ].map(t => {
                            const active = activeTab === t.id;
                            return (
                                <button
                                    key={t.id}
                                    type="button"
                                    onClick={() => setActiveTab(t.id)}
                                    className={`flex flex-col items-center py-1 px-2 rounded-xl transition-all ${
                                        active ? 'text-rose-400 font-extrabold' : 'text-slate-400 font-medium'
                                    }`}
                                >
                                    <Icon name={t.icon} className="w-5 h-5" />
                                    <span className="text-[10px] mt-0.5">{t.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* Modais do Sistema */}
                    <ModalSettings
                        isOpen={isSettingsOpen}
                        onClose={() => setIsSettingsOpen(false)}
                        scriptUrl={scriptUrl}
                        onSaveScriptUrl={handleSaveScriptUrl}
                    />

                    <ModalNC
                        isOpen={ncModalData.isOpen}
                        onClose={() => setNcModalData({ isOpen: false, item: null, currentNC: null, onSave: null })}
                        item={ncModalData.item}
                        currentNC={ncModalData.currentNC}
                        onSave={(updated) => {
                            if (ncModalData.onSave) ncModalData.onSave(updated);
                        }}
                    />

                    <ModalMovimento
                        isOpen={movModalData.isOpen}
                        onClose={() => setMovModalData({ isOpen: false, item: null })}
                        item={movModalData.item}
                        onConfirm={handleConfirmMovimento}
                        operator={operator}
                    />

                    <ModalNovoItem
                        isOpen={isNovoItemOpen}
                        onClose={() => setIsNovoItemOpen(false)}
                        onSave={handleSaveNovoItem}
                    />

                    <ModalNovoSocorro
                        isOpen={isNovoSocorroOpen}
                        onClose={() => setIsNovoSocorroOpen(false)}
                        almoxItems={almoxItems}
                        onSave={handleSaveSocorro}
                        operator={operator}
                    />

                    <ModalNovoVoo
                        isOpen={isNovoVooOpen}
                        onClose={() => setIsNovoVooOpen(false)}
                        onSave={handleSaveNovoVoo}
                        operator={operator}
                    />

                    <ModalNovaPassagem
                        isOpen={isNovaPassagemOpen}
                        onClose={() => setIsNovaPassagemOpen(false)}
                        onSave={handleSaveNovaPassagem}
                        operator={operator}
                    />

                    {/* Notificação Toast */}
                    {toast && (
                        <div className={`fixed bottom-20 lg:bottom-6 right-6 z-50 px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2.5 border backdrop-blur-md animate-in slide-in-from-bottom duration-200 ${
                            toast.type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' :
                            toast.type === 'info' ? 'bg-sky-950/90 text-sky-200 border-sky-800' :
                            'bg-emerald-950/90 text-emerald-200 border-emerald-800'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert' : 'check'} className="w-4 h-4 shrink-0" />
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        // Renderização no Elemento Raiz
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

];

            const App = () => {
                // Operador ativo com fallback seguro para Subten Gomes (Fiel DMOP) para nunca bloquear a navegação
                const [operator, setOperator] = useState(() => safeStorageGet('sigmat_operator') || {
                    grad: 'SUBTEN',
                    name: 'GOMES',
                    rg: '22194'
                });
                const [authMode, setAuthMode] = useState('login'); 
                const [authError, setAuthError] = useState('');
                const [authLoading, setAuthLoading] = useState(false);

                const [activeTab, setActiveTab] = useState('dashboard');
                
                // Inicialização imediata com todos os 185 itens operacionais autênticos
                const [items, setItems] = useState(() => {
                    const cached = safeStorageGet('sigmat_items');
                    return (cached && Array.isArray(cached) && cached.length > 0) ? cached : DEFAULT_SIGMAT_ITEMS;
                });

                // Inicialização imediata com todos os 18 registros autênticos pré-carregados
                const [transactions, setTransactions] = useState(() => {
                    const cached = safeStorageGet('sigmat_transactions');
                    if (cached && Array.isArray(cached) && cached.length >= 18) return cached;
                    return DEFAULT_SIGMAT_TRANSACTIONS;
                });

                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);
                
                const [isSubmitting, setIsSubmitting] = useState(false);
                const isSubmittingRef = useRef(false);

                const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

                const [isModalOpen, setIsModalOpen] = useState(false);
                const [modalType, setModalType] = useState('item');
                const [selectedItem, setSelectedItem] = useState(null);
                const [movementType, setMovementType] = useState('saída');
                const [searchTerm, setSearchTerm] = useState('');
                const [categoryFilter, setCategoryFilter] = useState('TODOS');
                const [highlightedItemId, setHighlightedItemId] = useState(null);
                const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

                // Estatísticas operacionais calculadas com suporte a avarias
                const stats = useMemo(() => {
                    const currentYear = new Date().getFullYear();
                    const criticalItems = items.filter(i => Number(i.currentStock) < Number(i.minStock));
                    const expiredItems = items.filter(i => {
                        const fab = Number(i.mfgYear);
                        const life = Number(i.lifespan);
                        return fab > 0 && life > 0 && (fab + life) <= currentYear;
                    });
                    const damageReports = transactions.filter(t => isDamageType(t.type));
                    return { totalItems: items.length, criticalItems, expiredItems, totalMovements: transactions.length, damageReports };
                }, [items, transactions]);

                // Sincronização em segundo plano com o Google Apps Script
                const syncWithServer = async () => {
                    setLoading(true);
                    setError(null);
                    
                    const applyServerData = (data) => {
                        if (data && data.items && Array.isArray(data.items) && data.items.length > 0) {
                            const mapped = data.items.map((row, idx) => ({
                                id: row[0] ? String(row[0]).trim() : `ID-${idx+1}`,
                                name: String(row[1] || '').trim(),
                                manufacturer: String(row[2] || '').trim(), 
                                mfgYear: Number(row[3]) || 2022,
                                lifespan: Number(row[4]) || 5,
                                color: String(row[5] || '').trim(), 
                                currentStock: Number(row[6]) || 0,
                                minStock: Number(row[7]) || 1
                            }));
                            setItems(mapped);
                            safeStorageSet('sigmat_items', mapped);
                        }
                        if (data && data.transactions && Array.isArray(data.transactions) && data.transactions.length > 0) {
                            const cleanTrans = data.transactions
                                .filter(row => row && (row[0] || row[1]))
                                .map((row, idx) => {
                                    const isStandardDate = ['-', '/', 'T'].some(k => String(row[0]).includes(k)) && (String(row[0]).includes('20') || String(row[0]).includes('19'));
                                    if (isStandardDate) {
                                        return {
                                            id: 'TR-GAS-' + (idx + 1),
                                            movementDate: String(row[0]),
                                            itemName: String(row[1] || '').trim(),
                                            type: String(row[2] || 'saída').trim(),
                                            quantity: Number(row[3]) || 1,
                                            bearer: {
                                                graduation: String(row[4] || '---').trim(),
                                                warName: String(row[5] || 'N/A').trim(),
                                                rg: String(row[6] || '---').trim()
                                            },
                                            recorder: {
                                                warName: String(row[7] || '---').trim(),
                                                rg: String(row[9] || '---').trim()
                                            },
                                            reason: String(row[8] || '').trim()
                                        };
                                    } else {
                                        return {
                                            id: 'TR-GAS-' + (idx + 1),
                                            movementDate: String(row[0] || '---').trim(),
                                            itemName: String(row[1] || '---').trim(),
                                            type: String(row[2] || 'REGISTRO').trim(),
                                            quantity: isNaN(Number(row[3])) ? 1 : Number(row[3]),
                                            bearer: {
                                                graduation: String(row[4] || row[0] || '---').trim(),
                                                warName: String(row[5] || row[1] || '---').trim(),
                                                rg: String(row[6] || row[2] || '---').trim()
                                            },
                                            recorder: {
                                                warName: String(row[7] || '---').trim(),
                                                rg: String(row[9] || '---').trim()
                                            },
                                            reason: String(row[8] || (row[3] && isNaN(Number(row[3])) ? row[3] : 'Registro anterior')).trim()
                                        };
                                    }
                                }).reverse();
                            
                            if (cleanTrans.length > 0) {
                                setTransactions(cleanTrans);
                                safeStorageSet('sigmat_transactions', cleanTrans);
                            }
                        }
                        setLoading(false);
                    };

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler(applyServerData)
                            .withFailureHandler((err) => {
                                console.warn("Falha leitura Apps Script:", err);
                                setLoading(false);
                            })
                            .getData();
                    } 
                    else if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
                        try {
                            const response = await fetch(`${SCRIPT_URL}?action=getData&t=${Date.now()}`);
                            const text = await response.text();
                            if(text.includes("<html") || text.includes("<HTML")) throw new Error("Blocked by CORS");
                            
                            const data = JSON.parse(text);
                            applyServerData(data);
                        } catch(e) {
                            console.warn("Sync offline, usando cache local persistido:", e);
                            setLoading(false);
                        }
                    }
                };

                useEffect(() => { syncWithServer(); }, []);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setAuthLoading(true);
                    setAuthError('');

                    const rg = e.target.rg.value;
                    const password = e.target.password.value;
                    const payload = authMode === 'login' 
                        ? { action: "authenticateOperator", rg, password }
                        : { action: "registerOperator", grad: e.target.grad.value, name: e.target.name.value, rg, password };

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        if (authMode === 'login') {
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro de ligação ao servidor.");
                            }).authenticateOperator({ rg, password });
                        } else {
                            const grad = e.target.grad.value; const name = e.target.name.value;
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro ao tentar registar.");
                            }).registerOperator({ grad, name, rg, password });
                        }
                    } else if (SCRIPT_URL) {
                        try {
                            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                            const res = await response.json();
                            if (res.success) {
                                setOperator(res.user); safeStorageSet('sigmat_operator', res.user);
                            } else { setAuthError(res.message); }
                        } catch (err) { setAuthError("Erro de comunicação com o servidor."); } 
                        finally { setAuthLoading(false); }
                    }
                };

                const handleLogout = () => {
                    setOperator(null);
                    safeStorageRemove('sigmat_operator');
                };

                // Navegação com foco e destaque de item no Prontuário
                const navigateToItem = (itemOrName) => {
                    const targetName = typeof itemOrName === 'string' ? itemOrName : (itemOrName?.name || '');
                    const cleanTarget = targetName.trim().toLowerCase();
                    const found = items.find(i => (i.name && i.name.trim().toLowerCase() === cleanTarget) || (itemOrName?.id && i.id === itemOrName.id));
                    
                    setCategoryFilter('TODOS');
                    setSearchTerm(found ? found.name.trim() : targetName.trim());
                    if (found) {
                        setHighlightedItemId(found.id);
                        setTimeout(() => setHighlightedItemId(null), 8000);
                    }
                    setActiveTab('inventory');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                const generatePDF = () => {
                    setIsGeneratingPDF(true);
                    setTimeout(async () => {
                        const element = document.getElementById('pdf-report-template');
                        const opt = {
                            margin:       [10, 10, 10, 10], 
                            filename:     `Relatorio_Operacional_SIGMAT_DBM1_${new Date().toISOString().split('T')[0]}.pdf`,
                            image:        { type: 'jpeg', quality: 0.98 },
                            html2canvas:  { scale: 2, useCORS: true, logging: false }, 
                            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] } 
                        };

                        try {
                            if (window.html2pdf) {
                                await window.html2pdf().set(opt).from(element).save();
                            } else {
                                throw new Error("Biblioteca html2pdf não carregada.");
                            }
                        } catch(err) {
                            console.error("Erro ao gerar PDF:", err);
                            alert("Ocorreu um erro ao gerar o PDF. Verifique se o bloqueador de pop-ups ou firewall permitiu o download.");
                        } finally {
                            setIsGeneratingPDF(false);
                        }
                    }, 300);
                };

                // Execução de Ações com Atualização Imediata e Sincronização em Background
                const handleAction = async (action, payload) => {
                    if (isSubmittingRef.current) return;
                    isSubmittingRef.current = true;
                    setIsSubmitting(true);
                    
                    try {
                        if (action === 'registerMovement') {
                            const updatedItems = items.map(i => i.id === payload.trans.itemId ? { ...i, currentStock: payload.newStock } : i);
                            const updatedTrans = [payload.trans, ...transactions];
                            setItems(updatedItems);
                            setTransactions(updatedTrans);
                            safeStorageSet('sigmat_items', updatedItems);
                            safeStorageSet('sigmat_transactions', updatedTrans);
                        } else if (action === 'saveItem') {
                            const exists = items.find(i => i.id === payload.item.id);
                            const updatedItems = exists 
                                ? items.map(i => i.id === payload.item.id ? payload.item : i) 
                                : [...items, payload.item];
                            setItems(updatedItems);
                            safeStorageSet('sigmat_items', updatedItems);
                        }

                        setIsModalOpen(false);
                        isSubmittingRef.current = false;
                        setIsSubmitting(false);

                        // Sincronização em segundo plano sem bloquear a interface do operador
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run
                                .withSuccessHandler(() => { setTimeout(syncWithServer, 1000); })
                                .withFailureHandler((err) => { console.warn("Sync GAS local falhou:", err); })
                                .executeAction({ action, ...payload });
                        } else if (SCRIPT_URL) {
                            try {
                                await fetch(SCRIPT_URL, { 
                                    method: 'POST', 
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ action, ...payload }) 
                                });
                                setTimeout(syncWithServer, 1500);
                            } catch (errPost) {
                                console.warn("Sync POST em segundo plano adiado:", errPost);
                            }
                        }

                    } catch (err) { 
                        console.error("Erro na operação:", err);
                        setIsModalOpen(false);
                        isSubmittingRef.current = false;
                        setIsSubmitting(false);
                    }
                };

                const saveItem = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const item = {
                        id: (selectedItem ? selectedItem.id : "ID-" + Date.now()),
                        name: f.name.value.trim(), 
                        manufacturer: f.manufacturer.value.trim(),
                        mfgYear: Number(f.mfgYear.value) || 2024, 
                        lifespan: Number(f.lifespan.value) || 5,
                        color: f.color.value.trim(), 
                        currentStock: Number(f.currentStock.value) || 0, 
                        minStock: Number(f.minStock.value) || 1
                    };
                    
                    const auditString = `${operator.grad} ${operator.name} (RG: ${operator.rg})`;
                    handleAction("saveItem", { item, auditUser: auditString });
                };

                // Registro Robusto de Movimentação e Avarias
                const registerMovement = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const targetItem = (modalType === 'damage' && selectedItem)
                        ? selectedItem
                        : (items.find(i => i.id === (f.itemId ? f.itemId.value : '')) || selectedItem || items[0]);

                    if (!targetItem) {
                        alert("Selecione um equipamento válido.");
                        return;
                    }

                    const qty = Math.max(1, Number(f.quantity?.value) || 1);
                    const finalType = modalType === 'damage' ? (f.type_alt?.value || 'AVARIA') : movementType;
                    
                    const newStock = (finalType === 'entrada')
                        ? (Number(targetItem.currentStock) + qty)
                        : (finalType === 'saída' ? Math.max(0, Number(targetItem.currentStock) - qty) : Number(targetItem.currentStock));

                    if (finalType === 'saída' && Number(targetItem.currentStock) < qty) {
                        alert("Atenção: Quantidade solicitada é superior ao saldo em carga disponível.");
                        return;
                    }

                    const auditUser = operator ? `${operator.grad} ${operator.name} (RG: ${operator.rg})` : 'FIEL DMOP';
                    const trans = {
                        id: 'TR-' + Date.now(),
                        itemId: targetItem.id,
                        itemName: targetItem.name,
                        type: finalType,
                        quantity: qty,
                        reason: f.reason?.value || (modalType === 'damage' ? 'Avaria reportada no prontuário' : 'Cautela operacional'),
                        movementDate: f.movementDate?.value || new Date().toISOString().split('T')[0],
                        bearer: { 
                            graduation: (f.b_grad && f.b_grad.value) ? f.b_grad.value : (operator ? operator.grad : "---"), 
                            warName: (f.b_name && f.b_name.value) ? f.b_name.value : (operator ? operator.name : "N/A"), 
                            rg: (f.b_rg && f.b_rg.value) ? f.b_rg.value : (operator ? operator.rg : "---") 
                        },
                        recorder: { 
                            warName: operator ? `${operator.grad} ${operator.name}` : "FIEL DMOP", 
                            rg: operator ? operator.rg : "---" 
                        }
                    };
                    
                    handleAction("registerMovement", { trans, newStock, auditUser });
                };

                // Classificação Especializada por Eixos Doutrinários do DBM1 / GOA
                const getItemCategory = (item) => {
                    if (!item) return 'outros';
                    const s = ((item.name || '') + ' ' + (item.manufacturer || '')).toLowerCase();
                    
                    // 1. 🚁 CIF / Helibalde (Bambi Bucket)
                    if (s.includes('helibalde') || s.includes('bambi') || s.includes('bucket') || s.includes('long line') || s.includes('long-line') || s.includes('carga externa')) {
                        return 'cif';
                    }
                    // 2. 📻 Telecomunicações (VHF Aéreo & Solo)
                    if (s.includes('radio') || s.includes('rádio') || s.includes('icom') || s.includes('hytera') || s.includes('hyrera') || s.includes('motorola') || s.includes('mtp850') || s.includes('transceptor')) {
                        return 'telecom';
                    }
                    // 3. 🪂 Puçá & Resgate Aéreo
                    if (s.includes('puçá') || s.includes('puca') || s.includes('puça') || s.includes('puç') || s.includes('cesto de resgate') || s.includes('maca envelope') || s.includes('sked') || s.includes('resgate cad')) {
                        return 'puca';
                    }
                    // 4. ⚡ Desencarceramento
                    if (s.includes('desencarcerador') || s.includes('akkuli') || s.includes('bpa285') || s.includes('gct4150') || s.includes('bch1') || s.includes('mcli') || s.includes('holmatro') || s.includes('lukas')) {
                        return 'desencarceramento';
                    }
                    // 5. 🌊 SAR Aquático / Mergulho
                    if (s.includes('neoprene') || s.includes('long jonh') || s.includes('long john') || s.includes('mergulho') || s.includes('nautico') || s.includes('náutico') || s.includes('blade sea') || s.includes('faca de perna') || s.includes('colete dip') || s.includes('colete gv') || s.includes('epaf') || s.includes('mares')) {
                        return 'aquatico';
                    }
                    // 6. 🏕️ Logística & Campanha
                    if (s.includes('balão') || s.includes('balao') || s.includes('ilumina') || s.includes('barraca') || s.includes('iglu') || s.includes('nepal') || s.includes('pantogr') || s.includes('facão') || s.includes('facao') || s.includes('gerador') || s.includes('cabo de energia bmc1') || s.includes('rabicho')) {
                        return 'logistica';
                    }
                    // 7. 🧗 SAR Altura / Vertical (CSMont/CCOA)
                    if (s.includes('freio') || s.includes('fita') || s.includes('ascensor') || s.includes('descensor') || s.includes('corda') || s.includes('baudrier') || s.includes('cinto') || s.includes('cabo guia') || s.includes('rope grab') || s.includes('distorcedor') || s.includes('mosquet') || s.includes('polia') || s.includes('placa') || s.includes('altiseg') || s.includes('conquista') || s.includes('alpen pass') || s.includes('innova') || s.includes('kong') || s.includes('petzl') || s.includes('task') || s.includes('capacete') || s.includes('adjust')) {
                        return 'altura';
                    }
                    // 8. 🦺 EPIs e Complementos
                    return 'outros';
                };

                const categoryCounts = useMemo(() => {
                    const counts = { TODOS: items.length, cif: 0, altura: 0, aquatico: 0, puca: 0, desencarceramento: 0, telecom: 0, logistica: 0, outros: 0 };
                    items.forEach(it => {
                        const cat = getItemCategory(it);
                        if (counts[cat] !== undefined) counts[cat]++;
                        else counts.outros++;
                    });
                    return counts;
                }, [items]);

                const OPERATIONAL_AXES = useMemo(() => [
                    { id: 'TODOS', label: 'Todos os Materiais', prefix: '📦', count: categoryCounts.TODOS, badgeColor: 'bg-slate-200 text-slate-800' },
                    { id: 'cif', label: 'CIF / Helibalde (Bambi Bucket)', prefix: '🚁', count: categoryCounts.cif, badgeColor: 'bg-red-100 text-red-700' },
                    { id: 'altura', label: 'SAR Altura / Vertical (CSMont/CCOA)', prefix: '🧗', count: categoryCounts.altura, badgeColor: 'bg-blue-100 text-blue-700' },
                    { id: 'aquatico', label: 'SAR Aquático / Mergulho', prefix: '🌊', count: categoryCounts.aquatico, badgeColor: 'bg-cyan-100 text-cyan-800' },
                    { id: 'puca', label: 'Puçá & Resgate Aéreo', prefix: '🪂', count: categoryCounts.puca, badgeColor: 'bg-emerald-100 text-emerald-800' },
                    { id: 'desencarceramento', label: 'Desencarceramento', prefix: '⚡', count: categoryCounts.desencarceramento, badgeColor: 'bg-amber-100 text-amber-800' },
                    { id: 'telecom', label: 'Telecomunicações (VHF Aéreo & Solo)', prefix: '📻', count: categoryCounts.telecom, badgeColor: 'bg-indigo-100 text-indigo-800' },
                    { id: 'logistica', label: 'Logística & Campanha', prefix: '🏕️', count: categoryCounts.logistica, badgeColor: 'bg-orange-100 text-orange-800' },
                    { id: 'outros', label: 'EPIs & Complementos', prefix: '🦺', count: categoryCounts.outros, badgeColor: 'bg-slate-100 text-slate-700' }
                ], [categoryCounts]);

                const filteredItems = useMemo(() => items.filter(i => {
                    const term = (searchTerm || '').trim().toLowerCase();
                    const matchSearch = !term || 
                        (i.name && i.name.toLowerCase().includes(term)) || 
                        (i.manufacturer && i.manufacturer.toLowerCase().includes(term)) ||
                        (i.color && i.color.toLowerCase().includes(term)) ||
                        (i.id && i.id.toLowerCase().includes(term));
                    const matchCategory = categoryFilter === 'TODOS' || getItemCategory(i) === categoryFilter;
                    return matchSearch && matchCategory;
                }), [items, searchTerm, categoryFilter]);

                if (!operator) {
                    return (
                        <div className="flex h-screen items-center justify-center bg-slate-900 p-4">
                            <div className="bg-white rounded-[3rem] p-10 w-full max-w-md text-center shadow-2xl animate-in zoom-in duration-500">
                                <div className="bg-blue-600 p-5 rounded-2xl inline-block shadow-lg mb-6">
                                    <Icon name="lock" className="w-12 h-12 text-white" />
                                </div>
                                <h1 className="text-3xl font-black text-blue-900 uppercase tracking-tighter mb-1">SIG-MAT</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mb-8">
                                    {authMode === 'login' ? 'Autenticação Operacional' : 'Novo Registo de Fiel'}
                                </p>
                                
                                {authError && (
                                    <div className="mb-6 p-3 bg-red-100 text-red-700 text-xs font-bold rounded-xl animate-pulse">
                                        {authError}
                                    </div>
                                )}

                                <form onSubmit={handleAuth} className="space-y-4 text-left">
                                    {authMode === 'register' && (
                                        <div className="grid grid-cols-3 gap-3 animate-in fade-in slide-in-from-top-4">
                                            <div className="col-span-1">
                                                <label className="text-[9px] font-black text-slate-400 uppercase block mb-1">Posto/Grad</label>
                                                <input name="grad" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: SGT" />
                                            </div>
                                            <div className="col-span-2">
                                                <label className="text-[9px] font-black text-slate-400 uppercase block mb-1">Nome de Guerra</label>
                                                <input name="name" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nome" />
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div>
                                        <label className="text-[9px] font-black text-blue-900 uppercase block mb-1">

                                                        <td className="border border-slate-300 p-2 font-bold">{t.movementDate}</td>
                                                        <td className="border border-slate-300 p-2 font-bold uppercase">{t.itemName}</td>
                                                        <td className="border border-slate-300 p-2 text-center font-black text-orange-700 uppercase bg-orange-50/50">{t.type}</td>
                                                        <td className="border border-slate-300 p-2 text-center font-bold">{t.quantity} un</td>
                                                        <td className="border border-slate-300 p-2 text-slate-700 italic">{t.reason}</td>
                                                        <td className="border border-slate-300 p-2 uppercase text-slate-600">{t.recorder ? t.recorder.warName : '---'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <p className="text-[9px] text-slate-500 italic p-2 border border-dashed border-slate-200 rounded">Sem registros de avaria ou manutenção pendente.</p>
                                    )}
                                </div>

                                {/* Bloco 4: Assinaturas Militares Regulamentares */}
                                <div className="mt-12 pt-6 border-t-2 border-slate-800 grid grid-cols-2 gap-8 text-center text-[10px] pdf-section">
                                    <div className="space-y-1">
                                        <div className="border-b border-slate-400 w-3/4 mx-auto pb-1 mb-2"></div>
                                        <p className="font-black uppercase text-slate-900">{operator ? `${operator.grad} ${operator.name}` : 'FIEL DE MATERIAL DMOP'}</p>
                                        <p className="text-[8px] font-bold text-slate-500 uppercase">Fiel de Material DMOP / DBM1 - RG: {operator ? operator.rg : '---'}</p>
                                    </div>
                                    <div className="space-y-1">
                                        <div className="border-b border-slate-400 w-3/4 mx-auto pb-1 mb-2"></div>
                                        <p className="font-black uppercase text-slate-900">OFICIAL DE OPERAÇÕES AÉREAS</p>
                                        <p className="text-[8px] font-bold text-slate-500 uppercase">Comandante de Operações / Chefe DMOP - GOA</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        } catch (err) {
            console.error("FATAL REACT CRASH:", err);
            const rootElement = document.getElementById('root');
            if (rootElement) {
                rootElement.innerHTML = `<div style="padding: 20px; color: red; font-family: sans-serif;"><h2>Erro Crítico na Aplicação</h2><pre>${err.toString()}</pre></div>`;
            }
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-MAT - Gestão de Carga Operacional</title>
    
    <!-- 1. USO DE CDNs (Cloudflare) COMUMENTE DESBLOQUEADOS EM REDES RESTRITAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .modal-content { border-radius: 1.5rem 1.5rem 0 0 !important; } }
        input, select, textarea { font-size: 16px !important; }
        .pointer-events-none { pointer-events: none; }
        
        .pdf-section { page-break-inside: avoid; }
        .pdf-row { page-break-inside: avoid; }
    </style>

    <!-- WATCHDOG: Deteta se os scripts principais foram bloqueados pela rede -->
    <script>
        window.onload = function() {
            setTimeout(function() {
                var root = document.getElementById('root');
                if (root && root.innerHTML.includes("A estabelecer ligação")) {
                    root.innerHTML = '<div style="display: flex; height: 100vh; align-items: center; justify-content: center; background-color: #f8fafc; padding: 20px;"><div style="background: white; border: 2px solid #ef4444; border-radius: 16px; padding: 30px; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);"><h2 style="color: #ef4444; font-family: sans-serif; margin-top: 0;">❌ Ligação Bloqueada pela Rede</h2><p style="font-family: sans-serif; color: #334155;">O sistema não conseguiu carregar as bibliotecas visuais (React/Tailwind). Isto ocorre porque a rede (Firewall corporativa/militar) está a bloquear ficheiros externos. Contacte a secção de informática.</p></div></div>';
                }
            }, 8000); // Aguarda 8 segundos antes de declarar falha de rede
        };
    </script>
</head>
<body>
    <div id="root">
        <div class="flex h-screen items-center justify-center bg-slate-50">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-blue-900 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-blue-900 font-bold animate-pulse uppercase tracking-tighter">A estabelecer ligação...</p>
            </div>
        </div>
    </div>

    <!-- Adicionado data-presets="react,env" para garantir suporte a código em browsers antigos -->
    <script type="text/babel" data-presets="react,env">
        try {
            const { useState, useEffect, useMemo, useRef } = React;

            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzd2tK8jWnw9hOOQY7bFDYo78MZMSPogTbPVVfaCOCHlgLGTtQ6Yix5awhLujtx7JU/exec";

            // Anti-crash reforçado para leitura de Cookies/Storage bloqueados
            const safeStorageGet = (key) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        const val = window.localStorage.getItem(key);
                        return val ? JSON.parse(val) : null;
                    }
                    return null;
                } catch (e) { return null; }
            };
            const safeStorageSet = (key, value) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        localStorage.setItem(key, JSON.stringify(value)); 
                    }
                } catch (e) {}
            };
            const safeStorageRemove = (key) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        localStorage.removeItem(key); 
                    }
                } catch (e) {}
            };

            const Icon = ({ name, className = "" }) => {
                const paths = {
                    dashboard: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
                    package: "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z M12 22V12",
                    history: "M12 8v4l3 3 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                    plus: "M12 5v14 M5 12h14",
                    search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
                    alert: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z",
                    shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
                    x: "M18 6L6 18 M6 6l12 12",
                    sync: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15",
                    clock: "M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                    edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
                    wrench: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
                    menu: "M4 6h16M4 12h16M4 18h16",
                    user: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
                    lock: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z",
                    arrow_right: "M14 5l7 7m0 0l-7 7m7-7H3",
                    download: "M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                };
                const finalClassName = className.includes('w-') ? className : `w-5 h-5 ${className}`;
                return (
                    <svg className={finalClassName.trim()} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d={paths[name] || ""}></path>
                    </svg>
                );
            };

            const App = () => {
                const [operator, setOperator] = useState(() => safeStorageGet('sigmat_operator'));
                const [authMode, setAuthMode] = useState('login'); 
                const [authError, setAuthError] = useState('');
                const [authLoading, setAuthLoading] = useState(false);

                const [activeTab, setActiveTab] = useState('dashboard');
                const [items, setItems] = useState([]);
                const [transactions, setTransactions] = useState([]);
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);
                
                const [isSubmitting, setIsSubmitting] = useState(false);
                const isSubmittingRef = useRef(false);

                const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

                const [isModalOpen, setIsModalOpen] = useState(false);
                const [modalType, setModalType] = useState('item');
                const [selectedItem, setSelectedItem] = useState(null);
                const [movementType, setMovementType] = useState('saída');
                const [searchTerm, setSearchTerm] = useState('');
                const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

                const stats = useMemo(() => {
                    const currentYear = new Date().getFullYear();
                    const criticalItems = items.filter(i => Number(i.currentStock) < Number(i.minStock));
                    const expiredItems = items.filter(i => {
                        const fab = Number(i.mfgYear);
                        const life = Number(i.lifespan);
                        return fab > 0 && life > 0 && (fab + life) <= currentYear;
                    });
                    const damageReports = transactions.filter(t => t.type === 'AVARIA' || t.type === 'ALTERAÇÃO' || t.type === 'MANUTENÇÃO');
                    return { totalItems: items.length, criticalItems, expiredItems, totalMovements: transactions.length, damageReports };
                }, [items, transactions]);

                const syncWithServer = async () => {
                    if (!operator) { setLoading(false); return; }
                    
                    setLoading(true);
                    setError(null);
                    
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((data) => {
                                if (data.items) {
                                    setItems(data.items.map(row => ({
                                        id: row[0], name: String(row[1] || ''), manufacturer: row[2] || '', 
                                        mfgYear: row[3] || '', lifespan: row[4] || '', color: row[5] || '', 
                                        currentStock: Number(row[6]) || 0, minStock: Number(row[7]) || 0
                                    })));
                                }
                                if (data.transactions) {
                                    setTransactions(data.transactions.map((row, idx) => ({
                                        id: idx.toString() + (row[0] || ''),
                                        movementDate: row[0], itemName: row[1], type: row[2], quantity: Number(row[3]),
                                        bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                                        recorder: { warName: row[7], rg: row[9] || "---" },
                                        reason: row[8]
                                    })).reverse());
                                }
                                setLoading(false);
                            })
                            .withFailureHandler((err) => {
                                setError("Falha ao ler dados da planilha.");
                                setLoading(false);
                            })
                            .getData();
                    } 
                    else if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
                        try {
                            const response = await fetch(`${SCRIPT_URL}?action=getData&t=${Date.now()}`);
                            const text = await response.text();
                            if(text.includes("<html") || text.includes("<HTML")) throw new Error("Blocked by CORS");
                            
                            const data = JSON.parse(text);
                            if (data.items) {
                                setItems(data.items.map(row => ({
                                    id: row[0], name: String(row[1] || ''), manufacturer: row[2] || '', 
                                    mfgYear: row[3] || '', lifespan: row[4] || '', color: row[5] || '', 
                                    currentStock: Number(row[6]) || 0, minStock: Number(row[7]) || 0
                                })));
                            }
                            if (data.transactions) {
                                setTransactions(data.transactions.map((row, idx) => ({
                                    id: idx.toString() + (row[0] || ''),
                                    movementDate: row[0], itemName: row[1], type: row[2], quantity: Number(row[3]),
                                    bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                                    recorder: { warName: row[7], rg: row[9] || "---" },
                                    reason: row[8]
                                })).reverse());
                            }
                            setLoading(false);
                        } catch(e) {
                            setError("Erro de ligação. O Apps Script deve estar partilhado para 'Qualquer Pessoa'.");
                            setLoading(false);
                        }
                    }
                };

                useEffect(() => { syncWithServer(); }, [operator]);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setAuthLoading(true);
                    setAuthError('');

                    const rg = e.target.rg.value;
                    const password = e.target.password.value;
                    const payload = authMode === 'login' 
                        ? { action: "authenticateOperator", rg, password }
                        : { action: "registerOperator", grad: e.target.grad.value, name: e.target.name.value, rg, password };

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        if (authMode === 'login') {
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro de ligação ao servidor.");
                            }).authenticateOperator({ rg, password });
                        } else {
                            const grad = e.target.grad.value; const name = e.target.name.value;
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro ao tentar registar.");
                            }).registerOperator({ grad, name, rg, password });
                        }
                    } else if (SCRIPT_URL) {
                        try {
                            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                            const res = await response.json();
                            if (res.success) {
                                setOperator(res.user); safeStorageSet('sigmat_operator', res.user);
                            } else { setAuthError(res.message); }
                        } catch (err) { setAuthError("Erro de comunicação com o servidor."); } 
                        finally { setAuthLoading(false); }
                    }
                };

                const handleLogout = () => {
                    setOperator(null);
                    safeStorageRemove('sigmat_operator');
                };

                const navigateToItem = (itemName) => {
                    setSearchTerm(itemName);
                    setActiveTab('inventory');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                const generatePDF = () => {
                    setIsGeneratingPDF(true);
                    const element = document.getElementById('pdf-report-template');

                    const opt = {
                        margin:       [15, 10, 15, 10], 
                        filename:     `Relatorio_SIGMAT_${new Date().toISOString().split('T')[0]}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, logging: false }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] } 
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        setIsGeneratingPDF(false);
                    }).catch(err => {
                        console.error("Erro ao gerar PDF:", err);
                        setIsGeneratingPDF(false);
                        alert("Ocorreu um erro ao gerar o PDF.");
                    });
                };

                const handleAction = async (action, payload) => {
                    if (isSubmittingRef.current) return;
                    isSubmittingRef.current = true;
                    setIsSubmitting(true);
                    
                    try {
                        if (action === 'registerMovement') {
                            setItems(prev => prev.map(i => i.id === payload.trans.itemId ? { ...i, currentStock: payload.newStock } : i));
                            setTransactions(prev => [{
                                ...payload.trans,
                                recorder: { ...payload.trans.recorder, rg: payload.trans.recorder.rg || "---" }
                            }, ...prev]);
                        } else if (action === 'saveItem') {
                            setItems(prev => {
                                const exists = prev.find(i => i.id === payload.item.id);
                                if (exists) return prev.map(i => i.id === payload.item.id ? payload.item : i);
                                return [...prev, payload.item];
                            });
                        }

                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run.withSuccessHandler(() => {
                                setIsModalOpen(false); isSubmittingRef.current = false; setIsSubmitting(false);
                                setTimeout(syncWithServer, 1500); 
                            }).withFailureHandler(() => {
                                alert("Falha na operação."); isSubmittingRef.current = false; setIsSubmitting(false); syncWithServer();
                            }).executeAction({ action, ...payload });
                        } else if (SCRIPT_URL) {
                            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
                            setIsModalOpen(false);
                            isSubmittingRef.current = false; setIsSubmitting(false);
                            setTimeout(syncWithServer, 1500);
                        }

                    } catch (err) { 
                        alert("Falha na operação. Verifique a sua conexão."); 
                        isSubmittingRef.current = false; setIsSubmitting(false);
                        await syncWithServer(); 
                    }
                };

                const saveItem = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const item = {
                        id: (selectedItem ? selectedItem.id : "ID-" + Date.now()),
                        name: f.name.value, manufacturer: f.manufacturer.value,
                        mfgYear: Number(f.mfgYear.value), lifespan: Number(f.lifespan.value),
                        color: f.color.value, currentStock: Number(f.currentStock.value), minStock: Number(f.minStock.value)
                    };
                    
                    const auditString = `${operator.grad} ${operator.name} (RG: ${operator.rg})`;
                    handleAction("saveItem", { item, auditUser: auditString });
                };

                const registerMovement = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const item = items.find(i => i.id === f.itemId.value);
                    const qty = Number(f.quantity.value);
                    const finalType = modalType === 'damage' ? f.type_alt.value : movementType;
                    
                    const newStock = (finalType === 'AVARIA' || finalType === 'ALTERAÇÃO' || finalType === 'MANUTENÇÃO') 
                        ? item.currentStock 
                        : (finalType === 'entrada' ? item.currentStock + qty : item.currentStock - qty);
                    
                    if (newStock < 0) {
                        alert("Erro: Carga insuficiente para efetuar saída.");
                        return;
                    }

                    const auditString = `${operator.grad} ${operator.name} (RG: ${operator.rg})`;
                    const trans = {
                        itemId: item.id, itemName: item.name, type: finalType,
                        quantity: qty, reason: f.reason.value, movementDate: f.movementDate.value,
                        bearer: { 
                            graduation: (f.b_grad && f.b_grad.value) ? f.b_grad.value : "---", 
                            warName: (f.b_name && f.b_name.value) ? f.b_name.value : "N/A", 
                            rg: (f.b_rg && f.b_rg.value) ? f.b_rg.value : "---" 
                        },
                        recorder: { warName: `${operator.grad} ${operator.name}`, rg: operator.rg }
                    };
                    
                    handleAction("registerMovement", { trans, newStock, auditUser: auditString });
                };

                const filteredItems = useMemo(() => items.filter(i => 
                    (i.name && i.name.toLowerCase().includes(searchTerm.toLowerCase())) || 
                    (i.manufacturer && i.manufacturer.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (i.color && i.color.toLowerCase().includes(searchTerm.toLowerCase()))
                ), [items, searchTerm]);

                if (!operator) {
                    return (
                        <div className="flex h-screen items-center justify-center bg-slate-900 p-4">
                            <div className="bg-white rounded-[3rem] p-10 w-full max-w-md text-center shadow-2xl animate-in zoom-in duration-500">
                                <div className="bg-blue-600 p-5 rounded-2xl inline-block shadow-lg mb-6">
                                    <Icon name="lock" className="w-12 h-12 text-white" />
                                </div>
                                <h1 className="text-3xl font-black text-blue-900 uppercase tracking-tighter mb-1">SIG-MAT</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mb-8">
                                    {authMode === 'login' ? 'Autenticação Operacional' : 'Novo Registo de Fiel'}
                                </p>
                                
                                {authError && (
                                    <div className="mb-6 p-3 bg-red-100 text-red-700 text-xs font-bold rounded-xl animate-pulse">
                                        {authError}
                                    </div>
                                )}

                                <form onSubmit={handleAuth} className="space-y-4 text-left">
                                    {authMode === 'register' && (
                                        <div className="grid grid-cols-3 gap-3 animate-in fade-in slide-in-from-top-4">
                                            <div className="col-span-1">
                                                <label className="text-[9px] font-black text-slate-400 uppercase block mb-1">Posto/Grad</label>
                                                <input name="grad" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: SGT" />
                                            </div>
                                            <div className="col-span-2">
                                                <label className="text-[9px] font-black text-slate-400 uppercase block mb-1">Nome de Guerra</label>
                                                <input name="name" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold uppercase outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nome" />
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div>
                                        <label className="text-[9px] font-black text-blue-900 uppercase block mb-1">
                                            {authMode === 'login' ? 'Login (RG do Militar)' : 'RG do Militar (Será o seu Login)'}
                                        </label>
                                        <input name="rg" required type="text" inputMode="numeric" pattern="[0-9]*" onInput={(e) => e.target.value = e.target.value.replace(/[^0-9]/g, '')} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 tracking-widest text-center" placeholder="Apenas Números" />
                                    </div>
                                    
                                    <div>
                                        <label className="text-[9px] font-black text-slate-400 uppercase block mb-1">Palavra-passe</label>
                                        <input name="password" type="password" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 tracking-widest text-center" placeholder="••••••••" />
                                    </div>

                                    <button type="submit" disabled={authLoading} className="w-full py-4 mt-6 bg-blue-900 text-white rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl hover:bg-blue-800 transition-all flex justify-center items-center gap-2 disabled:opacity-70">
                                        {authLoading ? <Icon name="sync" className="animate-spin" /> : <Icon name="shield" />}
                                        {authMode === 'login' ? 'Aceder ao Sistema' : 'Registar Conta e Aceder'}
                                    </button>
                                </form>
                                
                                <div className="mt-8 pt-6 border-t border-slate-100">
                                    <button 
                                        onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                                        className="text-[11px] font-bold text-slate-500 hover:text-blue-600 transition-colors uppercase tracking-widest"
                                    >
                                        {authMode === 'login' ? 'Criar Nova Conta' : 'Já tenho conta (Voltar ao Login)'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                const NavItems = () => (
                    <div className="space-y-2">
                        {[
                            {id:'dashboard', l:'Início', i:'dashboard'},
                            {id:'inventory', l:'Prontuário', i:'package'},
                            {id:'movements', l:'Registros', i:'history'}
                        ].map(t => (
                            <button key={t.id} onClick={() => { setActiveTab(t.id); setIsMobileMenuOpen(false); }} className={`flex items-center gap-3 w-full p-4 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === t.id ? 'bg-blue-800 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <Icon name={t.i} /> {t.l}
                            </button>
                        ))}
                    </div>
                );

                return (
                    <div className="flex h-screen overflow-hidden text-slate-800 bg-slate-50 flex-col lg:flex-row">
                        <header className="lg:hidden bg-slate-900 text-white p-4 flex items-center justify-between z-50">
                            <div className="flex items-center gap-2"><Icon name="shield" className="text-blue-500" /><h1 className="font-black text-sm uppercase">SIG-MAT</h1></div>

                                                </div>

                                                <div className="flex gap-3">
                                                    <div className="w-24"><label className="text-[8px] font-black text-slate-400 uppercase mb-1 block">Qtd</label><input name="quantity" required disabled={isSubmitting} type="number" min="1" className="w-full p-4 bg-white border border-slate-200 rounded-2xl text-center font-black text-lg h-14 outline-none disabled:opacity-50" defaultValue={1} /></div>
                                                    <div className="flex-1"><label className="text-[8px] font-black text-slate-400 uppercase mb-1 block">Finalidade / Detalhes</label><input name="reason" required disabled={isSubmitting} placeholder="Ex: Patrulhamento..." className="w-full p-4 bg-white border border-slate-200 rounded-2xl text-[10px] font-medium h-14 outline-none disabled:opacity-50" /></div>
                                                </div>
                                            </div>
                                            <button type="submit" disabled={isSubmitting} className={`w-full py-5 text-white rounded-3xl font-black uppercase text-[11px] flex items-center justify-center gap-2 ${movementType === 'saída'?'bg-red-700':'bg-green-700'} ${isSubmitting ? 'opacity-50' : ''}`}>
                                                {isSubmitting ? 'A PROCESSAR...' : 'Confirmar Lançamento'}
                                            </button>
                                        </form>
                                    )}
                                </div>
                            </div>
                        )}

                        <div style={{ position: 'absolute', top: '-9999px', left: '-9999px', zIndex: -100 }}>
                            <div id="pdf-report-template" className="bg-white" style={{ width: '715px', minHeight: '1000px', padding: '30px', boxSizing: 'border-box', color: '#0f172a' }}>
                                <div className="border-b-2 border-slate-800 pb-4 mb-8 flex justify-between items-end">
                                    <div>
                                        <h1 className="text-2xl font-black text-slate-900 uppercase tracking-tighter leading-none">SIG-MAT</h1>
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Relatório Operacional de Carga</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[11px] font-black uppercase text-slate-700">Data de Emissão: {new Date().toLocaleDateString('pt-PT')} {new Date().toLocaleTimeString('pt-PT').slice(0, 5)}</p>
                                        <p className="text-[9px] font-bold text-slate-500 uppercase mt-1">Operador Responsável: {operator ? `${operator.grad} ${operator.name}` : ''} (RG: {operator ? operator.rg : ''})</p>
                                    </div>
                                </div>

                                <div className="mb-8 pdf-section">
                                    <h2 className="text-sm font-black text-red-700 uppercase tracking-widest mb-3 border-l-4 border-red-600 pl-3">1. Necessidade de Reposição (Carga Crítica)</h2>
                                    {stats.criticalItems.length > 0 ? (
                                        <table className="w-full text-left border-collapse border border-slate-300">
                                            <thead className="bg-slate-200 text-slate-800">
                                                <tr>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Equipamento</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Fab. / Cor</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center">Mín. Exigido</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center">Em Carga</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center text-red-700">Défice</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {stats.criticalItems.map((i, idx) => (
                                                    <tr key={i.id} className={idx % 2 === 0 ? "bg-white pdf-row" : "bg-slate-50 pdf-row"}>
                                                        <td className="p-2 text-[10px] font-bold uppercase border border-slate-300">{i.name}</td>
                                                        <td className="p-2 text-[9px] uppercase border border-slate-300">{i.manufacturer} / {i.color}</td>
                                                        <td className="p-2 text-[10px] font-bold text-center border border-slate-300">{i.minStock}</td>
                                                        <td className="p-2 text-[10px] font-bold text-center border border-slate-300 text-red-600">{i.currentStock}</td>
                                                        <td className="p-2 text-[10px] font-black text-center border border-slate-300 text-red-700">
                                                            {Math.max(0, i.minStock - i.currentStock)} un
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : <p className="text-xs text-slate-500 uppercase italic p-2">Sem equipamentos em nível crítico no momento.</p>}
                                </div>

                                <div className="mb-8 pdf-section">
                                    <h2 className="text-sm font-black text-amber-600 uppercase tracking-widest mb-3 border-l-4 border-amber-500 pl-3">2. Prazos de Validade Expirados</h2>
                                    {stats.expiredItems.length > 0 ? (
                                        <table className="w-full text-left border-collapse border border-slate-300">
                                            <thead className="bg-slate-200 text-slate-800">
                                                <tr>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Equipamento</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center">Ano Fab.</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center">Vida Útil</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300 text-center text-amber-700">Ano Vencimento</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Ação Recomendada</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {stats.expiredItems.map((i, idx) => (
                                                    <tr key={i.id} className={idx % 2 === 0 ? "bg-white pdf-row" : "bg-slate-50 pdf-row"}>
                                                        <td className="p-2 text-[10px] font-bold uppercase border border-slate-300">{i.name}</td>
                                                        <td className="p-2 text-[10px] text-center border border-slate-300">{i.mfgYear}</td>
                                                        <td className="p-2 text-[10px] text-center border border-slate-300">{i.lifespan} anos</td>
                                                        <td className="p-2 text-[10px] font-bold text-center border border-slate-300 text-amber-600">
                                                            {Number(i.mfgYear) + Number(i.lifespan)}
                                                        </td>
                                                        <td className="p-2 text-[9px] font-black uppercase border border-slate-300">Recolher / Descartar</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : <p className="text-xs text-slate-500 uppercase italic p-2">Todos os equipamentos encontram-se dentro do prazo de validade.</p>}
                                </div>

                                <div className="mb-8 pdf-section">
                                    <h2 className="text-sm font-black text-orange-600 uppercase tracking-widest mb-3 border-l-4 border-orange-500 pl-3">3. Relatórios de Avaria e Alteração Técnica</h2>
                                    {stats.damageReports.length > 0 ? (
                                        <table className="w-full text-left border-collapse border border-slate-300">
                                            <thead className="bg-slate-200 text-slate-800">
                                                <tr>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Equipamento</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Data de Registo</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Descrição do Dano / Defeito</th>
                                                    <th className="p-2 text-[10px] font-black uppercase border border-slate-300">Ação Recomendada</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {stats.damageReports.map((t, idx) => (
                                                    <tr key={idx} className={idx % 2 === 0 ? "bg-white pdf-row" : "bg-slate-50 pdf-row"}>
                                                        <td className="p-2 text-[10px] font-bold uppercase border border-slate-300">{t.itemName}</td>
                                                        <td className="p-2 text-[10px] border border-slate-300">{new Date(t.movementDate).toLocaleDateString('pt-PT')}</td>
                                                        <td className="p-2 text-[9px] italic border border-slate-300">{t.reason}</td>
                                                        <td className="p-2 text-[9px] font-black uppercase border border-slate-300">Encaminhar p/ Manutenção</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : <p className="text-xs text-slate-500 uppercase italic p-2">Sem registos pendentes de avaria ou necessidade de manutenção.</p>}
                                </div>

                                <div className="mt-16 pt-8 border-t-2 border-slate-300 text-center pdf-section">
                                    <p className="text-[10px] text-slate-600 font-bold mb-8">
                                        Declaro que as informações constantes neste relatório representam o estado atual do sistema de carga na data e hora supracitadas.
                                    </p>
                                    <div className="w-64 border-b border-slate-800 mx-auto mb-2"></div>
                                    <p className="text-[10px] font-black uppercase text-slate-800">{operator ? `${operator.grad} ${operator.name}` : ''}</p>
                                    <p className="text-[9px] font-bold uppercase text-slate-500">RG: {operator ? operator.rg : ''} - Fiel Registrador</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);

        } catch (error) {
            // Em caso de erro interno de Javascript que antes era silencioso, este bloco vai apanhá-lo e desenhá-lo no ecrã.
            console.error("Erro Crítico Localizado:", error);
            document.getElementById('root').innerHTML = `
                <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background-color: #f8fafc; padding: 20px;">
                    <div style="background: white; border: 2px solid #ef4444; border-radius: 16px; padding: 30px; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                        <h2 style="color: #ef4444; font-family: sans-serif; margin-top: 0;">❌ Erro de Sistema Detetado</h2>
                        <p style="font-family: sans-serif; color: #334155; font-size: 14px;">O sistema tentou iniciar mas foi interrompido por um conflito no seu ambiente.</p>
                        <div style="background: #fee2e2; padding: 15px; border-radius: 8px; margin-top: 20px;">
                            <code style="color: #991b1b; font-size: 12px; word-break: break-all;">${error.message}</code>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>

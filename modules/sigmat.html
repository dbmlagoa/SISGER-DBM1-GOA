<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-MAT - Gestão de Carga Operacional</title>
    
    <!-- 1. USO DE CDNs (Cloudflare) COMUMENTE DESBLOQUEADOS EM REDES RESTRITAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .modal-content { border-radius: 1.5rem 1.5rem 0 0 !important; } }
        input, select, textarea { font-size: 16px !important; }
        .pointer-events-none { pointer-events: none; }
        
        .pdf-section { page-break-inside: avoid; break-inside: avoid; }
        .pdf-row { page-break-inside: avoid; break-inside: avoid; }
    </style>

    <!-- WATCHDOG: Deteta se os scripts principais foram bloqueados pela rede -->
    <script>
        window.onload = function() {
            setTimeout(function() {
                var root = document.getElementById('root');
                if (root && root.innerHTML.includes("A estabelecer ligação")) {
                    root.innerHTML = '<div style="display: flex; height: 100vh; align-items: center; justify-content: center; background-color: #f8fafc; padding: 20px;"><div style="background: white; border: 2px solid #ef4444; border-radius: 16px; padding: 30px; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);"><h2 style="color: #ef4444; font-family: sans-serif; margin-top: 0;">❌ Ligação Bloqueada pela Rede</h2><p style="font-family: sans-serif; color: #334155;">O sistema não conseguiu carregar as bibliotecas visuais (React/Tailwind). Isto ocorre porque a rede (Firewall corporativa/militar) está a bloquear ficheiros externos. Contacte a secção de informática.</p></div></div>';
                }
            }, 8000); // Aguarda 8 segundos antes de declarar falha de rede
        };
    </script>
</head>
<body>
    <div id="root">
        <div class="flex h-screen items-center justify-center bg-slate-50">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-blue-900 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-blue-900 font-bold animate-pulse uppercase tracking-tighter">A estabelecer ligação...</p>
            </div>
        </div>
    </div>

    <!-- Adicionado data-presets="react,env" para garantir suporte a código em browsers antigos -->
    <script type="text/babel" data-presets="react,env">
        try {
            const { useState, useEffect, useMemo, useRef } = React;

            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzd2tK8jWnw9hOOQY7bFDYo78MZMSPogTbPVVfaCOCHlgLGTtQ6Yix5awhLujtx7JU/exec";

            // Anti-crash reforçado para leitura de Cookies/Storage bloqueados
            const safeStorageGet = (key) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        const val = window.localStorage.getItem(key);
                        return val ? JSON.parse(val) : null;
                    }
                    return null;
                } catch (e) { return null; }
            };
            const safeStorageSet = (key, value) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        localStorage.setItem(key, JSON.stringify(value)); 
                    }
                } catch (e) {}
            };
            const safeStorageRemove = (key) => {
                try { 
                    if(typeof window !== 'undefined' && window.localStorage) {
                        localStorage.removeItem(key); 
                    }
                } catch (e) {}
            };

            const Icon = ({ name, className = "" }) => {
                const paths = {
                    dashboard: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
                    package: "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z M12 22V12",
                    history: "M12 8v4l3 3 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                    plus: "M12 5v14 M5 12h14",
                    search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
                    alert: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z",
                    shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
                    x: "M18 6L6 18 M6 6l12 12",
                    sync: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15",
                    clock: "M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
                    edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
                    wrench: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
                    menu: "M4 6h16M4 12h16M4 18h16",
                    user: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
                    lock: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z",
                    arrow_right: "M14 5l7 7m0 0l-7 7m7-7H3",
                    download: "M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4",
                    plane: "M12 19l9 2-9-18-9 18 9-2zm0 0v-8",
                    filter: "M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
                };
                const finalClassName = className.includes('w-') ? className : `w-5 h-5 ${className}`;
                return (
                    <svg className={finalClassName.trim()} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d={paths[name] || ""}></path>
                    </svg>
                );
            };

            const App = () => {
                const [operator, setOperator] = useState(() => safeStorageGet('sigmat_operator'));
                const [authMode, setAuthMode] = useState('login'); 
                const [authError, setAuthError] = useState('');
                const [authLoading, setAuthLoading] = useState(false);

                const [activeTab, setActiveTab] = useState('dashboard');
                const [items, setItems] = useState([]);
                const [transactions, setTransactions] = useState([]);
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);
                
                const [isSubmitting, setIsSubmitting] = useState(false);
                const isSubmittingRef = useRef(false);

                const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

                const [isModalOpen, setIsModalOpen] = useState(false);
                const [modalType, setModalType] = useState('item');
                const [selectedItem, setSelectedItem] = useState(null);
                const [movementType, setMovementType] = useState('saída');
                const [searchTerm, setSearchTerm] = useState('');
                const [categoryFilter, setCategoryFilter] = useState('TODOS');
                const [highlightedItemId, setHighlightedItemId] = useState(null);
                const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

                const stats = useMemo(() => {
                    const currentYear = new Date().getFullYear();
                    const criticalItems = items.filter(i => Number(i.currentStock) < Number(i.minStock));
                    const expiredItems = items.filter(i => {
                        const fab = Number(i.mfgYear);
                        const life = Number(i.lifespan);
                        return fab > 0 && life > 0 && (fab + life) <= currentYear;
                    });
                    const damageReports = transactions.filter(t => t.type === 'AVARIA' || t.type === 'ALTERAÇÃO' || t.type === 'MANUTENÇÃO');
                    return { totalItems: items.length, criticalItems, expiredItems, totalMovements: transactions.length, damageReports };
                }, [items, transactions]);

                const syncWithServer = async () => {
                    if (!operator) { setLoading(false); return; }
                    
                    setLoading(true);
                    setError(null);
                    
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((data) => {
                                if (data.items) {
                                    setItems(data.items.map(row => ({
                                        id: row[0], name: String(row[1] || ''), manufacturer: row[2] || '', 
                                        mfgYear: row[3] || '', lifespan: row[4] || '', color: row[5] || '', 
                                        currentStock: Number(row[6]) || 0, minStock: Number(row[7]) || 0
                                    })));
                                }
                                if (data.transactions) {
                                    setTransactions(data.transactions.map((row, idx) => ({
                                        id: idx.toString() + (row[0] || ''),
                                        movementDate: row[0], itemName: row[1], type: row[2], quantity: Number(row[3]),
                                        bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                                        recorder: { warName: row[7], rg: row[9] || "---" },
                                        reason: row[8]
                                    })).reverse());
                                }
                                setLoading(false);
                            })
                            .withFailureHandler((err) => {
                                setError("Falha ao ler dados da planilha.");
                                setLoading(false);
                            })
                            .getData();
                    } 
                    else if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
                        try {
                            const response = await fetch(`${SCRIPT_URL}?action=getData&t=${Date.now()}`);
                            const text = await response.text();
                            if(text.includes("<html") || text.includes("<HTML")) throw new Error("Blocked by CORS");
                            
                            const data = JSON.parse(text);
                            if (data.items) {
                                setItems(data.items.map(row => ({
                                    id: row[0], name: String(row[1] || ''), manufacturer: row[2] || '', 
                                    mfgYear: row[3] || '', lifespan: row[4] || '', color: row[5] || '', 
                                    currentStock: Number(row[6]) || 0, minStock: Number(row[7]) || 0
                                })));
                            }
                            if (data.transactions) {
                                setTransactions(data.transactions.map((row, idx) => ({
                                    id: idx.toString() + (row[0] || ''),
                                    movementDate: row[0], itemName: row[1], type: row[2], quantity: Number(row[3]),
                                    bearer: { graduation: row[4], warName: row[5], rg: row[6] },
                                    recorder: { warName: row[7], rg: row[9] || "---" },
                                    reason: row[8]
                                })).reverse());
                            }
                            setLoading(false);
                        } catch(e) {
                            setError("Erro de ligação. O Apps Script deve estar partilhado para 'Qualquer Pessoa'.");
                            setLoading(false);
                        }
                    }
                };

                useEffect(() => { syncWithServer(); }, [operator]);

                const handleAuth = async (e) => {
                    e.preventDefault();
                    setAuthLoading(true);
                    setAuthError('');

                    const rg = e.target.rg.value;
                    const password = e.target.password.value;
                    const payload = authMode === 'login' 
                        ? { action: "authenticateOperator", rg, password }
                        : { action: "registerOperator", grad: e.target.grad.value, name: e.target.name.value, rg, password };

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        if (authMode === 'login') {
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro de ligação ao servidor.");
                            }).authenticateOperator({ rg, password });
                        } else {
                            const grad = e.target.grad.value; const name = e.target.name.value;
                            google.script.run.withSuccessHandler((res) => {
                                setAuthLoading(false);
                                if (res.success) { setOperator(res.user); safeStorageSet('sigmat_operator', res.user); } 
                                else { setAuthError(res.message); }
                            }).withFailureHandler(() => {
                                setAuthLoading(false); setAuthError("Erro ao tentar registar.");
                            }).registerOperator({ grad, name, rg, password });
                        }
                    } else if (SCRIPT_URL) {
                        try {
                            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                            const res = await response.json();
                            if (res.success) {
                                setOperator(res.user); safeStorageSet('sigmat_operator', res.user);
                            } else { setAuthError(res.message); }
                        } catch (err) { setAuthError("Erro de comunicação com o servidor."); } 
                        finally { setAuthLoading(false); }
                    }
                };

                const handleLogout = () => {
                    setOperator(null);
                    safeStorageRemove('sigmat_operator');
                };

                const navigateToItem = (itemOrName) => {
                    const targetName = typeof itemOrName === 'string' ? itemOrName : (itemOrName?.name || '');
                    const found = items.find(i => (i.name && i.name.toLowerCase() === targetName.toLowerCase()) || (itemOrName?.id && i.id === itemOrName.id));
                    
                    setCategoryFilter('TODOS');
                    setSearchTerm(targetName);
                    if (found) {
                        setHighlightedItemId(found.id);
                        setTimeout(() => setHighlightedItemId(null), 6000);
                    }
                    setActiveTab('inventory');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                const generatePDF = () => {
                    setIsGeneratingPDF(true);
                    setTimeout(async () => {
                        const element = document.getElementById('pdf-report-template');
                        const opt = {
                            margin:       [10, 10, 10, 10], 
                            filename:     `Relatorio_Operacional_SIGMAT_DBM1_${new Date().toISOString().split('T')[0]}.pdf`,
                            image:        { type: 'jpeg', quality: 0.98 },
                            html2canvas:  { scale: 2, useCORS: true, logging: false }, 
                            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] } 
                        };

                        try {
                            if (window.html2pdf) {
                                await window.html2pdf().set(opt).from(element).save();
                            } else {
                                throw new Error("Biblioteca html2pdf não carregada.");
                            }
                        } catch(err) {
                            console.error("Erro ao gerar PDF:", err);
                            alert("Ocorreu um erro ao gerar o PDF. Verifique se o bloqueador de pop-ups ou firewall permitiu o download.");
                        } finally {
                            setIsGeneratingPDF(false);
                        }
                    }, 300);
                };

                const handleAction = async (action, payload) => {
                    if (isSubmittingRef.current) return;
                    isSubmittingRef.current = true;
                    setIsSubmitting(true);
                    
                    try {
                        if (action === 'registerMovement') {
                            setItems(prev => prev.map(i => i.id === payload.trans.itemId ? { ...i, currentStock: payload.newStock } : i));
                            setTransactions(prev => [{
                                ...payload.trans,
                                recorder: { ...payload.trans.recorder, rg: payload.trans.recorder.rg || "---" }
                            }, ...prev]);
                        } else if (action === 'saveItem') {
                            setItems(prev => {
                                const exists = prev.find(i => i.id === payload.item.id);
                                if (exists) return prev.map(i => i.id === payload.item.id ? payload.item : i);
                                return [...prev, payload.item];
                            });
                        }

                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run.withSuccessHandler(() => {
                                setIsModalOpen(false); isSubmittingRef.current = false; setIsSubmitting(false);
                                setTimeout(syncWithServer, 1500); 
                            }).withFailureHandler(() => {
                                alert("Falha na operação."); isSubmittingRef.current = false; setIsSubmitting(false); syncWithServer();
                            }).executeAction({ action, ...payload });
                        } else if (SCRIPT_URL) {
                            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
                            setIsModalOpen(false);
                            isSubmittingRef.current = false; setIsSubmitting(false);
                            setTimeout(syncWithServer, 1500);
                        }

                    } catch (err) { 
                        alert("Falha na operação. Verifique a sua conexão."); 
                        isSubmittingRef.current = false; setIsSubmitting(false);
                        await syncWithServer(); 
                    }
                };

                const saveItem = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const item = {
                        id: (selectedItem ? selectedItem.id : "ID-" + Date.now()),
                        name: f.name.value, manufacturer: f.manufacturer.value,
                        mfgYear: Number(f.mfgYear.value), lifespan: Number(f.lifespan.value),
                        color: f.color.value, currentStock: Number(f.currentStock.value), minStock: Number(f.minStock.value)
                    };
                    
                    const auditString = `${operator.grad} ${operator.name} (RG: ${operator.rg})`;
                    handleAction("saveItem", { item, auditUser: auditString });
                };

                const registerMovement = (e) => {
                    e.preventDefault();
                    if (isSubmittingRef.current) return;

                    const f = e.target;
                    const item = items.find(i => i.id === f.itemId.value);
                    const qty = Number(f.quantity.value);
                    const finalType = modalType === 'damage' ? f.type_alt.value : movementType;
                    
                    const newStock = (finalType === 'AVARIA' || finalType === 'ALTERAÇÃO' || finalType === 'MANUTENÇÃO') 
                        ? item.currentStock 
                        : (finalType === 'entrada' ? item.currentStock + qty : item.currentStock - qty);
                    
                    if (newStock < 0) {
                        alert("Erro: Carga insuficiente para efetuar saída.");
                        return;
                    }

                    const auditString = `${operator.grad} ${operator.name} (RG: ${operator.rg})`;
                    const trans = {
                        itemId: item.id, itemName: item.name, type: finalType,
                        quantity: qty, reason: f.reason.value, movementDate: f.movementDate.value,
                        bearer: { 
                            graduation: (f.b_grad && f.b_grad.value) ? f.b_grad.value : "---", 
                            warName: (f.b_name && f.b_name.value) ? f.b_name.value : "N/A", 
                            rg: (f.b_rg && f.b_rg.value) ? f.b_rg.value : "---" 
                        },
                        recorder: { warName: `${operator.grad} ${operator.name}`, rg: operator.rg }
                    };
                    
                    handleAction("registerMovement", { trans, newStock, auditUser: auditString });
                };

                // Classificação Especializada por Eixos Doutrinários do DBM1 / GOA
                const getItemCategory = (item) => {
                    if (!item) return 'outros';
                    const s = ((item.name || '') + ' ' + (item.manufacturer || '')).toLowerCase();
                    
                    // 1. 🚁 CIF / Helibalde (Bambi Bucket)
                    if (s.includes('helibalde') || s.includes('bambi') || s.includes('bucket') || s.includes('long line') || s.includes('long-line') || s.includes('carga externa')) {
                        return 'cif';
                    }
                    // 2. 📻 Telecomunicações (VHF Aéreo & Solo)
                    if (s.includes('radio') || s.includes('rádio') || s.includes('icom') || s.includes('hytera') || s.includes('hyrera') || s.includes('motorola') || s.includes('mtp850') || s.includes('transceptor')) {
                        return 'telecom';
                    }
                    // 3. 🪂 Puçá & Resgate Aéreo
                    if (s.includes('puçá') || s.includes('puca') || s.includes('puça') || s.includes('puç') || s.includes('cesto de resgate') || s.includes('maca envelope') || s.includes('sked') || s.includes('resgate cad')) {
                        return 'puca';
                    }
                    // 4. ⚡ Desencarceramento
                    if (s.includes('desencarcerador') || s.includes('akkuli') || s.includes('bpa285') || s.includes('gct4150') || s.includes('bch1') || s.includes('mcli') || s.includes('holmatro') || s.includes('lukas')) {
                        return 'desencarceramento';
                    }
                    // 5. 🌊 SAR Aquático / Mergulho
                    if (s.includes('neoprene') || s.includes('long jonh') || s.includes('long john') || s.includes('mergulho') || s.includes('nautico') || s.includes('náutico') || s.includes('blade sea') || s.includes('faca de perna') || s.includes('colete dip') || s.includes('colete gv') || s.includes('epaf') || s.includes('mares')) {
                        return 'aquatico';
                    }
                    // 6. 🏕️ Logística & Campanha
                    if (s.includes('balão') || s.includes('balao') || s.includes('ilumina') || s.includes('barraca') || s.includes('iglu') || s.includes('nepal') || s.includes('pantogr') || s.includes('facão') || s.includes('facao') || s.includes('gerador') || s.includes('cabo de energia bmc1') || s.includes('rabicho')) {
                        return 'logistica';
                    }
                    // 7. 🧗 SAR Altura / Vertical (CSMont/CCOA)
                    if (s.includes('freio') || s.includes('fita') || s.includes('ascensor') || s.includes('descensor') || s.includes('corda') || s.includes('baudrier') || s.includes('cinto') || s.includes('cabo guia') || s.includes('rope grab') || s.includes('distorcedor') || s.includes('mosquet') || s.includes('polia') || s.includes('placa') || s.includes('altiseg') || s.includes('conquista') || s.includes('alpen pass') || s.includes('innova') || s.includes('kong') || s.includes('petzl') || s.includes('task') || s.includes('capacete') || s.includes('adjust')) {
                        return 'altura';
                    }
                    // 8. 🦺 EPIs e Complementos
                    return 'outros';
                };

                const categoryCounts = useMemo(() => {
                    const counts = { TODOS: items.length, cif: 0, altura: 0, aquatico: 0, puca: 0, desencarceramento: 0, telecom: 0, logistica: 0, outros: 0 };
                    items.forEach(it => {
                        const cat = getItemCategory(it);
                        if (counts[cat] !== undefined) counts[cat]++;
                        else counts.outros++;
                    });
                    return counts;
                }, [items]);

                const OPERATIONAL_AXES = useMemo(() => [
                    { id: 'TODOS', label: 'Todos os Materiais', prefix: '📦', count: categoryCounts.TODOS, badgeColor: 'bg-slate-200 text-slate-800' },
                    { id: 'cif', label: 'CIF / Helibalde (Bambi Bucket)', prefix: '🚁', count: categoryCounts.cif, badgeColor: 'bg-red-100 text-red-700' },
                    { id: 'altura', label: 'SAR Altura / Vertical (CSMont/CCOA)', prefix: '🧗', count: categoryCounts.altura, badgeColor: 'bg-blue-100 text-blue-700' },
                    { id: 'aquatico', label: 'SAR Aquático / Mergulho', prefix: '🌊', count: categoryCounts.aquatico, badgeColor: 'bg-cyan-100 text-cyan-800' },

                        <h2 style="color: #ef4444; font-family: sans-serif; margin-top: 0;">❌ Erro de Sistema Detetado</h2>
                        <p style="font-family: sans-serif; color: #334155; font-size: 14px;">O sistema tentou iniciar mas foi interrompido por um conflito no seu ambiente.</p>
                        <div style="background: #fee2e2; padding: 15px; border-radius: 8px; margin-top: 20px;">
                            <code style="color: #991b1b; font-size: 12px; word-break: break-all;">${error.message}</code>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
